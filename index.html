t:1.45; }\n  .cjk { font-family:'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif; }\n  .jp { color:var(--jp); font-weight:600; }\n  .zh { color:var(--zh); font-weight:600; }\n  .romaji { font-style:italic; color:var(--muted); }\n  header { border-bottom:3px solid var(--ink); padding-bottom:9px; margin-bottom:12px;\n           display:flex; align-items:flex-end; justify-content:space-between; }\n  header .title h1 { font-size:20px; font-weight:800; letter-spacing:-0.4px; color:var(--ink); }\n  header .title .sub { font-size:9.6px; color:var(--red); font-weight:600; margin-top:2px; }\n  header .mark { text-align:right; font-size:8.5px; color:var(--muted); line-height:1.4; }\n  header .mark .kanji { font-size:25px; color:var(--red); font-weight:700; display:block; margin-bottom:2px; }\n  h2 { font-size:11.5px; color:var(--ink); font-weight:800; margin:12px 0 6px;\n       padding-left:8px; border-left:4px solid var(--red); text-transform:uppercase; letter-spacing:0.5px; }\n  h2:first-of-type { margin-top:0; }\n  .concept { background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">挨<\/div><div><h1>Core Survival & Greetings<\/h1><div class=\"st\">Greetings, politeness, phone<\/div><\/div><\/div>\n<h2>Core survival &mdash; the non-negotiables<\/h2>\n<div class=\"concept\"><div class=\"big\">\nIf you learn nothing else, learn these. <span class=\"cjk jp\">すみません<\/span> alone carries half a trip &mdash; it means\n\"excuse me,\" \"sorry,\" and \"hey, over here\" at once. Kanji/kana first since you read it; romaji below.\n<\/div><\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">すみません<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">Excuse me / sorry / thanks &mdash; the Swiss-army word<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ありがとうございます<\/span> <span class=\"exr\">arigatō gozaimasu<\/span><\/td><td class=\"exe\">Thank you (polite full form)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お願いします<\/span> <span class=\"exr\">onegaishimasu<\/span><\/td><td class=\"exe\">Please / I'd like this &mdash; attach to anything<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">大丈夫です<\/span> <span class=\"exr\">daijōbu desu<\/span><\/td><td class=\"exe\">It's fine / I'm OK / no thanks<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">はい / いいえ<\/span> <span class=\"exr\">hai / iie<\/span><\/td><td class=\"exe\">Yes / no (はい is closer to \"I hear you\")<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Greetings by time of day<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">おはようございます<\/span> <span class=\"exr\">ohayō gozaimasu<\/span><\/td><td class=\"exe\">Good morning (until ~10am) &mdash; your ryokan greeting<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">こんにちは<\/span> <span class=\"exr\">konnichiwa<\/span><\/td><td class=\"exe\">Hello (~10am&ndash;5pm)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">こんばんは<\/span> <span class=\"exr\">konbanwa<\/span><\/td><td class=\"exe\">Good evening (after dark) &mdash; your yatai greeting<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">はじめまして<\/span> <span class=\"exr\">hajimemashite<\/span><\/td><td class=\"exe\">Nice to meet you (first meeting only)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おやすみなさい<\/span> <span class=\"exr\">oyasuminasai<\/span><\/td><td class=\"exe\">Goodnight<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>When you're lost in the conversation<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">英語は話せますか<\/span> <span class=\"exr\">eigo wa hanasemasu ka<\/span><\/td><td class=\"exe\">Do you speak English? &mdash; asking it in Japanese lands better<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">日本語が少しわかります<\/span> <span class=\"exr\">nihongo ga sukoshi wakarimasu<\/span><\/td><td class=\"exe\">I understand a little Japanese &mdash; shifts people into slower, simpler speech<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ゆっくりお願いします<\/span> <span class=\"exr\">yukkuri onegaishimasu<\/span><\/td><td class=\"exe\">Slowly, please &mdash; the highest-leverage request you can make<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">もう一度お願いします<\/span> <span class=\"exr\">mō ichido onegaishimasu<\/span><\/td><td class=\"exe\">One more time, please<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">わかりました / わかりません<\/span> <span class=\"exr\">wakarimashita / wakarimasen<\/span><\/td><td class=\"exe\">Got it / I don't understand<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>On the phone<\/h2>\n<div class=\"note\" style=\"margin-top:0\">Phone calls are the hardest mode &mdash; no gestures, no menu to point at. Prefer email, a booking site, or your hotel front desk for reservations. For the short practical calls, these do the job.<\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">もしもし<\/span> <span class=\"exr\">moshi moshi<\/span><\/td><td class=\"exe\">Hello &mdash; on the phone only, never in person<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">予約をお願いします<\/span> <span class=\"exr\">yoyaku o onegaishimasu<\/span><\/td><td class=\"exe\">I'd like to make a reservation<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">十二月三日、七時、二人です<\/span> <span class=\"exr\">jūni-gatsu mikka, shichi-ji, futari desu<\/span><\/td><td class=\"exe\">\"Dec 3rd, 7 o'clock, two people\" &mdash; the template; swap the numbers, write it out first<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">少し遅れます<\/span> <span class=\"exr\">sukoshi okuremasu<\/span><\/td><td class=\"exe\">I'll be a little late &mdash; the most useful call you'll make<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">キャンセルしたいです<\/span> <span class=\"exr\">kyanseru shitai desu<\/span><\/td><td class=\"exe\">I'd like to cancel &mdash; do call; no-shows are a big deal at small places<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/body><\/html>"}, {"id": "kana", "title": "Kana Starter", "kanji": "仮", "sub": "Read the script — hiragana & katakana", "section": "lang", "group": "Reading the script", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  :root{\n    --paper:#FBF8F2;\n    --ink:#1C1A17;\n    --shu:#C8352B;          /* vermilion — genkō-yōshi red / hanko ink */\n    --shu-soft:#E9C6C1;\n    --muted:#7A736A;\n    --line:#E4DCCE;\n    --line2:#EFE8DB;\n  }\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{\n    margin:0;\n    background:var(--paper);\n    color:var(--ink);\n    font-family:\"Zen Kaku Gothic New\",\"Hiragino Kaku Gothic ProN\",\"Yu Gothic\",\"Noto Sans JP\",system-ui,sans-serif;\n    font-weight:400;\n    line-height:1.5;\n    -webkit-font-smoothing:antialiased;\n  }\n  .kana{font-family:\"Zen Kaku Gothic New\",\"Hiragino Kaku Gothic ProN\",\"Yu Gothic\",\"Noto Sans JP\",sans-serif;}\n  .wrap{max-width:900px;margin:0 auto;padding:40px 34px 64px;}\n\n  /* ---- Masthead ---- */\n  header{position:relative;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px;}\n  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--shu);font-weight:700;margin:0 0 10px;}\n  h1{font-family:\"Zen Old Mincho\",serif;font-weight:700;font-size:40px;line-height:1.02;margin:0;letter-spacing:.01em;}\n  h1 .jp{font-family:\"Zen Kaku Gothic New\",sans-serif;font-weight:500;font-size:.62em;color:var(--shu);margin-left:.35em;}\n  .sub{margin:12px 0 0;color:var(--muted);font-size:14px;max-width:60ch;}\n  .stamp{\n    position:absolute;top:2px;right:0;width:74px;height:74px;border:2.5px solid var(--shu);border-radius:8px;\n    color:var(--shu);display:flex;align-items:center;justify-content:center;text-align:center;\n    font-family:\"Zen Old Mincho\",serif;font-weight:700;font-size:26px;transform:rotate(-4deg);line-height:1.05;\n  }\n\n  /* ---- How to use ---- */\n  .howto{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 30px;}\n  .howto .cell{background:var(--paper);padding:12px 14px;}\n  .howto .n{font-family:\"Zen Old Mincho\",serif;color:var(--shu);font-weight:700;font-size:15px;}\n  .howto p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4;}\n\n  /* ---- Section headers ---- */\n  .sec{display:flex;align-items:baseline;gap:14px;margin:0 0 14px;}\n  .sec h2{font-family:\"Zen Old Mincho\",serif;font-size:23px;margin:0;font-weight:700;}\n  .sec .romaji{color:var(--shu);font-weight:700;font-size:13px;letter-spacing:.06em;}\n  .sec .rule{flex:1;height:1px;background:var(--line);align-self:center;}\n  .sec .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}\n\n  section{margin-bottom:38px;}\n\n  /* ---- Kana grid ---- */\n  .grid{display:grid;grid-template-columns:34px repeat(5,1fr);gap:6px;}\n  .colhead{display:grid;grid-template-columns:34px repeat(5,1fr);gap:6px;margin-bottom:6px;}\n  .colhead span{text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--shu);text-transform:uppercase;}\n  .colhead span:first-child{background:none;}\n  .rowlab{\n    writing-mode:vertical-rl;text-orientation:mixed;display:flex;align-items:center;justify-content:center;\n    font-size:11px;font-weight:700;color:var(--shu);letter-spacing:.12em;text-transform:uppercase;\n  }\n  .cellK{\n    background:#fff;border:1px solid var(--line);border-left:3px solid var(--shu-soft);\n    padding:7px 4px 6px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:flex-start;\n  }\n  .cellK.blank{background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--line2) 6px,var(--line2) 7px);border-left-color:var(--line);}\n  .cellK .ch{font-size:30px;line-height:1;font-weight:500;}\n  .cellK .rm{font-size:12px;font-weight:700;color:var(--ink);margin-top:3px;letter-spacing:.02em;}\n  .cellK .mn{font-size:10px;color:var(--muted);line-height:1.2;margin-top:3px;}\n\n  .solo{margin-top:8px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--shu);padding:8px 14px;}\n  .solo .ch{font-size:30px;font-weight:500;}\n  .solo .rm{font-weight:700;font-size:14px;color:var(--shu);}\n  .solo .mn{font-size:12px;color:var(--muted);}\n\n  /* ---- Modifiers / notes ---- */\n  .panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  .panel{border:1px solid var(--line);background:#fff;padding:14px 16px;}\n  .panel h3{margin:0 0 8px;font-family:\"Zen Old Mincho\",serif;font-size:15px;}\n  .panel h3 em{font-style:normal;color:var(--shu);font-size:12px;font-weight:700;margin-left:6px;}\n  .panel p{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45;}\n  .panel p .k{font-size:15px;}\n  .panel .ex{color:var(--muted);}\n  .warn{border-left:3px solid var(--shu);}\n  .pair{font-size:15px;}\n  .pair b{color:var(--shu);}\n\n  /* ---- Reading drills ---- */\n  .day{border:1px solid var(--line);background:#fff;margin-bottom:12px;break-inside:avoid;}\n  .day .hd{display:flex;align-items:center;gap:12px;background:#FCF3F1;border-bottom:1px solid var(--line);padding:8px 14px;}\n  .day .num{font-family:\"Zen Old Mincho\",serif;font-weight:700;color:var(--shu);font-size:15px;white-space:nowrap;}\n  .day .what{font-size:12px;color:var(--muted);}\n  .day .words{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}\n  .w{padding:8px 14px;border-top:1px solid var(--line2);border-right:1px solid var(--line2);}\n  .w:nth-child(3n){border-right:none;}\n  .w:nth-child(-n+3){border-top:none;}\n  .w .k{font-size:19px;font-weight:500;line-height:1.1;}\n  .w .r{font-size:11px;color:var(--shu);font-weight:700;letter-spacing:.02em;}\n  .w .m{font-size:11px;color:var(--muted);}\n\n  .phrase .words{grid-template-columns:1fr 1fr;}\n  .phrase .w:nth-child(3n){border-right:1px solid var(--line2);}\n  .phrase .w:nth-child(2n){border-right:none;}\n  .phrase .w:nth-child(-n+2){border-top:none;}\n  .phrase .w .k{font-size:17px;}\n\n  .setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:#fff;}\n\n  footer{border-top:2px solid var(--ink);margin-top:34px;padding-top:12px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}\n\n  .printbtn{\n    position:fixed;bottom:20px;right:20px;background:var(--shu);color:#fff;border:none;border-radius:999px;\n    padding:12px 20px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18);\n  }\n  .printbtn:hover{background:#a82a22;}\n\n  @media (max-width:640px){\n    .wrap{padding:26px 16px 48px;}\n    h1{font-size:30px;}\n    .stamp{width:56px;height:56px;font-size:19px;}\n    .howto{grid-template-columns:1fr;}\n    .panels{grid-template-columns:1fr;}\n    .cellK .ch{font-size:26px;}\n    .cellK{min-height:66px;}\n    .day .words,.setgrid{grid-template-columns:repeat(2,1fr);}\n    .w:nth-child(3n){border-right:1px solid var(--line2);}\n    .w:nth-child(2n){border-right:none;}\n  }\n\n  @media print{\n    @page{margin:14mm;}\n    body{background:#fff;}\n    .wrap{max-width:none;padding:0;}\n    .printbtn{display:none;}\n    .cellK,.day,.panel,.setgrid,.solo{box-shadow:none;}\n    section{break-inside:avoid;}\n    .pagebreak{break-before:page;}\n    a{color:inherit;text-decoration:none;}\n  }\n<\/style><\/head><body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div class=\"stamp\">仮名<\/div>\n    <p class=\"eyebrow\">Japan Trip · Phase 1<\/p>\n    <h1>Kana Starter Sheet<span class=\"jp\">かな<\/span><\/h1>\n    <p class=\"sub\">Recognize the two phonetic scripts by sight — no handwriting. Learn one row a day with the mnemonic, drill it, then read the day's words out loud. Hiragana first week, katakana second.<\/p>\n  <\/header>\n\n  <div class=\"howto\">\n    <div class=\"cell\"><span class=\"n\">Learn<\/span><p>Read the row + mnemonic. The mnemonic is a hook, not a rule — swap in your own if one lands better.<\/p><\/div>\n    <div class=\"cell\"><span class=\"n\">Drill<\/span><p>Quiz new + due characters in an SRS (Renshuu / any kana app). Aim for shape → sound, fast.<\/p><\/div>\n    <div class=\"cell\"><span class=\"n\">Read<\/span><p>Work that day's word block below. Only characters you've already met appear — say each word aloud.<\/p><\/div>\n  <\/div>\n\n  <!-- HIRAGANA -->\n  <section>\n    <div class=\"sec\"><h2>Hiragana<\/h2><span class=\"romaji\">ひらがな<\/span><span class=\"rule\"><\/span><span class=\"tag\">Week 1 · native sounds<\/span><\/div>\n    <div class=\"colhead\"><span><\/span><span>a<\/span><span>i<\/span><span>u<\/span><span>e<\/span><span>o<\/span><\/div>\n    <div class=\"grid\">\n      <!-- a -->\n      <div class=\"rowlab\">— a<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">あ<\/div><div class=\"rm\">a<\/div><div class=\"mn\">curly capital \"A\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">い<\/div><div class=\"rm\">i<\/div><div class=\"mn\">two \"ee\" reeds<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">う<\/div><div class=\"rm\">u<\/div><div class=\"mn\">nodding \"ooh\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">え<\/div><div class=\"rm\">e<\/div><div class=\"mn\">\"exotic\" bird beak<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">お<\/div><div class=\"rm\">o<\/div><div class=\"mn\">\"A\" + a golf swing tail<\/div><\/div>\n      <!-- ka -->\n      <div class=\"rowlab\">K<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">か<\/div><div class=\"rm\">ka<\/div><div class=\"mn\">a \"car\" key + spark<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">き<\/div><div class=\"rm\">ki<\/div><div class=\"mn\">a \"key\" with teeth<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">く<\/div><div class=\"rm\">ku<\/div><div class=\"mn\">\"cuckoo\" beak<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">け<\/div><div class=\"rm\">ke<\/div><div class=\"mn\">a \"keg\" on its side<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">こ<\/div><div class=\"rm\">ko<\/div><div class=\"mn\">two \"cocoon\" lines<\/div><\/div>\n      <!-- sa -->\n      <div class=\"rowlab\">S<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">さ<\/div><div class=\"rm\">sa<\/div><div class=\"mn\">a \"sardine\" hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">し<\/div><div class=\"rm\">shi<\/div><div class=\"mn\">a fishing line, \"sheee\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">す<\/div><div class=\"rm\">su<\/div><div class=\"mn\">a loop \"swing\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">せ<\/div><div class=\"rm\">se<\/div><div class=\"mn\">a \"say-so\" finger<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">そ<\/div><div class=\"rm\">so<\/div><div class=\"mn\">zig-zag \"sewing\" thread<\/div><\/div>\n      <!-- ta -->\n      <div class=\"rowlab\">T<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">た<\/div><div class=\"rm\">ta<\/div><div class=\"mn\">\"ta-da!\" cross + hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ち<\/div><div class=\"rm\">chi<\/div><div class=\"mn\">a \"cheery\" chin<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">つ<\/div><div class=\"rm\">tsu<\/div><div class=\"mn\">a \"tsunami\" curl<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">て<\/div><div class=\"rm\">te<\/div><div class=\"mn\">a hand \"te-lling\" the way<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">と<\/div><div class=\"rm\">to<\/div><div class=\"mn\">a \"toe\" on a nail<\/div><\/div>\n      <!-- na -->\n      <div class=\"rowlab\">N<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">な<\/div><div class=\"rm\">na<\/div><div class=\"mn\">a \"nun\" kneeling<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">に<\/div><div class=\"rm\">ni<\/div><div class=\"mn\">an \"i\" with a \"knee\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ぬ<\/div><div class=\"rm\">nu<\/div><div class=\"mn\">tangled \"noo-dles\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ね<\/div><div class=\"rm\">ne<\/div><div class=\"mn\">a cat-tail loop, \"neko\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">の<\/div><div class=\"rm\">no<\/div><div class=\"mn\">a \"no-entry\" spiral<\/div><\/div>\n      <!-- ha -->\n      <div class=\"rowlab\">H<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">は<\/div><div class=\"rm\">ha<\/div><div class=\"mn\">an \"H\" + loop, \"ha!\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ひ<\/div><div class=\"rm\">hi<\/div><div class=\"mn\">a wide \"hee\" smile<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ふ<\/div><div class=\"rm\">fu<\/div><div class=\"mn\">scattered Mt. \"Fu-ji\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">へ<\/div><div class=\"rm\">he<\/div><div class=\"mn\">a hill you're \"heading\" up<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ほ<\/div><div class=\"rm\">ho<\/div><div class=\"mn\">は + a bar, \"ho ho\"<\/div><\/div>\n      <!-- ma -->\n      <div class=\"rowlab\">M<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ま<\/div><div class=\"rm\">ma<\/div><div class=\"mn\">a \"mama\" bow knot<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">み<\/div><div class=\"rm\">mi<\/div><div class=\"mn\">a winding \"21\" path<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">む<\/div><div class=\"rm\">mu<\/div><div class=\"mn\">a cow, \"muuu\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">め<\/div><div class=\"rm\">me<\/div><div class=\"mn\">an \"eye\" with a knot<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">も<\/div><div class=\"rm\">mo<\/div><div class=\"mn\">a fish-hook, \"more\"<\/div><\/div>\n      <!-- ya -->\n      <div class=\"rowlab\">Y<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">や<\/div><div class=\"rm\">ya<\/div><div class=\"mn\">a \"yak\" with horns<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ゆ<\/div><div class=\"rm\">yu<\/div><div class=\"mn\">a fish, \"you\"<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">よ<\/div><div class=\"rm\">yo<\/div><div class=\"mn\">a \"yo-yo\" on a string<\/div><\/div>\n      <!-- ra -->\n      <div class=\"rowlab\">R<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ら<\/div><div class=\"rm\">ra<\/div><div class=\"mn\">a \"rabbit\" ear + curl<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">り<\/div><div class=\"rm\">ri<\/div><div class=\"mn\">two dripping \"reeds\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">る<\/div><div class=\"rm\">ru<\/div><div class=\"mn\">a \"route\" with a loop<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">れ<\/div><div class=\"rm\">re<\/div><div class=\"mn\">a \"red\" flag in wind<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ろ<\/div><div class=\"rm\">ro<\/div><div class=\"mn\">る minus loop — a \"road\" bend<\/div><\/div>\n      <!-- wa -->\n      <div class=\"rowlab\">W<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">わ<\/div><div class=\"rm\">wa<\/div><div class=\"mn\">a round \"wow\" face<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">を<\/div><div class=\"rm\">wo <span style=\"color:var(--muted)\">(o)<\/span><\/div><div class=\"mn\">object marker; said \"o\"<\/div><\/div>\n    <\/div>\n    <div class=\"solo\">\n      <div class=\"ch kana\">ん<\/div>\n      <div><div class=\"rm\">n<\/div><div class=\"mn\">the only lone consonant — a lazy \"n\" scribble. Ends syllables (ほん hon, えん en).<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- KATAKANA -->\n  <section class=\"pagebreak\">\n    <div class=\"sec\"><h2>Katakana<\/h2><span class=\"romaji\">カタカナ<\/span><span class=\"rule\"><\/span><span class=\"tag\">Week 2 · loanwords &amp; menus<\/span><\/div>\n    <div class=\"colhead\"><span><\/span><span>a<\/span><span>i<\/span><span>u<\/span><span>e<\/span><span>o<\/span><\/div>\n    <div class=\"grid\">\n      <div class=\"rowlab\">— a<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ア<\/div><div class=\"rm\">a<\/div><div class=\"mn\">an \"A\"-frame + hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">イ<\/div><div class=\"rm\">i<\/div><div class=\"mn\">a leaning \"ee\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ウ<\/div><div class=\"rm\">u<\/div><div class=\"mn\">a roof, \"ooh\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">エ<\/div><div class=\"rm\">e<\/div><div class=\"mn\">an \"E\" as 工<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">オ<\/div><div class=\"rm\">o<\/div><div class=\"mn\">a cross + hook, \"oh\"<\/div><\/div>\n\n      <div class=\"rowlab\">K<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">カ<\/div><div class=\"rm\">ka<\/div><div class=\"mn\">か's left — a \"car\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">キ<\/div><div class=\"rm\">ki<\/div><div class=\"mn\">a straight \"key\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ク<\/div><div class=\"rm\">ku<\/div><div class=\"mn\">a \"cut\" corner<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ケ<\/div><div class=\"rm\">ke<\/div><div class=\"mn\">a \"keg\" stroke<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">コ<\/div><div class=\"rm\">ko<\/div><div class=\"mn\">a \"corner\" bracket<\/div><\/div>\n\n      <div class=\"rowlab\">S<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">サ<\/div><div class=\"rm\">sa<\/div><div class=\"mn\">\"salsa\" three strokes<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">シ<\/div><div class=\"rm\">shi<\/div><div class=\"mn\">dashes rise ↗ from LEFT<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ス<\/div><div class=\"rm\">su<\/div><div class=\"mn\">a \"ski\" slope<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">セ<\/div><div class=\"rm\">se<\/div><div class=\"mn\">a \"say\" hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ソ<\/div><div class=\"rm\">so<\/div><div class=\"mn\">a stitch falls ↓ from TOP<\/div><\/div>\n\n      <div class=\"rowlab\">T<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">タ<\/div><div class=\"rm\">ta<\/div><div class=\"mn\">ク + a bar, \"ta\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">チ<\/div><div class=\"rm\">chi<\/div><div class=\"mn\">a \"cheer\" T + slash<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ツ<\/div><div class=\"rm\">tsu<\/div><div class=\"mn\">dashes fall ↓ from TOP<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">テ<\/div><div class=\"rm\">te<\/div><div class=\"mn\">a \"T\" with two bars<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ト<\/div><div class=\"rm\">to<\/div><div class=\"mn\">a \"toe\" nail<\/div><\/div>\n\n      <div class=\"rowlab\">N<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ナ<\/div><div class=\"rm\">na<\/div><div class=\"mn\">a \"knife\" cross<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ニ<\/div><div class=\"rm\">ni<\/div><div class=\"mn\">two \"knee\"-high lines<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヌ<\/div><div class=\"rm\">nu<\/div><div class=\"mn\">an X \"noodle\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ネ<\/div><div class=\"rm\">ne<\/div><div class=\"mn\">a tangled \"net\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ノ<\/div><div class=\"rm\">no<\/div><div class=\"mn\">a single \"no\" slash<\/div><\/div>\n\n      <div class=\"rowlab\">H<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ハ<\/div><div class=\"rm\">ha<\/div><div class=\"mn\">two strokes, \"ha ha\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヒ<\/div><div class=\"rm\">hi<\/div><div class=\"mn\">a \"he\" hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">フ<\/div><div class=\"rm\">fu<\/div><div class=\"mn\">a \"hood\" hook<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヘ<\/div><div class=\"rm\">he<\/div><div class=\"mn\">same hill as へ<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ホ<\/div><div class=\"rm\">ho<\/div><div class=\"mn\">a \"T\" with legs<\/div><\/div>\n\n      <div class=\"rowlab\">M<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">マ<\/div><div class=\"rm\">ma<\/div><div class=\"mn\">a \"mark\" tick<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ミ<\/div><div class=\"rm\">mi<\/div><div class=\"mn\">three \"me\" lines<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ム<\/div><div class=\"rm\">mu<\/div><div class=\"mn\">a \"moo\" corner<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">メ<\/div><div class=\"rm\">me<\/div><div class=\"mn\">an \"X\" — \"eye\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">モ<\/div><div class=\"rm\">mo<\/div><div class=\"mn\">a \"more\" hook + bars<\/div><\/div>\n\n      <div class=\"rowlab\">Y<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヤ<\/div><div class=\"rm\">ya<\/div><div class=\"mn\">a \"yacht\"<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ユ<\/div><div class=\"rm\">yu<\/div><div class=\"mn\">a \"U\" bracket, \"you\"<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヨ<\/div><div class=\"rm\">yo<\/div><div class=\"mn\">an \"E\" comb, \"yo\"<\/div><\/div>\n\n      <div class=\"rowlab\">R<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ラ<\/div><div class=\"rm\">ra<\/div><div class=\"mn\">a \"ra\" hook + bar<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">リ<\/div><div class=\"rm\">ri<\/div><div class=\"mn\">two \"reeds\"<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ル<\/div><div class=\"rm\">ru<\/div><div class=\"mn\">a \"loop\" with legs<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">レ<\/div><div class=\"rm\">re<\/div><div class=\"mn\">a \"red\" check<\/div><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ロ<\/div><div class=\"rm\">ro<\/div><div class=\"mn\">a square \"room\"<\/div><\/div>\n\n      <div class=\"rowlab\">W<\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ワ<\/div><div class=\"rm\">wa<\/div><div class=\"mn\">an open \"wah\" bracket<\/div><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK blank\"><\/div>\n      <div class=\"cellK\"><div class=\"ch kana\">ヲ<\/div><div class=\"rm\">wo <span style=\"color:var(--muted)\">(o)<\/span><\/div><div class=\"mn\">rare; you'll seldom see it<\/div><\/div>\n    <\/div>\n    <div class=\"solo\">\n      <div class=\"ch kana\">ン<\/div>\n      <div><div class=\"rm\">n<\/div><div class=\"mn\">strokes rise ↗ from the LEFT (unlike ソ). Ends syllables: パン pan, ワイン wain.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- MODIFIERS + LOOK-ALIKES -->\n  <section>\n    <div class=\"sec\"><h2>The modifiers<\/h2><span class=\"romaji\">Day 6<\/span><span class=\"rule\"><\/span><span class=\"tag\">unlocks ~everything<\/span><\/div>\n    <div class=\"panels\">\n      <div class=\"panel\">\n        <h3>Dakuten &amp; handakuten <em>the two little marks<\/em><\/h3>\n        <p><span class=\"k kana\">゛<\/span> (two ticks) voices a sound: k→g, s→z, t→d, h→b.<br>\n        <span class=\"ex kana\">か ka → が ga &nbsp;·&nbsp; す su → ず zu &nbsp;·&nbsp; て te → で de &nbsp;·&nbsp; は ha → ば ba<\/span><\/p>\n        <p><span class=\"k kana\">゜<\/span> (a circle) turns the h-row into p:<br>\n        <span class=\"ex kana\">は ha → ぱ pa &nbsp;·&nbsp; ひ hi → ぴ pi &nbsp;·&nbsp; ほ ho → ぽ po<\/span><\/p>\n      <\/div>\n      <div class=\"panel\">\n        <h3>Combos &amp; small tsu <em>size matters<\/em><\/h3>\n        <p>A small や ゆ よ fuses onto an i-sound:<br>\n        <span class=\"ex kana\">き + ゃ = きゃ kya &nbsp;·&nbsp; し + ょ = しょ sho &nbsp;·&nbsp; ちゅ chu<\/span><\/p>\n        <p>A small っ (tsu) doubles the next consonant — a tiny pause:<br>\n        <span class=\"ex kana\">きっぷ ki<b style=\"color:var(--shu)\">pp<\/b>u &nbsp;·&nbsp; がっこう ga<b style=\"color:var(--shu)\">kk<\/b>ou<\/span><\/p>\n        <p>A bar ー (katakana) or extra vowel just holds the sound long:<br>\n        <span class=\"ex kana\">コーヒー koohii &nbsp;·&nbsp; とうきょう Toukyou<\/span><\/p>\n      <\/div>\n      <div class=\"panel warn\">\n        <h3>Hiragana look-alikes <em>slow down here<\/em><\/h3>\n        <p class=\"pair kana\">き / さ &nbsp;&nbsp; は / ほ &nbsp;&nbsp; あ / お<br>ね / れ / わ &nbsp;&nbsp; る / ろ<\/p>\n        <p class=\"ex\">Same idea, one detail differs. Drill each cluster as a set, not one by one.<\/p>\n      <\/div>\n      <div class=\"panel warn\">\n        <h3>Katakana's evil twins <em>everyone trips<\/em><\/h3>\n        <p class=\"pair kana\"><b>シ<\/b> shi vs <b>ツ<\/b> tsu &nbsp;&nbsp;·&nbsp;&nbsp; <b>ソ<\/b> so vs <b>ン<\/b> n<\/p>\n        <p class=\"ex\">The tell: <b>シ / ン<\/b> — strokes come in low and rise ↗ from the left. <b>ツ / ソ<\/b> — strokes drop ↓ from the top. Learn the direction, not the shape.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- READING DRILL: HIRAGANA -->\n  <section class=\"pagebreak\">\n    <div class=\"sec\"><h2>Reading drill · Hiragana<\/h2><span class=\"rule\"><\/span><span class=\"tag\">only uses characters learned so far<\/span><\/div>\n\n    <div class=\"day\">\n      <div class=\"hd\"><span class=\"num\">Day 1<\/span><span class=\"what\">a-row + K-row &nbsp;— あいうえお かきくけこ<\/span><\/div>\n      <div class=\"words\">\n        <div class=\"w\"><div class=\"k kana\">あお<\/div><div class=\"r\">ao<\/div><div class=\"m\">blue<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">あか<\/div><div class=\"r\">aka<\/div><div class=\"m\">red<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">かお<\/div><div class=\"r\">kao<\/div><div class=\"m\">face<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">えき<\/div><div class=\"r\">eki<\/div><div class=\"m\">station<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">いか<\/div><div class=\"r\">ika<\/div><div class=\"m\">squid<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">こえ<\/div><div class=\"r\">koe<\/div><div class=\"m\">voice<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"day\">\n      <div class=\"hd\"><span class=\"num\">Day 2<\/span><span class=\"what\">+ S-row + T-row &nbsp;— さしすせそ たちつてと<\/span><\/div>\n      <div class=\"words\">\n        <div class=\"w\"><div class=\"k kana\">すし<\/div><div class=\"r\">sushi<\/div><div class=\"m\">sushi<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">たこ<\/div><div class=\"r\">tako<\/div><div class=\"m\">octopus<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">かさ<\/div><div class=\"r\">kasa<\/div><div class=\"m\">umbrella<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">きた<\/div><div class=\"r\">kita<\/div><div class=\"m\">north<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">ちかてつ<\/div><div class=\"r\">chikatetsu<\/div><div class=\"m\">subway<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">たかい<\/div><div class=\"r\">takai<\/div><div class=\"m\">tall / pricey<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"day\">\n      <div class=\"hd\"><span class=\"num\">Day 3<\/span><span class=\"what\">+ N-row + H-row &nbsp;— なにぬねの はひふへほ<\/span><\/div>\n      <div class=\"words\">\n        <div class=\"w\"><div class=\"k kana\">はな<\/div><div class=\"r\">hana<\/div><div class=\"m\">flower / nose<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">なに<\/div><div class=\"r\">nani<\/div><div class=\"m\">what<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">ねこ<\/div><div class=\"r\">neko<\/div><div class=\"m\">cat<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">さかな<\/div><div class=\"r\">sakana<\/div><div class=\"m\">fish<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">おかね<\/div><div class=\"r\">okane<\/div><div class=\"m\">money<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">ひこうき<\/div><div class=\"r\">hikouki<\/div><div class=\"m\">airplane<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"day\">\n      <div class=\"hd\"><span class=\"num\">Day 4<\/span><span class=\"what\">+ M-row + Y-row &nbsp;— まみむめも やゆよ<\/span><\/div>\n      <div class=\"words\">\n        <div class=\"w\"><div class=\"k kana\">やま<\/div><div class=\"r\">yama<\/div><div class=\"m\">mountain<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">なまえ<\/div><div class=\"r\">namae<\/div><div class=\"m\">name<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">ゆき<\/div><div class=\"r\">yuki<\/div><div class=\"m\">snow<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">みせ<\/div><div class=\"r\">mise<\/div><div class=\"m\">shop<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">おいしい<\/div><div class=\"r\">oishii<\/div><div class=\"m\">delicious<\/div><\/div>\n        <div class=\"w\"><div class=\"k kana\">やすい<\/div><div class=\"r\">yasui<\/div><div class=\"m\">cheap<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"day\">\n      <div class=\"hd\"><span class=\"num\">Day 5<\/span><span class=\"what\">+ R-row + わ を ん &nbsp;— らりるれろ わをん<\/span><\/div>\n      < ><\/div>\n<h2>The characters you get free<\/h2>\n<div class=\"concept\"><div class=\"big\">\nThis is pure Chinese payoff: you already <b>read the meaning<\/b> of nearly every character on a Japanese sign or menu.\nAll you&#39;re adding is the Japanese reading (romaji below each) &mdash; and, in a few cases, a meaning that drifted from Chinese.\nSkim it once before the trip and signs will simply parse themselves.\n<\/div><\/div>\n\n<h2>Getting around &mdash; signs<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">入口<\/span> <span class=\"r\">iriguchi<\/span><span class=\"m\">entrance<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">出口<\/span> <span class=\"r\">deguchi<\/span><span class=\"m\">exit<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">押<\/span> <span class=\"r\">osu<\/span><span class=\"m\">push (door)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">引<\/span> <span class=\"r\">hiku<\/span><span class=\"m\">pull (door)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">駅<\/span> <span class=\"r\">eki<\/span><span class=\"m\">station<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">改札<\/span> <span class=\"r\">kaisatsu<\/span><span class=\"m\">ticket gate<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">切符<\/span> <span class=\"r\">kippu<\/span><span class=\"m\">ticket<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">乗換<\/span> <span class=\"r\">norikae<\/span><span class=\"m\">transfer<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">お手洗い<\/span> <span class=\"r\">otearai<\/span><span class=\"m\">toilet<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">男 / 女<\/span> <span class=\"r\">otoko / onna<\/span><span class=\"m\">men / women<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">湯<\/span> <span class=\"r\">yu<\/span><span class=\"m\">hot water / bath<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">危険<\/span> <span class=\"r\">kiken<\/span><span class=\"m\">danger<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">注意<\/span> <span class=\"r\">chūi<\/span><span class=\"m\">caution<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">禁煙<\/span> <span class=\"r\">kin&#39;en<\/span><span class=\"m\">no smoking<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">無料 / 有料<\/span> <span class=\"r\">muryō / yūryō<\/span><span class=\"m\">free / paid<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">営業中<\/span> <span class=\"r\">eigyōchū<\/span><span class=\"m\">open (for business)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">準備中<\/span> <span class=\"r\">junbichū<\/span><span class=\"m\">not yet open<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">閉店<\/span> <span class=\"r\">heiten<\/span><span class=\"m\">closed<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">会計 / レジ<\/span> <span class=\"r\">kaikei / reji<\/span><span class=\"m\">checkout / register<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">税込<\/span> <span class=\"r\">zeikomi<\/span><span class=\"m\">tax included<\/span><\/div>\n<\/div>\n\n<h2>On the menu &mdash; proteins &amp; staples<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">肉<\/span> <span class=\"r\">niku<\/span><span class=\"m\">meat<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">牛<\/span> <span class=\"r\">gyū<\/span><span class=\"m\">beef<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">豚<\/span> <span class=\"r\">buta<\/span><span class=\"m\">pork<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">鶏 / 鳥<\/span> <span class=\"r\">tori<\/span><span class=\"m\">chicken<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">魚<\/span> <span class=\"r\">sakana<\/span><span class=\"m\">fish<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">海老<\/span> <span class=\"r\">ebi<\/span><span class=\"m\">shrimp<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">飯 / ご飯<\/span> <span class=\"r\">gohan<\/span><span class=\"m\">rice / meal<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">麺<\/span> <span class=\"r\">men<\/span><span class=\"m\">noodles<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">丼<\/span> <span class=\"r\">don<\/span><span class=\"m\">rice bowl<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">定食<\/span> <span class=\"r\">teishoku<\/span><span class=\"m\">set meal<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">卵<\/span> <span class=\"r\">tamago<\/span><span class=\"m\">egg<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">野菜<\/span> <span class=\"r\">yasai<\/span><span class=\"m\">vegetables<\/span><\/div>\n<\/div>\n\n<h2>On the menu &mdash; how it&#39;s cooked &amp; tastes<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">焼<\/span> <span class=\"r\">yaki<\/span><span class=\"m\">grilled<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">揚<\/span> <span class=\"r\">age<\/span><span class=\"m\">deep-fried<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">煮<\/span> <span class=\"r\">ni<\/span><span class=\"m\">simmered<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">蒸<\/span> <span class=\"r\">mushi<\/span><span class=\"m\">steamed<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">刺身<\/span> <span class=\"r\">sashimi<\/span><span class=\"m\">raw sliced fish<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">生<\/span> <span class=\"r\">nama<\/span><span class=\"m\">raw / draft<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">辛 / 甘<\/span> <span class=\"r\">kara / ama<\/span><span class=\"m\">spicy / sweet<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">塩<\/span> <span class=\"r\">shio<\/span><span class=\"m\">salt<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k c /h2>\n<div class=\"concept\"><div class=\"big\">\nThe trap that <b>only a Chinese speaker<\/b> falls into: characters you know, meaning something else in Japanese. Your Mandarin\nwill confidently mislead you on these, so they&#39;re worth a deliberate look. Left is the Japanese word and what it actually\nmeans; right is what your Chinese brain expects.\n<\/div><\/div>\n<table>\n  <thead><tr><th style=\"width:16%\">Japanese<\/th><th style=\"width:16%\">Reading<\/th><th style=\"width:34%\">Means in Japanese<\/th><th style=\"width:34%\">What Chinese expects<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"pt cjk\">手紙<\/td><td class=\"rd\">tegami<\/td><td class=\"fn\">a letter (mail)<\/td><td class=\"hook cjk\">手纸 = toilet paper<\/td><\/tr>\n    <tr><td class=\"pt cjk\">勉強<\/td><td class=\"rd\">benkyō<\/td><td class=\"fn\">study<\/td><td class=\"hook cjk\">勉强 = reluctant / to force<\/td><\/tr>\n    <tr><td class=\"pt cjk\">床<\/td><td class=\"rd\">yuka<\/td><td class=\"fn\">floor<\/td><td class=\"hook cjk\">床 = bed<\/td><\/tr>\n    <tr><td class=\"pt cjk\">湯<\/td><td class=\"rd\">yu<\/td><td class=\"fn\">hot water / bath<\/td><td class=\"hook cjk\">汤 = soup<\/td><\/tr>\n    <tr><td class=\"pt cjk\">汽車<\/td><td class=\"rd\">kisha<\/td><td class=\"fn\">(steam) train<\/td><td class=\"hook cjk\">汽车 = car &nbsp;<span class=\"dim\">(JP car = 車 kuruma)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">走<\/td><td class=\"rd\">hashiru<\/td><td class=\"fn\">to run<\/td><td class=\"hook cjk\">走 = to walk<\/td><\/tr>\n    <tr><td class=\"pt cjk\">娘<\/td><td class=\"rd\">musume<\/td><td class=\"fn\">daughter<\/td><td class=\"hook cjk\">娘 = mother<\/td><\/tr>\n    <tr><td class=\"pt cjk\">高校<\/td><td class=\"rd\">kōkō<\/td><td class=\"fn\">high school<\/td><td class=\"hook cjk\">高校 = university / college<\/td><\/tr>\n    <tr><td class=\"pt cjk\">先生<\/td><td class=\"rd\">sensei<\/td><td class=\"fn\">teacher / doctor<\/td><td class=\"hook cjk\">先生 = Mr. / husband<\/td><\/tr>\n    <tr><td class=\"pt cjk\">愛人<\/td><td class=\"rd\">aijin<\/td><td class=\"fn\">lover / mistress<\/td><td class=\"hook cjk\">爱人 = spouse<\/td><\/tr>\n    <tr><td class=\"pt cjk\">老婆<\/td><td class=\"rd\">rōba<\/td><td class=\"fn\">old woman<\/td><td class=\"hook cjk\">老婆 = wife<\/td><\/tr>\n    <tr><td class=\"pt cjk\">丈夫<\/td><td class=\"rd\">jōbu<\/td><td class=\"fn\">sturdy / healthy<\/td><td class=\"hook cjk\">丈夫 = husband<\/td><\/tr>\n    <tr><td class=\"pt cjk\">大丈夫<\/td><td class=\"rd\">daijōbu<\/td><td class=\"fn\">it&#39;s OK / no problem<\/td><td class=\"hook cjk\">大丈夫 = a manly man<\/td><\/tr>\n    <tr><td class=\"pt cjk\">新聞<\/td><td class=\"rd\">shinbun<\/td><td class=\"fn\">newspaper<\/td><td class=\"hook cjk\">新闻 = news<\/td><\/tr>\n    <tr><td class=\"pt cjk\">怪我<\/td><td class=\"rd\">kega<\/td><td class=\"fn\">an injury<\/td><td class=\"hook cjk\">怪我 = blame me<\/td><\/tr>\n    <tr><td class=\"pt cjk\">猪<\/td><td class=\"rd\">inoshishi<\/td><td class=\"fn\">wild boar<\/td><td class=\"hook cjk\">猪 = pig &nbsp;<span class=\"dim\">(JP pig = 豚 buta)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">麻雀<\/td><td class=\"rd\">mājan<\/td><td class=\"fn\">mahjong<\/td><td class=\"hook cjk\">麻雀 = sparrow<\/td><\/tr>\n    <tr><td class=\"pt cjk\">得意<\/td><td class=\"rd\">tokui<\/td><td class=\"fn\">good at / one&#39;s strong suit<\/td><td class=\"hook cjk\">得意 = pleased / smug<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">The three most likely to embarrass you on the trip<\/div>\n<span class=\"cjk\">手紙<\/span> <span class=\"romaji\">(tegami)<\/span> &mdash; asking for \"letter\" at a table won&#39;t get you napkins; &nbsp;\n<span class=\"cjk\">床<\/span> <span class=\"romaji\">(yuka)<\/span> &mdash; it&#39;s the <i>floor<\/i>, so \"on the 床\" is not where you sleep; &nbsp;\n<span class=\"cjk\">大丈夫<\/span> <span class=\"romaji\">(daijōbu)<\/span> &mdash; the single most useful one to <i>keep<\/i>: \"I&#39;m fine / it&#39;s OK,\"\nyour all-purpose polite deflection.\n<\/div>\n<\/body><\/html>"}, {"id": "particles", "title": "Particles", "kanji": "助", "sub": "The tags that mark each noun's job", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-fam  .order .formula { font-size: 11px; margin-bottom: 6px; }\n  .order .formula .slot { background: #35507a; padding: 1px 6px; border-radius: 4px; color: #fff; }\n  .order .line { padding: 3px 0; border-bottom: 1px solid #2c3e5c; font-size: 9.4px; }\n  .order .line:last-child { border-bottom: none; }\n  .order .line .cjk { font-size: 12px; color: #fff; }\n  .order .line .romaji { color: #9fb4d4; }\n  .order .line .en { color: #cfd8e6; }\n\n  footer { margin-top: 11px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between; }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  :root {\n    --ink:#14213d; --ink2:#2c3e5c; --red:#c1362f; --indigo:#3d5a80;\n    --paper:#faf8f3; --card:#ffffff; --line:#e4ddce; --muted:#6b7280;\n    --jp:#b5341f; --zh:#1f6f4a;\n  }\n  html { font-family:'Helvetica Neue','DejaVu Sans','Noto Sans CJK JP',sans-serif; color:var(--ink); }\n  body { background:var(--paper); font-size:9.4px; line-height:1.45; }\n  .cjk { font-family:'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif; }\n  .jp { color:var(--jp); font-weight:600; }\n  .zh { color:var(--zh); font-weight:600; }\n  .romaji { font-style:italic; color:var(--muted); }\n  header { border-bottom:3px solid var(--ink); padding-bottom:9px; margin-bottom:12px;\n           display:flex; align-items:flex-end; justify-content:space-between; }\n  header .title h1 { font-size:20px; font-weight:800; letter-spacing:-0.4px; color:var(--ink); }\n  header .title .sub { font-size:9.6px; color:var(--red); font-weight:600; margin-top:2px; }\n  header .mark { text-align:right; font-size:8.5px; color:var(--muted); line-height:1.4; }\n  header .mark .kanji { font-size:25px; color:var(--red); font-weight:700; display:block; margin-bottom:2px; }\n  h2 { font-size:11.5px; color:var(--ink); font-weight:800; margin:12px 0 6px;\n       padding-left:8px; border-left:4px solid var(--red); text-transform:uppercase; letter-spacing:0.5px; }\n  h2:first-of-type { margin-top:0; }\n  .concept { background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">助<\/div><div><h1>Particles<\/h1><div class=\"st\">The tags that mark each noun's job<\/div><\/div><\/div>\n\n\n\n<h2>The one idea<\/h2>\n<div class=\"concept\">\n  <div class=\"big\">\n    A <b>particle<\/b> is a little tag that comes <b>after<\/b> a noun and announces that noun's <b>job<\/b> in the\n    sentence &mdash; who's doing it, what it's done to, where, when. Because the job is labeled, <b>word order goes loose<\/b>\n    &mdash; only the verb is fixed, always <b>last<\/b>. The particles do the work your word order used to do.\n  <\/div>\n<\/div>\n\n<div class=\"split\">\n  <div class=\"col zhcol\">\n    <div class=\"lbl\">Chinese &mdash; position does the work (like English)<\/div>\n    <div class=\"ex cjk\">我 &nbsp;吃 &nbsp;鱼<span class=\"zh\"><\/span><\/div>\n    <div class=\"gl\">S&ndash;V&ndash;O. \"I eat fish.\" Move the words, change the meaning.<\/div>\n  <\/div>\n  <div class=\"col jpcol\">\n    <div class=\"lbl\">Japanese &mdash; tags do the work<\/div>\n    <div class=\"ex cjk\">私<span class=\"jp\">は<\/span> 魚<span class=\"jp\">を<\/span> 食べます<\/div>\n    <div class=\"gl\"><span class=\"romaji\">watashi wa sakana o tabemasu<\/span> &middot; S&ndash;O&ndash;V, verb last.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"flip\">\n  <b>What this buys you &mdash; free word order.<\/b> The role is glued to the noun, not its spot:<br>\n  <span class=\"ex cjk\">猫<span class=\"jp\">が<\/span>魚<span class=\"jp\">を<\/span>食べました<\/span>\n  <span class=\"arrow\">=<\/span>\n  <span class=\"ex cjk\">魚<span class=\"jp\">を<\/span>猫<span class=\"jp\">が<\/span>食べました<\/span>\n  <div class=\"romaji\" style=\"font-size:8.7px; margin:3px 0;\">neko ga sakana o tabemashita &nbsp;=&nbsp; sakana o neko ga tabemashita<\/div>\n  &mdash; both still mean <i>the cat ate the fish<\/i>. が marks the doer, を the done-to, wherever they sit.\n<\/div>\n\n<p style=\"font-size:9px; margin:5px 2px 0; color:var(--ink2)\">\n  <b>What's genuinely new for you:<\/b> Chinese marks subject and object by <i>position<\/i>, exactly like English &mdash; it has\n  no case tags. So は / が / を are the real new machinery. <b>What's already familiar:<\/b> a handful of particles line up\n  almost one-to-one with characters you know (の&hairsp;=&hairsp;的, か&hairsp;=&hairsp;吗&hellip;) &mdash; see page 2.\n<\/p>\n\n<h2>The workhorse particles<\/h2>\n<table>\n  <thead>\n    <tr>\n      <th style=\"width:8%\">Particle<\/th>\n      <th style=\"width:9%\">Reads<\/th>\n      <th style=\"width:22%\">Its job<\/th>\n      <th style=\"width:41%\">Example<\/th>\n      <th style=\"width:20%\">Chinese hook<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td class=\"pt cjk\">は<\/td><td class=\"rd\">wa*<\/td>\n      <td class=\"fn\">Topic &mdash; \"as for &hellip;\"<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">は<\/span>学生です<\/span> &middot; <span class=\"exr\">watashi wa gakusei desu<\/span><br><span class=\"exe\">\"As for me, I'm a student.\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(no equivalent)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">が<\/td><td class=\"rd\">ga<\/td>\n      <td class=\"fn\">Subject &mdash; the doer, often new info<\/td>\n      <td><span class=\"cjk exj\">誰<span class=\"jp\">が<\/span>来ましたか？<\/span> &middot; <span class=\"exr\">dare ga kimashita ka?<\/span><br><span class=\"exe\">\"Who came?\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(no equivalent)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">を<\/td><td class=\"rd\">o*<\/td>\n      <td class=\"fn\">Direct object<\/td>\n      <td><span class=\"cjk exj\">水<span class=\"jp\">を<\/span>飲みます<\/span> &middot; <span class=\"exr\">mizu o nomimasu<\/span><br><span class=\"exe\">\"drink water.\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(word order in&nbsp;中文)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">に<\/td><td class=\"rd\">ni<\/td>\n      <td class=\"fn\">To / at &mdash; destination, clock time, where something <i>exists<\/i><\/td>\n      <td><span class=\"cjk exj\">東京<span class=\"jp\">に<\/span>行きます<\/span> &middot; <span class=\"exr\">Tōkyō ni ikimasu<\/span><br><span class=\"exe\">\"go to Tokyo.\" &nbsp; 家<span class=\"jp\">に<\/span>います <span class=\"romaji\">(ie ni imasu)<\/span> \"is at home.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 到 / 在 <span class=\"dim\">(到东京)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">で<\/td><td class=\"rd\">de<\/td>\n      <td class=\"fn\">Where an <i>action<\/i> happens; by means of<\/td>\n      <td><span class=\"cjk exj\">家<span class=\"jp\">で<\/span>食べます<\/span> &middot; <span class=\"exr\">ie de tabemasu<\/span><br><span class=\"exe\">\"eat at home.\" &nbsp; 電車<span class=\"jp\">で<\/span> <span class=\"romaji\">(densha de)<\/span> \"by train.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 在 / 用<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">へ<\/td><td class=\"rd\">e*<\/td>\n      <td class=\"fn\">Toward &mdash; direction<\/td>\n      <td><span class=\"cjk exj\">東京<span class=\"jp\">へ<\/span>行きます<\/span> &middot; <span class=\"exr\">Tōkyō e ikimasu<\/span><br><span class=\"exe\">\"head toward Tokyo.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 往 / 向<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">の<\/td><td class=\"rd\">no<\/td>\n      <td class=\"fn\">Of / 's &mdash; links noun to noun<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">の<\/span>本<\/span> &middot; <span class=\"exr\">watashi no hon<\/span><br><span class=\"exe\">\"my book.\"<\/span><\/td>\n      <td class=\"hook cjk\">= 的 <span class=\"dim\">(我的书)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">と<\/td><td class=\"rd\">to<\/td>\n      <td class=\"fn\">And (full list) / with<\/td>\n      <td><span class=\"cjk exj\">猫<span class=\"jp\">と<\/span>犬<\/span> &middot; <span class=\"exr\">neko to inu<\/span><br><span class=\"exe\">\"cats and dogs.\" &nbsp; 友達<span class=\"jp\">と<\/span> <span class=\"romaji\">(tomodachi to)<\/span> \"with a friend.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 和 / 跟<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">も<\/td><td class=\"rd\">mo<\/td>\n      <td class=\"fn\">Also / too<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">も<\/span>行きます<\/span> &middot; <span class=\"exr\">watashi mo ikimasu<\/span><br><span class=\"exe\">\"I'll go too.\"<\/span><\/td>\n      <td class=\"hook cjk\">= 也<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">から<\/td><td class=\"rd\">kara<\/td>\n      <td class=\"fn\">From / since / because<\/td>\n      <td><span class=\"cjk exj\">9時<span class=\"jp\">から<\/span><\/span> &middot; <span class=\"exr\">ku-ji kara<\/span><br><span class=\"exe\">\"from 9 o'clock.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 从 / 因为<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">まで<\/td><td class=\"rd\">made<\/td>\n      <td class=\"fn\">Until / as far as<\/td>\n      <td><span class=\"cjk exj\">駅<span class=\"jp\">まで<\/span><\/span> &middot; <span class=\"exr\">eki made<\/span><br><span class=\"exe\">\"as far as the station.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 到 / 为止<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">か<\/td><td class=\"rd\">ka<\/td>\n      <td class=\"fn\">Turns a statement into a yes/no question<\/td>\n      <td><span class=\"cjk exj\">学生です<span class=\"jp\">か<\/span><\/span> &middot; <span class=\"exr\">gakusei desu ka<\/span><br><span class=\"exe\">\"Are you a student?\"<\/span><\/td>\n      <td class=\"hook cjk\">= 吗<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<p style=\"font-size:8px;color:var(--muted);margin-top:4px\">* spelled with one kana but pronounced differently as a particle &mdash; see the pronunciation traps on the next page. &nbsp;&bull;&nbsp; Verbs are shown in the polite <b>&ndash;masu / desu<\/b> register Pimsleur drills; the plain forms (&#39;taberu&#39;, &#39;iku&#39;) come later &mdash; the particles work identically in both.<\/p>\n\n<!-- ===================== PAGE 2 ===================== -->\n<div class=\"page-break\"><\/div>\n\n<h2>Your unfair advantage &mdash; particles you already know<\/h2>\n<div class=\"zhbox\">\n  <div class=\"row\">\n    <div class=\"p cjk\">の<\/div>\n    <div class=\"eq cjk\">= 的<\/div>\n    <div class=\"note\"><span class=\"cjk\">私の本<\/span> <span class=\"romaji\">(watashi no hon)<\/span> <span class=\"cjk\">= 我的书<\/span> &mdash; \"my book.\" Same job: hooks a modifier onto a noun. This one is a true equal, lean on it hard.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">か<\/div>\n    <div class=\"eq cjk\">= 吗<\/div>\n    <div class=\"note\"><span class=\"cjk\">学生ですか<\/span> <span class=\"romaji\">(gakusei desu ka)<\/span> <span class=\"cjk\">= 是学生吗？<\/span> Tack it on the end, statement becomes a yes/no question.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">も<\/div>\n    <div class=\"eq cjk\">= 也<\/div>\n    <div class=\"note\"><span class=\"cjk\">私も<\/span> <span class=\"romaji\">(watashi mo)<\/span> <span class=\"cjk\">= 我也<\/span> &mdash; \"me too.\" Watch placement: も sits <i>after<\/i> the noun, 也 sits <i>before<\/i> the verb.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">と<\/div>\n    <div class=\"eq cjk\">≈ 和 / 跟<\/div>\n    <div class=\"note\"><span class=\"cjk\">猫と犬<\/span> <span class=\"romaji\">(neko to inu)<\/span> <span class=\"cjk\">= 猫和狗<\/span> (listing); <span class=\"cjk\">友達と<\/span> <span class=\"romaji\">(tomodachi to)<\/span> <span class=\"cjk\">= 跟朋友<\/span> (with someone).<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">から<\/div>\n    <div class=\"eq cjk\">≈ 从 / 因为<\/div>\n    <div class=\"note\"><span class=\"cjk\">3時から<\/span> <span class=\"romaji\">(san-ji kara)<\/span> <span class=\"cjk\">= 从三点<\/span> (from a point); also \"because,\" like <span class=\"cjk\">因为<\/span> at a clause's head.<\/div>\n  <\/div>\n  <div class=\"cap\">Hooks, not exact equals &mdash; each Japanese particle stretches further than its Chinese cousin, but these get you standing up fast.<\/div>\n<\/div>\n\n<h2>The two pairs everyone mixes up<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3><span class=\"tag cjk\">は<\/span> wa &nbsp;vs&nbsp; <span class=\"tag cjk\">が<\/span> ga<\/h3>\n    <p>Both sit near the \"subject,\" so this is the classic trap. Rough rule that carries you far:<\/p>\n    <p><b>New information takes が. The already-known topic takes は.<\/b><\/p>\n    <div class=\"eg\"><span class=\"cjk\">誰<span class=\"jp\">が<\/span>来ましたか？&mdash; 田中さん<span class=\"jp\">が<\/span>来ました。<\/span><br><span class=\"romaji\">dare ga kimashita ka? &mdash; Tanaka-san ga kimashita.<\/span><br>\"Who came?\" &mdash; Tanaka's the new fact &rarr; が.<\/div>\n    <div class=\"eg\"><span class=\"cjk\">田中さん<span class=\"jp\">は<\/span>学生です。<\/span><br><span class=\"romaji\">Tanaka-san wa gakusei desu.<\/span><br>Tanaka's now known &rarr; は: \"as for Tanaka, he's a student.\"<\/div>\n    <p>は also <b>contrasts<\/b>: \"<i>this<\/i> one, unlike others.\" Real command comes from hearing thousands of correct examples &mdash; the ear, not the rule.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3><span class=\"tag cjk\">に<\/span> ni &nbsp;vs&nbsp; <span class=\"tag cjk\">で<\/span> de<\/h3>\n    <p>Both can translate as \"at,\" which is the whole confusion. The split is clean:<\/p>\n    <p><b>に = where something <i>is<\/i>. で = where something <i>happens<\/i>.<\/b><\/p>\n    <div class=\"eg\"><span class=\"cjk\">家<span class=\"jp\">に<\/span>います<\/span> <span class=\"romaji\">(ie ni imasu)<\/span> &mdash; \"is <i>at<\/i> home.\" (existence)<\/div>\n    <div class=\"eg\"><span class=\"cjk\">家<span class=\"jp\">で<\/span>食べます<\/span> <span class=\"romaji\">(ie de tabemasu)<\/span> &mdash; \"eats <i>at<\/i> home.\" (action)<\/div>\n    <p>Same trick for time &amp; means: に pins a clock time (<span class=\"cjk\">3時に<\/span>, <span class=\"romaji\">san-ji ni<\/span>), で gives the method (<span class=\"cjk\">電車で<\/span>, <span class=\"romaji\">densha de<\/span>, \"by train\"). Burn this pair in early.<\/p>\n  <\/div>\n<\/div>\n\n<h2>Pronunciation traps<\/h2>\n<p style=\"font-size:9px;margin:0 2px 6px;color:var(--ink2)\">Three particles are written with one kana but read as another &mdash; a historical spelling both of you will trip on once, then never again.<\/p>\n<div class=\"traps\">\n  <div class=\"trap\">\n    <div class=\"k cjk\">は<\/div>\n    <div class=\"say\">normally <i>ha<\/i> &rarr; as particle, say <b>wa<\/b><\/div>\n    <div class=\"why cjk\">私は &rarr; watashi wa<\/div>\n  <\/div>\n  <div class=\"trap\">\n    <div class=\"k cjk\">を<\/div>\n    <div class=\"say\">normally <i>wo<\/i> &rarr; as particle, say <b>o<\/b><\/div>\n    <div class=\"why cjk\">水を &rarr; mizu o<\/div>\n  <\/div>\n  <div class=\"trap\">\n    <div class=\"k cjk\">へ<\/div>\n    <div class=\"say\">normally <i>he<\/i> &rarr; as particle, say <b>e<\/b><\/div>\n    <div class=\"why cjk\">東京へ &rarr; Tōkyō e<\/div>\n  <\/div>\n<\/div>\n\n\n\n<\/body><\/html>"}, {"id": "teform", "title": "The て-form", "kanji": "て", "sub": "Japanese's master connector", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'He rder-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margi
