}\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">駅<\/div><div><h1>Trains & Transit<\/h1><div class=\"st\">IC cards, signage, getting around<\/div><\/div><\/div>\n<style>\n  h2 { margin: 7px 0 4px; }\n  td { padding: 3px 8px; }\n  .concept { padding: 7px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.2px; line-height: 1.4; }\n  .card { padding: 7px 11px; }\n  .card p { margin-bottom: 2.5px; font-size: 8.7px; }\n  .zhbox { margin: 5px 0; padding: 8px 12px; }\n  .kgrid6 { gap: 3px; }\n  .note { margin-top: 3px; }\n  footer { margin-top: 7px; }\n<\/style>\n\n<h2>IC cards &mdash; get one first (2026)<\/h2>\n<div class=\"concept\"><div class=\"big\">\nTap-in / tap-out prepaid cards &mdash; <b>Suica, PASMO, ICOCA<\/b> are all interchangeable and work on almost every train,\nbus, subway, konbini and vending machine nationwide. Load with cash and skip the fare-math entirely. In 2026 the tourist\noptions are <b>Welcome Suica<\/b> or <b>Tourist PASMO<\/b> (physical, airport pickup, no deposit, ~28 days), or\n<b>Mobile Suica<\/b> on an iPhone via Apple Pay. One card each &mdash; they track entry and exit per person.\n<\/div><\/div>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3>The four catches<\/h3>\n    <p><b>1. Not for the Shinkansen<\/b> &mdash; bullet trains need a separate ticket / reserved seat (or the Welcome Suica app).<\/p>\n    <p><b>2. Don&#39;t cross rail-company lines on one tap<\/b> &mdash; tap in near Tokyo, tap out in Nagoya, and the gate locks. Stay within one regional network per ride.<\/p>\n    <p><b>3. Top-up is usually cash-only<\/b> &mdash; keep yen on you, especially day one.<\/p>\n    <p><b>4. A few rural lines are leaving the IC network<\/b> &mdash; carry cash for regional trips.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3>Which one<\/h3>\n    <p><b>iPhone:<\/b> Mobile Suica in Apple Wallet &mdash; no counter queue, top up with a card.<\/p>\n    <p><b>Android from abroad:<\/b> won&#39;t work (no FeliCa chip) &mdash; grab a physical Welcome Suica / Tourist PASMO at Narita or Haneda.<\/p>\n    <p><b>Coming back someday:<\/b> a regular Suica/PASMO (¥500 deposit, 10-year life) holds its balance between trips.<\/p>\n    <p class=\"note\" style=\"font-size:8.4px; color:var(--muted);\">Google Maps gives you the line, platform, and transfers in English &mdash; the signs on the ground are the words below.<\/p>\n  <\/div>\n<\/div>\n\n<h2>Train types &mdash; faster trains skip stops<\/h2>\n<table>\n  <thead><tr><th style=\"width:20%\">Type<\/th><th style=\"width:14%\">Reading<\/th><th style=\"width:66%\">What it means<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"pt cjk\">普通 / 各駅停車<\/td><td class=\"rd\">futsū / kakueki<\/td><td class=\"exe\">Local &mdash; stops at every station. Safest if unsure.<\/td><\/tr>\n    <tr><td class=\"pt cjk\">快速<\/td><td class=\"rd\">kaisoku<\/td><td class=\"exe\">Rapid &mdash; skips minor stops, usually no surcharge.<\/td><\/tr>\n    <tr><td class=\"pt cjk\">急行<\/td><td class=\"rd\">kyūkō<\/td><td class=\"exe\">Express &mdash; fewer stops; some private lines add a small fee.<\/td><\/tr>\n    <tr><td class=\"pt cjk\">特急<\/td><td class=\"rd\">tokkyū<\/td><td class=\"exe\">Limited express &mdash; fast, and needs a limited-express surcharge on top of fare.<\/td><\/tr>\n    <tr><td class=\"pt cjk\">新幹線<\/td><td class=\"rd\">shinkansen<\/td><td class=\"exe\">Bullet train &mdash; separate ticket + seat; IC card alone won&#39;t open the gate.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\" style=\"font-size:8.4px; color:var(--ink2);\"><b>Chinese hook:<\/b> <span class=\"cjk\">普通・快速・急行・特急<\/span> all read straight off your Chinese &mdash; the speed tiers are near-transparent. The catch is <span class=\"cjk jp\">特急<\/span> and <span class=\"cjk jp\">新幹線<\/span> cost extra beyond the base <span class=\"cjk\">運賃<\/span> (unchin, fare).<\/div>\n\n<h2>Signs &amp; words in the station<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">駅<\/span> <span class=\"r\">eki<\/span><span class=\"m\">station<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">切符<\/span> <span class=\"r\">kippu<\/span><span class=\"m\">ticket<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">改札口<\/span> <span class=\"r\">kaisatsuguchi<\/span><span class=\"m\">ticket gate<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">乗換<\/span> <span class=\"r\">norikae<\/span><span class=\"m\">transfer<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">出口 / 入口<\/span> <span class=\"r\">deguchi / iriguchi<\/span><span class=\"m\">exit / entrance<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">〜番線<\/span> <span class=\"r\">bansen<\/span><span class=\"m\">platform no.<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">運賃<\/span> <span class=\"r\">unchin<\/span><span class=\"m\">fare<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">片道 / 往復<\/span> <span class=\"r\">katamichi / ōfuku<\/span><span class=\"m\">one-way / round<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">上り / 下り<\/span> <span class=\"r\">nobori / kudari<\/span><span class=\"m\">toward / from Tokyo<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">指定席<\/span> <span class=\"r\">shiteiseki<\/span><span class=\"m\">reserved seat<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">自由席<\/span> <span class=\"r\">jiyūseki<\/span><span class=\"m\">non-reserved<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">精算<\/span> <span class=\"r\">seisan<\/span><span class=\"m\">fare adjust<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">チャージ<\/span> <span class=\"r\">chāji<\/span><span class=\"m\">top up IC<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">遅延<\/span> <span class=\"r\">chien<\/span><span class=\"m\">delay<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">運休<\/span> <span class=\"r\">unkyū<\/span><span class=\"m\">suspended<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">整理券<\/span> <span class=\"r\">seiriken<\/span><span class=\"m\">boarding ticket<\/span><\/div>\n<\/div>\n\n<h2>Phrases you&#39;ll use<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:50%\"><span class=\"cjk exj\">この電車は〜に行きますか。<\/span> <span class=\"exr\">kono densha wa ~ ni ikimasu ka<\/span><\/td><td class=\"exe\">\"Does this train go to ~?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜は何番線ですか。<\/span> <span class=\"exr\">~ wa nan-bansen desu ka<\/span><\/td><td class=\"exe\">\"Which platform for ~?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">どこで乗り換えますか。<\/span> <span class=\"exr\">doko de norikaemasu ka<\/span><\/td><td class=\"exe\">\"Where do I transfer?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜まで大人一枚お願いします。<\/span> <span class=\"exr\">~ made otona ichi-mai onegaishimasu<\/span><\/td><td class=\"exe\">\"One adult to ~, please.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">次の〜行きはいつですか。<\/span> <span class=\"exr\">tsugi no ~ yuki wa itsu desu ka<\/span><\/td><td class=\"exe\">\"When&#39;s the next one bound for ~?\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"zhbox\"><div class=\"hd\">Two that catch a Chinese speaker &mdash; and the regional-line trick<\/div>\n<b><span class=\"cjk\">駅<\/span> (eki)<\/b> is \"station\" &mdash; one you can&#39;t guess, since Chinese uses <span class=\"cjk\">站<\/span>. &nbsp;\n<b><span class=\"cjk\">上り / 下り<\/span><\/b> label trains by direction relative to <i>Tokyo<\/i>, not a place name &mdash; know which way Tokyo is from where you stand. &nbsp;\n<b>On small lines to a ryokan town<\/b> (often one-man, <span class=\"cjk\">ワンマン<\/span> wanman): grab a numbered <span class=\"cjk\">整理券<\/span> (seiriken) as you board, watch the fare board, and pay the driver on the way out. If your IC balance falls short at a gate, use the <span class=\"cjk\">精算機<\/span> (seisanki, fare-adjustment machine) beside the <span class=\"cjk\">改札<\/span> before you exit.\n<\/div>\n<\/body><\/html>"}, {"id": "driving", "title": "Driving in Japan", "kanji": "車", "sub": "Kyushu self-drive — signs & rules", "section": "ground", "group": "Getting around", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  :root{\n    --paper:#FBF8F2;\n    --ink:#1C1A17;\n    --shu:#C8352B;\n    --shu-soft:#E9C6C1;\n    --muted:#7A736A;\n    --line:#E4DCCE;\n    --line2:#EFE8DB;\n    --blue:#12459B;\n    --green:#0F6B43;\n    --amber:#E8B923;\n  }\n  *{box-sizing:border-box;}\n  body{\n    margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Zen Kaku Gothic New\",\"Hiragino Kaku Gothic ProN\",\"Yu Gothic\",\"Noto Sans JP\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;\n  }\n  .wrap{max-width:940px;margin:0 auto;padding:40px 34px 64px;}\n\n  header{position:relative;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px;}\n  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--shu);font-weight:700;margin:0 0 10px;}\n  h1{font-family:\"Zen Old Mincho\",serif;font-weight:700;font-size:38px;line-height:1.03;margin:0;}\n  h1 .jp{font-family:\"Zen Kaku Gothic New\",sans-serif;font-weight:500;font-size:.58em;color:var(--shu);margin-left:.35em;}\n  .sub{margin:12px 0 0;color:var(--muted);font-size:14px;max-width:64ch;}\n  .stamp{position:absolute;top:2px;right:0;width:74px;height:74px;border:2.5px solid var(--shu);border-radius:8px;\n    color:var(--shu);display:flex;align-items:center;justify-content:center;text-align:center;\n    font-family:\"Zen Old Mincho\",serif;font-weight:700;font-size:24px;transform:rotate(-4deg);line-height:1.05;}\n\n  .sec{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;}\n  .sec .no{font-family:\"Zen Old Mincho\",serif;color:var(--shu);font-weight:700;font-size:14px;}\n  .sec h2{font-family:\"Zen Old Mincho\",serif;font-size:22px;margin:0;font-weight:700;}\n  .sec .rule{flex:1;height:1px;background:var(--line);align-self:center;}\n  .sec .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}\n  section{margin-bottom:34px;}\n  .lead{font-size:12.5px;color:var(--muted);margin:0 0 12px;max-width:74ch;}\n\n  /* Top traps panel */\n  .traps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 32px;}\n  .trap{background:#fff;padding:12px 14px;}\n  .trap.hot{background:#FDF6F4;border-left:3px solid var(--shu);}\n  .trap h4{margin:0 0 5px;font-family:\"Zen Old Mincho\",serif;font-size:14px;}\n  .trap p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;}\n  .trap .k{color:var(--ink);font-size:13px;}\n\n  /* Sign grid */\n  .signs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:#fff;}\n  .sign{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);border-right:1px solid var(--line2);align-items:flex-start;}\n  .sign:nth-child(3n){border-right:none;}\n  .sign:nth-child(-n+3){border-top:none;}\n  .sign.flag{background:#FDF6F4;}\n  .sign svg{flex:0 0 54px;width:54px;height:54px;}\n  .sign .txt{min-width:0;}\n  .sign .jp{font-size:14px;font-weight:500;line-height:1.25;}\n  .sign .rm{font-size:10.5px;color:var(--shu);font-weight:700;letter-spacing:.02em;}\n  .sign .us{font-size:12px;margin-top:3px;}\n  .sign .us b{font-weight:700;}\n  .sign .nt{font-size:10.5px;color:var(--muted);line-height:1.35;margin-top:2px;}\n  .sign.flag .nt{color:var(--shu);}\n\n  /* Tables */\n  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);}\n  td,th{padding:8px 12px;border-top:1px solid var(--line2);vertical-align:top;text-align:left;}\n  tr:first-child td,tr:first-child th{border-top:none;}\n  th{font-family:\"Zen Old Mincho\",serif;font-size:12px;font-weight:700;background:#FCF3F1;}\n  td.a{width:30%;font-size:13px;}\n  td.a .k{font-size:15px;font-weight:500;}\n  td.a .r{font-size:10.5px;color:var(--shu);font-weight:700;}\n  td.b{width:26%;font-size:12.5px;}\n  td.c{width:44%;font-size:11.5px;color:var(--muted);line-height:1.4;}\n\n  .callout{border:1px solid var(--line);border-left:3px solid var(--shu);background:#fff;padding:12px 16px;margin:14px 0 0;}\n  .callout h4{margin:0 0 6px;font-family:\"Zen Old Mincho\",serif;font-size:14px;}\n  .callout p{margin:0 0 6px;font-size:12.5px;line-height:1.5;}\n  .callout p:last-child{margin-bottom:0;}\n\n  /* colour key */\n  .colors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n  .col{border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;}\n  .col .bar{height:34px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.04em;}\n  .col .bd{padding:9px 12px;font-size:11.5px;color:var(--muted);line-height:1.4;}\n  .col .bd b{color:var(--ink);}\n\n  footer{border-top:2px solid var(--ink);margin-top:32px;padding-top:12px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}\n  .printbtn{position:fixed;bottom:20px;right:20px;background:var(--shu);color:#fff;border:none;border-radius:999px;\n    padding:12px 20px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18);}\n  .printbtn:hover{background:#a82a22;}\n\n  @media (max-width:760px){\n    .wrap{padding:26px 16px 48px;}\n    h1{font-size:28px;}\n    .stamp{width:56px;height:56px;font-size:18px;}\n    .traps,.signs,.colors{grid-template-columns:1fr;}\n    .sign:nth-child(3n){border-right:none;}\n    .sign{border-right:none;}\n    .sign:nth-child(-n+3){border-top:1px solid var(--line2);}\n    .sign:first-child{border-top:none;}\n    table,tbody,tr,td,th{display:block;width:100%;}\n    td,th{border-top:none;padding:3px 12px;}\n    tr{border-top:1px solid var(--line2);padding:8px 0;}\n    tr:first-child{border-top:none;}\n    td.a,td.b,td.c{width:100%;}\n    th{display:none;}\n  }\n  @media print{\n    @page{margin:12mm;}\n    body{background:#fff;}\n    .wrap{max-width:none;padding:0;}\n    .printbtn{display:none;}\n    section{break-inside:avoid;}\n    .pagebreak{break-before:page;}\n  }\n<\/style><\/head><body>\n\n<div class=\"wrap\">\n\n<header>\n  <div class=\"stamp\">運転<\/div>\n  <p class=\"eyebrow\">Japan Trip · Kyushu self-drive · Nov 29 – Dec 3<\/p>\n  <h1>Driving in Japan<span class=\"jp\">どうろひょうしき<\/span><\/h1>\n  <p class=\"sub\">Japanese signs are mostly Vienna-Convention shapes, so much of it will read intuitively. This sheet covers the parts that <i>don't<\/i> — the signs that mean something different than they look like to an American driver, and the rules with no US analogue.<\/p>\n<\/header>\n\n<!-- TRAPS -->\n<div class=\"traps\">\n  <div class=\"trap hot\">\n    <h4>Stop is a triangle<\/h4>\n    <p>A red <b>downward triangle<\/b> reading <span class=\"k\">止まれ<\/span>. Your brain will read \"yield.\" It is a full legal stop.<\/p>\n  <\/div>\n  <div class=\"trap hot\">\n    <h4>徐行 is not \"yield\"<\/h4>\n    <p>Same red triangle, different word — means <b>slow to a speed you can stop instantly from<\/b> (~10 km/h). There is no US yield equivalent in Japan.<\/p>\n  <\/div>\n  <div class=\"trap hot\">\n    <h4>Every railroad crossing = stop<\/h4>\n    <p>Full stop at <b>every<\/b> crossing, every time, barriers up, nothing coming. Strictly enforced; everyone does it.<\/p>\n  <\/div>\n  <div class=\"trap\">\n    <h4>No turn on red. Ever.<\/h4>\n    <p>The mirror of US right-on-red would be left-on-red — and it's prohibited. Only a lit <b>green arrow<\/b> lets you move.<\/p>\n  <\/div>\n  <div class=\"trap\">\n    <h4>Lights are on the far side<\/h4>\n    <p>Signals hang across the intersection, not overhead at the stop line. And red goes <b>straight to green<\/b> — no amber warm-up.<\/p>\n  <\/div>\n  <div class=\"trap\">\n    <h4>Zero alcohol<\/h4>\n    <p>Not \"under the limit\" — effectively zero. Penalties extend to passengers and to whoever served you. Plan drinking days and driving days apart.<\/p>\n  <\/div>\n<\/div>\n\n<!-- REGULATORY -->\n<section>\n  <div class=\"sec\"><span class=\"no\">01<\/span><h2>Regulatory signs<\/h2><span class=\"rule\"><\/span><span class=\"tag\">規制標識 · these are orders<\/span><\/div>\n  <p class=\"lead\">Red = prohibition. Blue circle = mandatory. Highlighted tiles are the ones that mean something different than an American driver expects.<\/p>\n  <div class=\"signs\">\n\n    <div class=\"sign flag\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,55 2,7 58,7\" fill=\"#C8352B\" stroke=\"#ffffff\" stroke-width=\"2.5\"/><text x=\"30\" y=\"27\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"'Zen Kaku Gothic New',sans-serif\">止まれ<\/text><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">止まれ<\/div><div class=\"rm\">tomare<\/div>\n        <div class=\"us\">US: <b>STOP<\/b> (octagon)<\/div>\n        <div class=\"nt\">Complete stop behind the line. Newer signs add \"STOP\" in English; rural ones often don't.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign flag\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,55 2,7 58,7\" fill=\"#C8352B\" stroke=\"#ffffff\" stroke-width=\"2.5\"/><text x=\"30\" y=\"27\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"'Zen Kaku Gothic New',sans-serif\">徐行<\/text><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">徐行<\/div><div class=\"rm\">jokō<\/div>\n        <div class=\"us\">US: <b>no true equivalent<\/b><\/div>\n        <div class=\"nt\">Not \"yield.\" Slow enough to stop immediately — treat as ~10 km/h. Common at blind corners and narrow lanes.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#C8352B\" stroke=\"#fff\" stroke-width=\"2\"/><rect x=\"8\" y=\"25\" width=\"44\" height=\"10\" fill=\"#fff\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">進入禁止<\/div><div class=\"rm\">shinnyū kinshi<\/div>\n        <div class=\"us\">US: <b>DO NOT ENTER<\/b><\/div>\n        <div class=\"nt\">Identical meaning. You're at the wrong end of a one-way.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"4\" y=\"19\" width=\"52\" height=\"22\" rx=\"2\" fill=\"#12459B\"/><path d=\"M14 30 H42 M35 24 L43 30 L35 36\" stroke=\"#fff\" stroke-width=\"3.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">一方通行<\/div><div class=\"rm\">ippō tsūkō<\/div>\n        <div class=\"us\">US: <b>ONE WAY<\/b><\/div>\n        <div class=\"nt\">Same idea, blue instead of black-and-white.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#C8352B\" stroke-width=\"7\"/><text x=\"30\" y=\"39\" font-size=\"24\" font-weight=\"700\" fill=\"#12459B\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\">50<\/text><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">最高速度<\/div><div class=\"rm\">saikō sokudo<\/div>\n        <div class=\"us\">US: <b>SPEED LIMIT<\/b><\/div>\n        <div class=\"nt\">Always <b>km/h<\/b>. Number is blue on white with a red ring — no word \"SPEED.\"<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#12459B\"/><text x=\"30\" y=\"38\" font-size=\"23\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" text-decoration=\"underline\">50<\/text><rect x=\"17\" y=\"41\" width=\"26\" height=\"3\" fill=\"#fff\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">最低速度<\/div><div class=\"rm\">saitei sokudo<\/div>\n        <div class=\"us\">US: <b>MINIMUM SPEED<\/b><\/div>\n        <div class=\"nt\">Blue circle, underlined number. Expressways only — the minimum is 50 km/h.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#12459B\" stroke=\"#C8352B\" stroke-width=\"5\"/><line x1=\"14\" y1=\"44\" x2=\"46\" y2=\"16\" stroke=\"#C8352B\" stroke-width=\"6\" stroke-linecap=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">駐車禁止<\/div><div class=\"rm\">chūsha kinshi<\/div>\n        <div class=\"us\">US: <b>NO PARKING<\/b><\/div>\n        <div class=\"nt\">One slash. You may briefly stop to load; you may not park.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign flag\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#12459B\" stroke=\"#C8352B\" stroke-width=\"5\"/><line x1=\"14\" y1=\"44\" x2=\"46\" y2=\"16\" stroke=\"#C8352B\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"16\" x2=\"46\" y2=\"44\" stroke=\"#C8352B\" stroke-width=\"6\" stroke-linecap=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">駐停車禁止<\/div><div class=\"rm\">chūteisha kinshi<\/div>\n        <div class=\"us\">US: <b>NO STOPPING / STANDING<\/b><\/div>\n        <div class=\"nt\">The X means you can't even pause. Easy to mistake for the single-slash one at speed.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#C8352B\" stroke-width=\"5\"/><path d=\"M20 42 V28 a10 10 0 0 1 20 0 V38\" stroke=\"#12459B\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M34 33 L40 39 L46 33\" stroke=\"#12459B\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"12\" y1=\"47\" x2=\"48\" y2=\"13\" stroke=\"#C8352B\" stroke-width=\"5\" stroke-linecap=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">転回禁止<\/div><div class=\"rm\">tenkai kinshi<\/div>\n        <div class=\"us\">US: <b>NO U-TURN<\/b><\/div>\n        <div class=\"nt\">Same symbol you know. Often reinforced by a crossed \"U\" painted on the road.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#C8352B\" stroke-width=\"5\"/><rect x=\"14\" y=\"24\" width=\"15\" height=\"10\" rx=\"2\" fill=\"#C8352B\"/><rect x=\"31\" y=\"27\" width=\"15\" height=\"10\" rx=\"2\" fill=\"#1C1A17\"/><line x1=\"12\" y1=\"47\" x2=\"48\" y2=\"13\" stroke=\"#C8352B\" stroke-width=\"4.5\" stroke-linecap=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">追越し禁止<\/div><div class=\"rm\">oikoshi kinshi<\/div>\n        <div class=\"us\">US: <b>DO NOT PASS<\/b><\/div>\n        <div class=\"nt\">Backed by a <b>solid yellow centre line<\/b>, which alone prohibits crossing to overtake.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#12459B\"/><path d=\"M30 44 V20 M22 27 L30 19 L38 27\" stroke=\"#fff\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">指定方向外進行禁止<\/div><div class=\"rm\">shitei hōkōgai shinkō kinshi<\/div>\n        <div class=\"us\">US: <b>mandatory direction arrow<\/b><\/div>\n        <div class=\"nt\">Blue circle = you <i>must<\/i> go this way. Arrows vary (straight, left, right, combinations).<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#C8352B\" stroke-width=\"7\"/><text x=\"30\" y=\"36\" font-size=\"12\" font-weight=\"700\" fill=\"#1C1A17\" text-anchor=\"middle\" font-family=\"'Zen Kaku Gothic New',sans-serif\">通行止<\/text><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">通行止め<\/div><div class=\"rm\">tsūkōdome<\/div>\n        <div class=\"us\">US: <b>ROAD CLOSED<\/b><\/div>\n        <div class=\"nt\">Closed to everything. You'll meet this on Aso mountain roads after snow or volcanic activity.<\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<!-- WARNING -->\n<section class=\"pagebreak\">\n  <div class=\"sec\"><span class=\"no\">02<\/span><h2>Warning signs<\/h2><span class=\"rule\"><\/span><span class=\"tag\">警戒標識 · yellow diamonds, like home<\/span><\/div>\n  <p class=\"lead\">Good news: these are the closest to US practice — yellow diamond, black pictogram, advisory rather than legal. The Kyushu-relevant ones are on the right.<\/p>\n  <div class=\"signs\">\n\n    <div class=\"sign flag\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><rect x=\"19\" y=\"22\" width=\"22\" height=\"13\" rx=\"2\" fill=\"#1C1A17\"/><circle cx=\"24\" cy=\"38\" r=\"3.4\" fill=\"#1C1A17\"/><circle cx=\"36\" cy=\"38\" r=\"3.4\" fill=\"#1C1A17\"/><rect x=\"27\" y=\"14\" width=\"6\" height=\"8\" fill=\"#1C1A17\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">踏切あり<\/div><div class=\"rm\">fumikiri ari<\/div>\n        <div class=\"us\">US: <b>RAILROAD CROSSING<\/b><\/div>\n        <div class=\"nt\">Critical difference: in Japan you must come to a <b>full stop<\/b> at the crossing itself, barriers up or not.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><path d=\"M22 44 C22 34 38 32 38 22 M38 22 L33 27 M38 22 L43 27\" stroke=\"#1C1A17\" stroke-width=\"3.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">屈曲あり / つづら折り<\/div><div class=\"rm\">kukkyoku / tsuzuraori<\/div>\n        <div class=\"us\">US: <b>CURVE / WINDING ROAD<\/b><\/div>\n        <div class=\"nt\">You'll see a lot of these between Kumamoto and Kurokawa, and on the Takachiho roads.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><path d=\"M16 22 L30 40 L44 22\" stroke=\"#1C1A17\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"22\" cy=\"18\" r=\"3\" fill=\"#1C1A17\"/><circle cx=\"34\" cy=\"15\" r=\"4\" fill=\"#1C1A17\"/><circle cx=\"42\" cy=\"20\" r=\"2.6\" fill=\"#1C1A17\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">落石のおそれあり<\/div><div class=\"rm\">rakuseki no osore ari<\/div>\n        <div class=\"us\">US: <b>FALLING ROCK<\/b><\/div>\n        <div class=\"nt\">Very common on the Aso caldera rim and gorge roads. Keep off the shoulder.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign flag\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><path d=\"M20 40 C20 30 26 26 26 20 L24 15 M26 20 L34 20 L36 15 M34 20 C34 26 40 30 40 40\" stroke=\"#1C1A17\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"30\" cy=\"30\" rx=\"9\" ry=\"7\" fill=\"#1C1A17\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">動物が飛び出すおそれあり<\/div><div class=\"rm\">dōbutsu tobidashi<\/div>\n        <div class=\"us\">US: <b>DEER CROSSING<\/b><\/div>\n        <div class=\"nt\">Take it seriously around Kurokawa and Aso at dusk and dawn — deer and boar both.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><rect x=\"20\" y=\"24\" width=\"20\" height=\"11\" rx=\"2\" fill=\"#1C1A17\"/><circle cx=\"25\" cy=\"38\" r=\"3\" fill=\"#1C1A17\"/><circle cx=\"35\" cy=\"38\" r=\"3\" fill=\"#1C1A17\"/><path d=\"M16 44 Q22 41 28 44 T40 44\" stroke=\"#1C1A17\" stroke-width=\"2.4\" fill=\"none\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">すべりやすい<\/div><div class=\"rm\">suberiyasui<\/div>\n        <div class=\"us\">US: <b>SLIPPERY WHEN WET<\/b><\/div>\n        <div class=\"nt\">In early December, assume shaded mountain sections are icy at dawn even without this sign.<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"sign\">\n      <svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><polygon points=\"30,3 57,30 30,57 3,30\" fill=\"#E8B923\" stroke=\"#1C1A17\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"17\" r=\"4\" fill=\"#1C1A17\"/><path d=\"M26 21 L26 34 M26 24 L19 30 M26 24 L34 29 M26 34 L21 45 M26 34 L32 45\" stroke=\"#1C1A17\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"40\" cy=\"20\" r=\"3.4\" fill=\"#1C1A17\"/><path d=\"M40 23 L40 33 M40 26 L35 31 M40 26 L45 31 M40 33 L36 43 M40 33 L44 43\" stroke=\"#1C1A17\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>\n      <div class=\"txt\">\n        <div class=\"jp\">学校・幼稚園あり<\/div><div class=\"rm\">gakkō / yōchien ari<\/div>\n        <div class=\"us\">US: <b>SCHOOL ZONE<\/b><\/div>\n        <div class=\"nt\">Japanese kids walk to school unsupervised in groups. Slow right down.<\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<!-- SIGN COLOURS -->\n<section>\n  <div class=\"sec\"><span class=\"no\">03<\/span><h2>Guide sign colours<\/h2><span class=\"rule\"><\/span><span class=\"tag\">案内標識 · the fastest orientation trick<\/span><\/div>\n  <p class=\"lead\">The background colour tells you what kind of road you're being pointed at — before you read a single character. This is the single most useful navigation shortcut in Japan.<\/p>\n  <div class=\"colors\">\n    <div class=\"col\">\n      <div class=\"bar\" style=\"background:var(--green)\">GREEN<\/div>\n      <div class=\"bd\"><b>Expressway (高速道路).<\/b> Tolled. Your Kyushu Expressway Pass and ETC card live here. Note this is the reverse of US practice, where green is the ordinary guide colour.<\/div>\n    <\/div>\n    <div class=\"col\">\n      <div class=\"bar\" style=\"background:var(--blue)\">BLUE<\/div>\n      <div class=\"bd\"><b>General / national road (国道).<\/b> Free, ordinary roads. Route numbers appear in a blue inverted triangle — e.g. Route 57 across Aso.<\/div>\n    <\/div>\n    <div class=\"col\">\n      <div class=\"bar\" style=\"background:#fff;color:var(--ink);border-bottom:1px solid var(--line)\">WHITE<\/div>\n      <div class=\"bd\"><b>Prefectural / local road.<\/b> Smaller roads, town signage, parking direction. Most of your Kurokawa and Saga back-road driving.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"callout\">\n    <h4>Route number shapes<\/h4>\n    <p>A <b>blue inverted triangle<\/b> with a number is a national route (国道) — the Japanese equivalent of a US Highway shield. A <b>hexagon<\/b> is a prefectural route. Green rectangles with an \"E\" number are expressways (E3 Kyushu Expressway, E34 Nagasaki Expressway).<\/p>\n  <\/div>\n<\/section>\n\n<!-- ROAD MARKINGS -->\n<section>\n  <div class=\"sec\"><span class=\"no\">04<\/span><h2>Road markings<\/h2><span class=\"rule\"><\/span><span class=\"tag\">painted, and legally binding<\/span><\/div>\n  <p class=\"lead\">Japan leans on paint far more than the US does, and the markings carry the same legal weight as signs. The yellow/white line rule is inverted from what you're used to.<\/p>\n  <table>\n    <tr><th>Marking<\/th><th>Means<\/th><th>vs. US<\/th><\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">Solid YELLOW centre line<\/div><\/td>\n      <td class=\"b\">No crossing to overtake<\/td>\n      <td class=\"c\">In the US yellow simply separates opposing traffic. In Japan a <b>solid yellow line is itself a prohibition<\/b> on crossing to pass.<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">White dashed centre line<\/div><\/td>\n      <td class=\"b\">Overtaking permitted<\/td>\n      <td class=\"c\">Same as a US dashed line.<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">Red-painted road surface<\/div><\/td>\n      <td class=\"b\">Stop / heightened caution<\/td>\n      <td class=\"c\">No US equivalent. Painted ahead of stop lines, signals, and accident-prone spots. Treat red asphalt as a warning.<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">Two white diamonds ◇◇<\/div><\/td>\n      <td class=\"b\">Crosswalk ahead<\/td>\n      <td class=\"c\">No US equivalent. Painted well before a pedestrian crossing — start scanning.<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">Giant painted numerals<\/div><\/td>\n      <td class=\"b\">Speed limit<\/td>\n      <td class=\"c\">The limit repeated on the asphalt. Handy when you missed the sign.<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"a\"><div class=\"k\">止まれ painted on road<\/div><\/td>\n      <td class=\"b\">Stop line<\/td>\n      <td class=\"c\">Stop <b>behind<\/b> the line, then creep forward to see.<\/td>\n    <\/tr>\n  <\/table>\n<\/section>\n\n<!-- SPEED -->\n<section>\n  <div class=\"sec\"><span class=\"no\">05<\/span><h2>Speed &amp; enforcement<\/h2><span class=\"rule\"><\/span><span class=\"tag\">everything in km/h<\/span><\/div>\n  <table>\n    <tr><th>Road type<\/th><th>Typical posted<\/th><th>Notes<\/th><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Expressway<\/div><div class=\"r\">高速道路<\/div><\/td><td class=\"b\">80–100 km/h<br>(50–62 mph)<\/td><td class=\"c\">Statutory default 100 if unposted; many sections posted at 80. Minimum 50. A few Kantō routes run 120, none on your route.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">General road<\/div><div class=\"r\">一般道<\/div><\/td><td class=\"b\">40–60 km/h<br>(25–37 mph)<\/td><td class=\"c\">Statutory default 60 if unposted.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Urban / residential<\/div><\/td><td class=\"b\">20–40 km/h<br>(12–25 mph)<\/td><td class=\"c\">Feels crawlingly slow to a US driver. Everyone complies.<\/td><\/tr>\n  <\/table>\n  <div class=\"callout\">\n    <h4>How it's enforced<\/h4>\n    <p>Fixed automatic cameras (<b>Orbis<\/b>) and unmarked patrol cars (<b>覆面パトカー<\/b>, <i>fukumen patokā<\/i> — often plain white or silver sedans). Fines arrive to the rental company and get passed to you with an admin fee.<\/p>\n    <p>The honest practical read: Japanese traffic generally flows a little above the posted limit, and matching the flow is the safest thing to do. What gets punished is being conspicuously faster than everyone else — the same instinct that serves you in New York.<\/p>\n  <\/div>\n<\/section>\n\n<!-- PARKING -->\n<section class=\"pagebreak\">\n  <div class=\"sec\"><span class=\"no\">06<\/span><h2>Parking<\/h2><span class=\"rule\"><\/span><span class=\"tag\">the rule: never on the street<\/span><\/div>\n  <p class=\"lead\">Street parking is essentially not a thing in Japan. Assume every stop needs a lot, and budget for it — this is the biggest daily-friction difference from driving in the US.<\/p>\n  <table>\n    <tr><th>Sign / term<\/th><th>Means<\/th><th>Note<\/th><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">駐車場<\/div><div class=\"r\">chūshajō<\/div><\/td><td class=\"b\">Parking lot<\/td><td class=\"c\">The word to look for. Often marked with a large blue <b>P<\/b>.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">満車<\/div><div class=\"r\">mansha<\/div><\/td><td class=\"b\">FULL<\/td><td class=\"c\">Lit up on the lot's sign. Don't queue — find another.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">空車<\/div><div class=\"r\">kūsha<\/div><\/td><td class=\"b\">Spaces available<\/td><td class=\"c\">The one you want.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">コインパーキング<\/div><div class=\"r\">koin pākingu<\/div><\/td><td class=\"b\">Unattended pay lot<\/td><td class=\"c\">A flap rises under your car and drops when you pay at the machine by bay number. Cash and IC usually accepted.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">精算機<\/div><div class=\"r\">seisanki<\/div><\/td><td class=\"b\">Payment machine<\/td><td class=\"c\">Enter your bay number, pay, then you have a few minutes to leave.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Mechanical / tower lots<\/div><\/td><td class=\"b\">Car elevator<\/td><td class=\"c\">Common in cities. Height and width limits are strict — check the posted 全高 (height) before entering.<\/td><\/tr>\n  <\/table>\n  <div class=\"callout\">\n    <h4>Reverse into the space<\/h4>\n    <p>Nearly everyone in Japan backs into parking bays, and lots are laid out expecting it — nose-in parking can leave you unable to exit cleanly. Also: parking enforcement officers patrol on foot and ticket aggressively, and your rental company will pass the fine to you.<\/p>\n  <\/div>\n<\/section>\n\n<!-- RULES -->\n<section>\n  <div class=\"sec\"><span class=\"no\">07<\/span><h2>Rules with no US analogue<\/h2><span class=\"rule\"><\/span><span class=\"tag\">the ones worth memorising<\/span><\/div>\n  <table>\n    <tr><th>Rule<\/th><th>Detail<\/th><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Full stop at every railroad crossing<\/div><\/td><td class=\"c\" style=\"width:70%\">Every crossing, every time, even with barriers up and clear sightlines. Stop, look both ways, then proceed. Failing to stop is a real, ticketed violation.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">No turning on red<\/div><\/td><td class=\"c\">There is no equivalent of right-on-red. A red light means stop until it changes — unless a <b>green arrow<\/b> is lit for your direction, in which case you may go that way only.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Right-turn priority order<\/div><\/td><td class=\"c\">Turning right crosses oncoming traffic (the US left turn). Yield order: <b>1.<\/b> pedestrians <b>2.<\/b> cars turning left <b>3.<\/b> oncoming traffic going straight <b>4.<\/b> you. Right-turn collisions are the classic foreign-driver crash.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Flashing red = stop<\/div><\/td><td class=\"c\">A flashing red signal is a stop sign. Flashing yellow means proceed with caution. Common late at night in rural areas.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Zero-tolerance alcohol<\/div><\/td><td class=\"c\">Effectively 0.00. Penalties are severe and can extend to passengers and to whoever provided the drink. On onsen and kaiseki nights, the car stays parked.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Accidents: call police, always<\/div><\/td><td class=\"c\">Even a scratch. You need an accident certificate (<b>事故証明書<\/b>) or your insurance is void. Notify the rental company immediately too. Police: <b>110<\/b>.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Hazards as \"thank you\"<\/div><\/td><td class=\"c\">A quick double-flash of the hazard lights after someone lets you merge is standard Japanese road courtesy. Use it — it's noticed.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Carry the IDP and passport<\/div><\/td><td class=\"c\">The 1949 Geneva IDP is valid one year from entry and must be carried <b>with<\/b> your home licence. Police do document checks in tourist areas.<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<!-- FIRST HOUR -->\n<section>\n  <div class=\"sec\"><span class=\"no\">08<\/span><h2>The first hour on the left<\/h2><span class=\"rule\"><\/span><span class=\"tag\">what actually goes wrong<\/span><\/div>\n  <table>\n    <tr><th>What happens<\/th><th>The fix<\/th><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Wipers instead of indicator<\/div><\/td><td class=\"c\" style=\"width:70%\">The stalks are mirrored. You'll do it a dozen times on day one. Harmless, universal, fades by day two.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Drifting left, clipping the kerb<\/div><\/td><td class=\"c\">You sit on the right, so your sense of the car's centre is off by a seat-width. Fix: keep <b>your own body near the centreline<\/b> of the road. If your shoulder feels close to the middle, you're placed correctly.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Turning into the wrong lane<\/div><\/td><td class=\"c\">Happens on <b>empty<\/b> roads, not busy ones — with no traffic to copy, instinct takes over. Say it aloud the first day: <i>\"left is tight, right is wide.\"<\/i> After every turn, consciously confirm you're in the left lane. Pulling out of a rural car park is the classic moment.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Misjudging narrow roads<\/div><\/td><td class=\"c\">Rural Kyushu roads run to one-and-a-half lanes with a drop on one side. Slow down, use the pull-outs, and let locals pass. A smaller car is a genuine advantage here.<\/td><\/tr>\n    <tr><td class=\"a\"><div class=\"k\">Navigating by address<\/div><\/td><td class=\"c\">Japanese addresses are near-useless for navigation. Enter the destination's <b>phone number<\/b> into the car's GPS instead — every attraction lists one. Download offline Google Maps for Kyushu; signal drops around Aso.<\/td><\/tr>\n  <\/table>\n  <div class=\"callout\">\n    <h4>Three phrases you'll actually use<\/h4>\n    <p><span style=\"font-size:15px\">レギュラー、満タンでお願いします<\/span> <i>regyuraa, mantan de onegai shimasu<\/i> — regular, fill it up (many stations are full-service; return the car full)<\/p>\n    <p><span style=\"font-size:15px\">道は通れますか<\/span> <i>michi wa tooremasu ka<\/i> — is the road passable? (worth asking about Aso in December)<\/p>\n    <p><span style=\"font-size:15px\">遅れます<\/span> <i>okuremasu<\/i> — I'll be late (for the rental desk if the mountain roads slow you)<\/p>\n  <\/div>\n<\/section>\n\n<footer>\n  <span>Driving reference · Kyushu self-drive · Fukuoka → Nagasaki → Kurokawa → Fukuoka<\/span>\n  <span>Drive left · stop at every crossing · mountain roads in daylight<\/span>\n<\/footer>\n\n<\/div>\n<\/body><\/html>"}, {"id": "etiquette", "title": "Etiquette", "kanji": "礼", "sub": "Manners & faux pas vs China", "section": "ground", "group": "Culture & safety", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--   .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">礼<\/div><div><h1>Etiquette<\/h1><div class=\"st\">Manners & faux pas vs China<\/div><\/div><\/div>\n<style>\n  h2 { margin: 8px 0 4px; }\n  td { padding: 3.5px 8px; }\n  .concept { padding: 8px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.4px; line-height: 1.45; }\n  .zhbox { margin: 5px 0; padding: 8px 12px; }\n  .note { margin-top: 4px; }\n<\/style>\n\n<h2>The one principle everything flows from<\/h2>\n<div class=\"concept\"><div class=\"big\">\nNearly all Japanese public etiquette comes from a single idea: <b><span class=\"cjk\">迷惑をかけない<\/span><\/b>\n<span class=\"romaji\">(meiwaku o kakenai)<\/span> &mdash; don&#39;t be a bother to others. Keep your impact on strangers near zero\nand you&#39;re 95% right. You already know <span class=\"cjk\">面子<\/span> <span class=\"romaji\">(mianzi, face)<\/span> from China &mdash;\nJapan is face-conscious too, but its public-conduct engine is <i>meiwaku<\/i>, plus <span class=\"cjk\">建前 / 本音<\/span>\n<span class=\"romaji\">(tatemae / honne)<\/span>: the polished public face vs. the private truth. Read the room; harmony beats directness.\n<\/div><\/div>\n\n<h2>China &rarr; Japan &mdash; where it actually diverges<\/h2>\n<table>\n  <thead><tr><th style=\"width:20%\">Situation<\/th><th style=\"width:38%\">What you may be used to in China<\/th><th style=\"width:42%\">In Japan<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Public volume<\/td><td class=\"exe\">Lively, loud is fine<\/td><td class=\"exe\"><b>Quiet<\/b> &mdash; low voices, near-silence on trains<\/td><\/tr>\n    <tr><td class=\"fn\">Phone on transit<\/td><td class=\"exe\">Calls normal<\/td><td class=\"exe\">No calls; phone on <span class=\"cjk\">マナーモード<\/span> (manā mōdo, silent)<\/td><\/tr>\n    <tr><td class=\"fn\">Street eating<\/td><td class=\"exe\">Common<\/td><td class=\"exe\"><span class=\"cjk\">食べ歩き<\/span> (tabearuki) frowned on &mdash; eat by the stall<\/td><\/tr>\n    <tr><td class=\"fn\">Greeting<\/td><td class=\"exe\">Handshakes common<\/td><td class=\"exe\">A bow or nod is default; no hugs<\/td><\/tr>\n    <tr><td class=\"fn\">Saying no<\/td><td class=\"exe\">Can be direct<\/td><td class=\"exe\">Indirect &mdash; <span class=\"cjk\">ちょっと…<\/span> (chotto…) trailing off = \"no\"<\/td><\/tr>\n    <tr><td class=\"fn\">Escalators<\/td><td class=\"exe\">&mdash;<\/td><td class=\"exe\">Stand one side (Tokyo: left; Osaka: right), let walkers pass<\/td><\/tr>\n    <tr><td class=\"fn\">Trash<\/td><td class=\"exe\">Bins around<\/td><td class=\"exe\">Few public bins &mdash; carry your trash with you<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>At the table<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Chopstick taboos<\/td><td class=\"exe\">Never stand them upright in rice, and never pass food <b>chopstick-to-chopstick<\/b> &mdash; both are funeral rites. (The upright one you know from China; the hand-to-hand pass is the big Japanese one.) Don&#39;t spear, wave, or point with them.<\/td><\/tr>\n    <tr><td class=\"fn\">Slurping<\/td><td class=\"exe\">Fine &mdash; even a compliment for ramen and soba. Go ahead.<\/td><\/tr>\n    <tr><td class=\"fn\">Drinks<\/td><td class=\"exe\">Pour for others, not yourself; hold your glass with both hands when poured for. Wait for <span class=\"cjk\">乾杯<\/span> (kanpai) before the first sip.<\/td><\/tr>\n    <tr><td class=\"fn\">Bookends<\/td><td class=\"exe\"><span class=\"cjk\">いただきます<\/span> (itadakimasu) before eating, <span class=\"cjk\">ごちそうさまでした<\/span> (gochisōsama deshita) after.<\/td><\/tr>\n    <tr><td class=\"fn\">Paying<\/td><td class=\"exe\"><b>No tipping.<\/b> Place cash on the little tray (<span class=\"cjk\">トレイ<\/span>, torei) &mdash; don&#39;t hand it to the cashier.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Out &amp; about<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Trains<\/td><td class=\"exe\">Quiet zone: no calls, low voices, give up priority seats, and let people off <i>before<\/i> you board.<\/td><\/tr>\n    <tr><td class=\"fn\">Gestures<\/td><td class=\"exe\">Beckon <b>palm-down<\/b> (palm-up waving reads as rude); point with an open hand, never a finger and never at a person.<\/td><\/tr>\n    <tr><td class=\"fn\">Nose<\/td><td class=\"exe\">Don&#39;t blow your nose in public or at the table &mdash; step away. A mask when you&#39;re sick is courtesy, not alarm.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Sacred &amp; social<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Shrine vs temple<\/td><td class=\"exe\">At a Shinto shrine (<span class=\"cjk\">神社<\/span>, jinja) prayer is <span class=\"cjk\">二礼二拍手一礼<\/span> <span class=\"romaji\">(ni-rei ni-hakushu ichi-rei)<\/span> &mdash; bow twice, clap twice, bow once. At a Buddhist temple (<span class=\"cjk\">お寺<\/span>, otera), hands together quietly &mdash; <b>do not clap.<\/b> Rinse hands at the <span class=\"cjk\">手水<\/span> (temizu) basin first.<\/td><\/tr>\n    <tr><td class=\"fn\">Shoes<\/td><td class=\"exe\">Off at homes, ryokan, tatami rooms, some restaurants and temple halls &mdash; and never wear the toilet slippers back out.<\/td><\/tr>\n    <tr><td class=\"fn\">Gifts &amp; numbers<\/td><td class=\"exe\">Give and receive with <b>both hands<\/b>, a little modestly. Avoid sets of <b>4<\/b> (<span class=\"cjk\">死<\/span>, death) and <b>9<\/b> (<span class=\"cjk\">苦<\/span>, suffering) &mdash; you know 4 from China, but 9 is the flip: unlucky here, lucky there.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Phrases that smooth everything<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\"><span class=\"cjk exj\">すみません<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">\"excuse me / sorry / thanks\" &mdash; the universal lubricant<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">大丈夫です<\/span> <span class=\"exr\">daijōbu desu<\/span><\/td><td class=\"exe\">\"I&#39;m fine / no thanks\" (your false-friend word, used well)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">結構です<\/span> <span class=\"exr\">kekkō desu<\/span><\/td><td class=\"exe\">a polite \"no thank you\" when declining<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ちょっと…<\/span> <span class=\"exr\">chotto…<\/span><\/td><td class=\"exe\">trail it off to decline softly &mdash; and read it the same way when you hear it<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"zhbox\"><div class=\"hd\">The five to burn in &mdash; and the fallback<\/div>\n<b>1.<\/b> Keep quiet and no phone calls on trains &mdash; the #1 adjustment coming from China. &nbsp;\n<b>2.<\/b> Never chopsticks-upright, never pass food chopstick-to-chopstick. &nbsp;\n<b>3.<\/b> No tipping &mdash; use the tray. &nbsp;\n<b>4.<\/b> Don&#39;t clap at a Buddhist temple (clapping is for shrines). &nbsp;\n<b>5.<\/b> Read the soft no &mdash; <span class=\"cjk\">ちょっと<\/span> means no. &nbsp;\n<b>Fallback:<\/b> when unsure, pick the option that inconveniences others least. That instinct is right almost every time.\n<\/div>\n<\/body><\/html>"}, {"id": "emergency", "title": "Emergency & Medical", "kanji": "救", "sub": "Numbers, meds rules, pharmacy", "section": "ground", "group": "Culture & safety", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><base target=_blank><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center; 4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">救<\/div><div><h1>Emergency & Medical<\/h1><div class=\"st\">Numbers, meds rules, pharmacy<\/div><\/div><\/div>\n<style>\n  h2 { margin: 9px 0 4px; }\n  td { padding: 3.5px 8px; }\n  .concept { padding: 8px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.4px; line-height: 1.45; }\n  .zhbox { margin: 5px 0; padding: 8px 12px; }\n  .num { font-size: 15px; font-weight: 800; color: var(--red); white-space: nowrap; }\n  .warn { background: #fdece8; border: 1px solid #e6a99e; border-left: 4px solid var(--red);\n          border-radius: 6px; padding: 9px 12px; margin: 5px 0; }\n  .warn .hd { font-weight: 800; color: var(--red); font-size: 10px; margin-bottom: 3px; }\n  .ban td { border-bottom: 1px solid var(--line); }\n  .tagB { color: #fff; background: var(--red); font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n  .tagP { color: #fff; background: #b8860b; font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n  .tagOK { color: #fff; background: var(--zh); font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n<\/style>\n\n<h2>The playbook<\/h2>\n<div class=\"concept\"><div class=\"big\">\nJapan is exceptionally safe, but the system differs from home in ways worth knowing cold: <b>one number (119) covers both\nfire and ambulance<\/b>, there&#39;s a triage line if you&#39;re unsure, you <b>pay upfront<\/b> for care, and <b>medication rules\nare strict<\/b> &mdash; some common Western drugs are outright banned. Calls below are <b>free from any phone<\/b>, even with no SIM.\nFor an interpreter, say <span class=\"cjk\">英語をお願いします<\/span> <span class=\"romaji\">(eigo o onegaishimasu)<\/span> and stay on the line.\n<\/div><\/div>\n\n<h2>Numbers to save now<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:20%\"><span class=\"num\">110<\/span><\/td><td class=\"exe\"><b>Police<\/b> &mdash; crime, theft, accidents. (<span class=\"cjk\">警察<\/span>, keisatsu)<\/td><\/tr>\n    <tr><td><span class=\"num\">119<\/span><\/td><td class=\"exe\"><b>Fire &amp; Ambulance<\/b> &mdash; both on one number. Say <span class=\"cjk\">救急<\/span> (kyūkyū) for ambulance, <span class=\"cjk\">火事です<\/span> (kaji desu) for fire.<\/td><\/tr>\n    <tr><td><span class=\"num\">#7119<\/span><\/td><td class=\"exe\"><b>\"Do I need an ambulance?\"<\/b> &mdash; a nurse triages your symptoms. 24/7 in Tokyo with English; coverage varies elsewhere.<\/td><\/tr>\n    <tr><td><span class=\"num\">118<\/span><\/td><td class=\"exe\"><b>Coast Guard<\/b> &mdash; emergencies at sea.<\/td><\/tr>\n    <tr><td><span class=\"num\">#9110<\/span><\/td><td class=\"exe\"><b>Police non-emergency<\/b> &mdash; advice line for lost items, safety questions (not urgent).<\/td><\/tr>\n    <tr><td><span class=\"num\">171<\/span><\/td><td class=\"exe\"><b>Disaster message board<\/b> &mdash; record/check a voice message to tell family you&#39;re safe when phone lines jam.<\/td><\/tr>\n    <tr><td><span class=\"num\">050-3816-2787<\/span><\/td><td class=\"exe\"><b>JNTO Japan Visitor Hotline<\/b> &mdash; 24/7 in English / Chinese / Korean. Your best \"what do I do now?\" line. (Overseas: +81-50-3816-2787)<\/td><\/tr>\n    <tr><td><span class=\"num\">03-5285-8181<\/span><\/td><td class=\"exe\"><b>HIMAWARI (Tokyo)<\/b> &mdash; finds clinics/hospitals with foreign-language support. 9:00&ndash;20:00.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Who does what &mdash; the medical system<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:30%\" class=\"fn\"><span class=\"cjk\">クリニック / 診療所<\/span> <span class=\"exr\">kurinikku / shinryōjo<\/span><\/td><td class=\"exe\"><b>Clinic<\/b> &mdash; walk-in for minor issues (cold, minor injury). No GP-gatekeeper; just go. Daytime hours.<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">病院<\/span> <span class=\"exr\">byōin<\/span><\/td><td class=\"exe\"><b>Hospital<\/b> &mdash; serious problems &amp; after-hours ER. (Note: hospital is <span class=\"cjk\">病院<\/span> here, not the Chinese <span class=\"cjk\">医院<\/span>.)<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">薬局<\/span> <span class=\"exr\">yakkyoku<\/span><\/td><td class=\"exe\"><b>Pharmacy<\/b> &mdash; fills prescriptions (<span class=\"cjk\">処方箋<\/span>, shohōsen). Often closes early evening.<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">ドラッグストア<\/span> <span class=\"exr\">doraggu sutoa<\/span><\/td><td class=\"exe\"><b>Drugstore<\/b> &mdash; OTC medicine (<span class=\"cjk\">市販薬<\/span>, shihan&#39;yaku), longer hours (Matsukiyo, Don Quijote). Some meds are kept behind the counter.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\" style=\"font-size:8.5px; color:var(--ink2);\"><b>Pay upfront.<\/b> Your home insurance won&#39;t bill Japanese providers &mdash; you pay the full cost on the spot, then claim on travel insurance. <b>Bring your passport<\/b>, keep every receipt, and get travel medical cover before you fly. English is limited &mdash; use HIMAWARI or the JNTO hotline to find an English-friendly clinic.<\/div>\n\n<h2>Protocols that differ from home<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:24%\" class=\"fn\">Lost something<\/td><td class=\"exe\">Go to a <span class=\"cjk\">交番<\/span> (kōban) &mdash; the small neighborhood police boxes everywhere. Japan&#39;s lost-and-found is remarkable; wallets and phones are routinely handed in.<\/td><\/tr>\n    <tr><td class=\"fn\">Earthquakes<\/td><td class=\"exe\">Install <b>Safety Tips<\/b> (official English push-alerts for quakes, tsunami, typhoons) and follow NHK WORLD-JAPAN. In a quake: <b>drop, cover, hold on<\/b>; don&#39;t bolt outside; after shaking, open a door and avoid elevators. Head to a marked <span class=\"cjk\">避難所<\/span> (hinanjo, evacuation site) if told to.<\/td><\/tr>\n    <tr><td class=\"fn\">Ambulance cost<\/td><td class=\"exe\">Transport itself is generally <b>free<\/b> (run by the fire department); you pay for treatment at the hospital.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"page-break\"><\/div>\n\n<h2>Bringing medication &mdash; check BEFORE you pack<\/h2>\n<div class=\"warn\"><div class=\"hd\">Some common Western medicines are illegal in Japan &mdash; a prescription does not exempt you.<\/div>\n<div style=\"font-size:9.2px;\">Rules go by <b>active ingredient<\/b>, not brand. Getting this wrong can mean confiscation, detention, or prosecution &mdash; so verify every medication against Japan&#39;s official list well before travel, and apply for a permit if needed.<\/div>\n<\/div>\n<table class=\"ban\">\n  <thead><tr><th style=\"width:16%\">Status<\/th><th style=\"width:46%\">Examples<\/th><th style=\"width:38%\">What to do<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td><span class=\"tagB\">BANNED<\/span><\/td>\n      <td class=\"exe\"><b>Adderall, Vyvanse / Elvanse<\/b> (amphetamine ADHD meds); <b>pseudoephedrine<\/b> decongestants &mdash; Sudafed (original), Actifed, Vicks inhalers; cannabis / THC / most CBD.<\/td>\n      <td class=\"exe\">Do not bring, even with a prescription &mdash; <b>no exceptions<\/b>. Leave at home; ask your doctor about a legal alternative.<\/td><\/tr>\n    <tr><td><span class=\"tagP\">PERMIT<\/span><\/td>\n      <td class=\"exe\"><b>Methylphenidate<\/b> (Ritalin, Concerta); <b>codeine<\/b>, tramadol, morphine; <b>benzodiazepines<\/b> (diazepam, alprazolam) over 1 month; any <b>injectable<\/b> incl. insulin &amp; EpiPen over 1 month; any prescription med over a 1-month supply.<\/td>\n      <td class=\"exe\">Get a <b>Yunyu Kakunin-sho<\/b> import certificate (formerly \"Yakkan Shoumei\") in advance and carry it with the meds at customs.<\/td><\/tr>\n    <tr><td><span class=\"tagOK\">USUALLY OK<\/span><\/td>\n      <td class=\"exe\">Acetaminophen (Tylenol), ibuprofen (Advil); most antidepressants (sertraline, escitalopram); insulin &amp; most heart meds within a 1-month supply.<\/td>\n      <td class=\"exe\">Fine &mdash; carry them in original packaging <b>with your prescription<\/b>. OTC up to a 2-month supply, vitamins up to 4 months.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\" style=\"font-size:8.6px; color:var(--ink2);\">\n<b>The permit:<\/b> download the Yunyu Kakunin-sho form from the MHLW website, attach your prescription + a doctor&#39;s letter (English is fine) + passport copy, and submit to the regional bureau <b>at least two weeks before<\/b> you fly. &nbsp;\n<b>Quick fix for decongestants:<\/b> swap pseudoephedrine Sudafed for <b>Sudafed PE<\/b> (phenylephrine), which is allowed. &nbsp;\nWhen unsure, the official <b>MHLW list<\/b> is the only always-current source &mdash; check the active ingredient there.<\/div>\n\n<h2>Emergency &amp; pharmacy phrases<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">助けて！<\/span> <span class=\"exr\">tasukete!<\/span><\/td><td class=\"exe\">\"Help!\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">救急車を呼んでください。<\/span> <span class=\"exr\">kyūkyūsha o yonde kudasai<\/span><\/td><td class=\"exe\">\"Please call an ambulance.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">病院に行きたいです。<\/span> <span class=\"exr\">byōin ni ikitai desu<\/span><\/td><td class=\"exe\">\"I want to go to a hospital.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜が痛いです。<\/span> <span class=\"exr\">~ ga itai desu<\/span><\/td><td class=\"exe\">\"My ~ hurts.\" (+ body part below)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">熱があります。<\/span> <span class=\"exr\">netsu ga arimasu<\/span><\/td><td class=\"exe\">\"I have a fever.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜アレルギーがあります。<\/span> <span class=\"exr\">~ arerugī ga arimasu<\/span><\/td><td class=\"exe\">\"I&#39;m allergic to ~.\" (critical before meds/food)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">この薬はありますか。<\/span> <span class=\"exr\">kono kusuri wa arimasu ka<\/span><\/td><td class=\"exe\">\"Do you have this medicine?\" (show the box/name)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Symptom &amp; body words<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">痛い<\/span> <span class=\"r\">itai<\/span><span class=\"m\">painful<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">頭<\/span> <span class=\"r\">atama<\/span><span class=\"m\">head<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">お腹<\/span> <span class=\"r\">onaka<\/span><span class=\"m\">stomach<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">熱<\/span> <span class=\"r\">netsu<\/span><span class=\"m\">fever<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">吐き気<\/span> <span class=\"r\">hakike<\/span><span class=\"m\">nausea<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">めまい<\/span> <span class=\"r\">memai<\/span><span class=\"m\">dizziness<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">怪我<\/span> <span class=\"r\">kega<\/span><span class=\"m\">injury<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">薬<\/span> <span class=\"r\">kusuri<\/span><span class=\"m\">medicine<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">病院<\/span> <span class=\"r\">byōin<\/span><span class=\"m\">hospital<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">気分が悪い<\/span> <span class=\"r\">kibun ga warui<\/span><span class=\"m\">feel unwell<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">アレルギー<\/span> <span class=\"r\">arerugī<\/span><span class=\"m\">allergy<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">保険<\/span> <span class=\"r\">hoken<\/span><span class=\"m\">insurance<\/span><\/div>\n<\/div>\n<div class=\"note\" style=\"font-size:8.4px; color:var(--muted);\"><span class=\"cjk\">怪我<\/span> (kega, injury) is a false friend &mdash; in Chinese those characters read \"blame me.\" Here it just means you&#39;re hurt.<\/div>\n<\/body><\/html>"}]}</script><script>
var DATA = JSON.parse(document.getElementById("appdata").textContent);
var SHEETS = DATA.sheets;
var byId = {}; SHEETS.forEach(function(s){ byId[s.id]=s; });
var SECTIONS = [
  {id:"lang",  name:"Japanese Language", kj:"語", sub:"Learn & read — grammar, kana, numbers, phrases",
   groups:["Start here","Reading the script","Grammar","Numbers & time"]},
  {id:"ground",name:"On the Ground",     kj:"旅", sub:"The trip playbook — food, stays, transit, safety",
   groups:["Food & stays","Getting around","Culture & safety"]}
];
var view = document.getElementById("view");
var bar = document.getElementById("bar");
var barTitle = document.getElementById("bartitle");
var backBtn = document.getElementById("back");
backBtn.onclick = function(){ if(history.length>1) history.back(); else go("#/"); };

function go(h){ location.hash = h; }
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function chev(){ return '<span class="chev">\u203A</span>'; }

function sheetCard(s){
  return '<a class="card" href="#/sheet/'+s.id+'"><span class="kj">'+s.kanji+'</span>'
    +'<span class="tx"><b>'+esc(s.title)+'</b><span>'+esc(s.sub)+'</span></span>'+chev()+'</a>';
}

function renderHome(){
  bar.classList.remove("showback");
  barTitle.textContent = "Japan Kit";
  var h = '<div class="wrap"><div class="hero"><div class="stamp serif">\u65C5</div>'
    +'<h1>Japan Kit</h1><p>Japanese reference &amp; trip playbook \u00B7 updated '+DATA.updated+'</p></div>';
  h += '<div class="search"><input id="q" type="search" placeholder="Search sheets & terms\u2026" '
    +'autocomplete="off" autocorrect="off" autocapitalize="off"></div>';
  h += '<div id="results"></div>';
  h += '<div id="sections">';
  SECTIONS.forEach(function(sec){
    var n = SHEETS.filter(function(s){return s.section===sec.id;}).length;
    h += '<a class="card secfe" href="#/sec/'+sec.id+'"><span class="kj big serif">'+sec.kj+'</span>'
      +'<span class="tx"><b>'+sec.name+'</b><span>'+sec.sub+'</span>'
      +'<span class="count">'+n+' sheets</span></span>'+chev()+'</a>';
  });
  h += '</div>';
  h += '<div class="foot">\u65C5 Japan Kit \u00B7 tap the share icon \u2192 Add to Home Screen \u00B7 works offline</div>';
  h += '</div>';
  view.innerHTML = h;
  var q = document.getElementById("q");
  q.oninput = function(){ runSearch(q.value); };
}

function runSearch(term){
  var res = document.getElementById("results");
  var secs = document.getElementById("sections");
  term = (term||"").trim().toLowerCase();
  if(!term){ res.innerHTML=""; secs.style.display=""; return; }
  secs.style.display="none";
  var hits = SHEETS.filter(function(s){
    return (s.title+" "+s.sub+" "+s.group).toLowerCase().indexOf(term)>=0
        || s.doc.toLowerCase().indexOf(term)>=0;
  });
  if(!hits.length){ res.innerHTML='<div class="empty">No matches for \u201C'+esc(term)+'\u201D</div>'; return; }
  res.innerHTML = hits.map(sheetCard).join("");
}

function renderSection(id){
  var sec = SECTIONS.filter(function(s){return s.id===id;})[0];
  if(!sec){ go("#/"); return; }
  bar.classList.add("showback");
  barTitle.textContent = sec.name;
  var h = '<div class="wrap">';
  sec.groups.forEach(function(g){
    var items = SHEETS.filter(function(s){return s.section===id && s.group===g;});
    if(!items.length) return;
    h += '<div class="grouphd">'+esc(g)+'</div>';
    h += items.map(sheetCard).join("");
  });
  h += '</div>';
  view.innerHTML = h;
  window.scrollTo(0,0);
}

function renderSheet(id){
  var s = byId[id];
  if(!s){ go("#/"); return; }
  bar.classList.add("showback");
  barTitle.textContent = s.title;
  view.innerHTML = '<iframe id="sf" class="sheetframe" title="'+esc(s.title)+'"></iframe>';
  var f = document.getElementById("sf");
  f.onload = function(){
    try{
      var d = f.contentWindow.document;
      var resize = function(){ f.style.height = (d.body.scrollHeight+24)+"px"; };
      resize(); setTimeout(resize,120); setTimeout(resize,400);
      if(f.contentWindow.matchMedia){
        var mq = f.contentWindow.matchMedia("(orientation:portrait)");
        (mq.addEventListener?mq.addEventListener.bind(mq,"change"):mq.addListener.bind(mq))(resize);
      }
    }catch(e){}
  };
  f.srcdoc = s.doc;
  window.scrollTo(0,0);
}

function route(){
  var h = location.hash || "#/";
  var m;
  if((m = h.match(/^#\/sheet\/(.+)$/))) return renderSheet(m[1]);
  if((m = h.match(/^#\/sec\/(.+)$/)))  return renderSection(m[1]);
  return renderHome();
}
window.addEventListener("hashchange", route);
route();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script></body></html>
