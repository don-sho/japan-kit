.m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">助<\/div><div><h1>Particles<\/h1><div class=\"st\">The tags that mark each noun's job<\/div><\/div><\/div>\n\n\n\n<h2>The one idea<\/h2>\n<div class=\"concept\">\n  <div class=\"big\">\n    A <b>particle<\/b> is a little tag that comes <b>after<\/b> a noun and announces that noun's <b>job<\/b> in the\n    sentence &mdash; who's doing it, what it's done to, where, when. Because the job is labeled, <b>word order goes loose<\/b>\n    &mdash; only the verb is fixed, always <b>last<\/b>. The particles do the work your word order used to do.\n  <\/div>\n<\/div>\n\n<div class=\"split\">\n  <div class=\"col zhcol\">\n    <div class=\"lbl\">Chinese &mdash; position does the work (like English)<\/div>\n    <div class=\"ex cjk\">我 &nbsp;吃 &nbsp;鱼<span class=\"zh\"><\/span><\/div>\n    <div class=\"gl\">S&ndash;V&ndash;O. \"I eat fish.\" Move the words, change the meaning.<\/div>\n  <\/div>\n  <div class=\"col jpcol\">\n    <div class=\"lbl\">Japanese &mdash; tags do the work<\/div>\n    <div class=\"ex cjk\">私<span class=\"jp\">は<\/span> 魚<span class=\"jp\">を<\/span> 食べます<\/div>\n    <div class=\"gl\"><span class=\"romaji\">watashi wa sakana o tabemasu<\/span> &middot; S&ndash;O&ndash;V, verb last.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"flip\">\n  <b>What this buys you &mdash; free word order.<\/b> The role is glued to the noun, not its spot:<br>\n  <span class=\"ex cjk\">猫<span class=\"jp\">が<\/span>魚<span class=\"jp\">を<\/span>食べました<\/span>\n  <span class=\"arrow\">=<\/span>\n  <span class=\"ex cjk\">魚<span class=\"jp\">を<\/span>猫<span class=\"jp\">が<\/span>食べました<\/span>\n  <div class=\"romaji\" style=\"font-size:8.7px; margin:3px 0;\">neko ga sakana o tabemashita &nbsp;=&nbsp; sakana o neko ga tabemashita<\/div>\n  &mdash; both still mean <i>the cat ate the fish<\/i>. が marks the doer, を the done-to, wherever they sit.\n<\/div>\n\n<p style=\"font-size:9px; margin:5px 2px 0; color:var(--ink2)\">\n  <b>What's genuinely new for you:<\/b> Chinese marks subject and object by <i>position<\/i>, exactly like English &mdash; it has\n  no case tags. So は / が / を are the real new machinery. <b>What's already familiar:<\/b> a handful of particles line up\n  almost one-to-one with characters you know (の&hairsp;=&hairsp;的, か&hairsp;=&hairsp;吗&hellip;) &mdash; see page 2.\n<\/p>\n\n<h2>The workhorse particles<\/h2>\n<table>\n  <thead>\n    <tr>\n      <th style=\"width:8%\">Particle<\/th>\n      <th style=\"width:9%\">Reads<\/th>\n      <th style=\"width:22%\">Its job<\/th>\n      <th style=\"width:41%\">Example<\/th>\n      <th style=\"width:20%\">Chinese hook<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td class=\"pt cjk\">は<\/td><td class=\"rd\">wa*<\/td>\n      <td class=\"fn\">Topic &mdash; \"as for &hellip;\"<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">は<\/span>学生です<\/span> &middot; <span class=\"exr\">watashi wa gakusei desu<\/span><br><span class=\"exe\">\"As for me, I'm a student.\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(no equivalent)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">が<\/td><td class=\"rd\">ga<\/td>\n      <td class=\"fn\">Subject &mdash; the doer, often new info<\/td>\n      <td><span class=\"cjk exj\">誰<span class=\"jp\">が<\/span>来ましたか？<\/span> &middot; <span class=\"exr\">dare ga kimashita ka?<\/span><br><span class=\"exe\">\"Who came?\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(no equivalent)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">を<\/td><td class=\"rd\">o*<\/td>\n      <td class=\"fn\">Direct object<\/td>\n      <td><span class=\"cjk exj\">水<span class=\"jp\">を<\/span>飲みます<\/span> &middot; <span class=\"exr\">mizu o nomimasu<\/span><br><span class=\"exe\">\"drink water.\"<\/span><\/td>\n      <td class=\"hook\">&mdash; <span class=\"dim\">(word order in&nbsp;中文)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">に<\/td><td class=\"rd\">ni<\/td>\n      <td class=\"fn\">To / at &mdash; destination, clock time, where something <i>exists<\/i><\/td>\n      <td><span class=\"cjk exj\">東京<span class=\"jp\">に<\/span>行きます<\/span> &middot; <span class=\"exr\">Tōkyō ni ikimasu<\/span><br><span class=\"exe\">\"go to Tokyo.\" &nbsp; 家<span class=\"jp\">に<\/span>います <span class=\"romaji\">(ie ni imasu)<\/span> \"is at home.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 到 / 在 <span class=\"dim\">(到东京)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">で<\/td><td class=\"rd\">de<\/td>\n      <td class=\"fn\">Where an <i>action<\/i> happens; by means of<\/td>\n      <td><span class=\"cjk exj\">家<span class=\"jp\">で<\/span>食べます<\/span> &middot; <span class=\"exr\">ie de tabemasu<\/span><br><span class=\"exe\">\"eat at home.\" &nbsp; 電車<span class=\"jp\">で<\/span> <span class=\"romaji\">(densha de)<\/span> \"by train.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 在 / 用<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">へ<\/td><td class=\"rd\">e*<\/td>\n      <td class=\"fn\">Toward &mdash; direction<\/td>\n      <td><span class=\"cjk exj\">東京<span class=\"jp\">へ<\/span>行きます<\/span> &middot; <span class=\"exr\">Tōkyō e ikimasu<\/span><br><span class=\"exe\">\"head toward Tokyo.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 往 / 向<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">の<\/td><td class=\"rd\">no<\/td>\n      <td class=\"fn\">Of / 's &mdash; links noun to noun<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">の<\/span>本<\/span> &middot; <span class=\"exr\">watashi no hon<\/span><br><span class=\"exe\">\"my book.\"<\/span><\/td>\n      <td class=\"hook cjk\">= 的 <span class=\"dim\">(我的书)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">と<\/td><td class=\"rd\">to<\/td>\n      <td class=\"fn\">And (full list) / with<\/td>\n      <td><span class=\"cjk exj\">猫<span class=\"jp\">と<\/span>犬<\/span> &middot; <span class=\"exr\">neko to inu<\/span><br><span class=\"exe\">\"cats and dogs.\" &nbsp; 友達<span class=\"jp\">と<\/span> <span class=\"romaji\">(tomodachi to)<\/span> \"with a friend.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 和 / 跟<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">も<\/td><td class=\"rd\">mo<\/td>\n      <td class=\"fn\">Also / too<\/td>\n      <td><span class=\"cjk exj\">私<span class=\"jp\">も<\/span>行きます<\/span> &middot; <span class=\"exr\">watashi mo ikimasu<\/span><br><span class=\"exe\">\"I'll go too.\"<\/span><\/td>\n      <td class=\"hook cjk\">= 也<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">から<\/td><td class=\"rd\">kara<\/td>\n      <td class=\"fn\">From / since / because<\/td>\n      <td><span class=\"cjk exj\">9時<span class=\"jp\">から<\/span><\/span> &middot; <span class=\"exr\">ku-ji kara<\/span><br><span class=\"exe\">\"from 9 o'clock.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 从 / 因为<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">まで<\/td><td class=\"rd\">made<\/td>\n      <td class=\"fn\">Until / as far as<\/td>\n      <td><span class=\"cjk exj\">駅<span class=\"jp\">まで<\/span><\/span> &middot; <span class=\"exr\">eki made<\/span><br><span class=\"exe\">\"as far as the station.\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 到 / 为止<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">か<\/td><td class=\"rd\">ka<\/td>\n      <td class=\"fn\">Turns a statement into a yes/no question<\/td>\n      <td><span class=\"cjk exj\">学生です<span class=\"jp\">か<\/span><\/span> &middot; <span class=\"exr\">gakusei desu ka<\/span><br><span class=\"exe\">\"Are you a student?\"<\/span><\/td>\n      <td class=\"hook cjk\">= 吗<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<p style=\"font-size:8px;color:var(--muted);margin-top:4px\">* spelled with one kana but pronounced differently as a particle &mdash; see the pronunciation traps on the next page. &nbsp;&bull;&nbsp; Verbs are shown in the polite <b>&ndash;masu / desu<\/b> register Pimsleur drills; the plain forms (&#39;taberu&#39;, &#39;iku&#39;) come later &mdash; the particles work identically in both.<\/p>\n\n<!-- ===================== PAGE 2 ===================== -->\n<div class=\"page-break\"><\/div>\n\n<h2>Your unfair advantage &mdash; particles you already know<\/h2>\n<div class=\"zhbox\">\n  <div class=\"row\">\n    <div class=\"p cjk\">の<\/div>\n    <div class=\"eq cjk\">= 的<\/div>\n    <div class=\"note\"><span class=\"cjk\">私の本<\/span> <span class=\"romaji\">(watashi no hon)<\/span> <span class=\"cjk\">= 我的书<\/span> &mdash; \"my book.\" Same job: hooks a modifier onto a noun. This one is a true equal, lean on it hard.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">か<\/div>\n    <div class=\"eq cjk\">= 吗<\/div>\n    <div class=\"note\"><span class=\"cjk\">学生ですか<\/span> <span class=\"romaji\">(gakusei desu ka)<\/span> <span class=\"cjk\">= 是学生吗？<\/span> Tack it on the end, statement becomes a yes/no question.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">も<\/div>\n    <div class=\"eq cjk\">= 也<\/div>\n    <div class=\"note\"><span class=\"cjk\">私も<\/span> <span class=\"romaji\">(watashi mo)<\/span> <span class=\"cjk\">= 我也<\/span> &mdash; \"me too.\" Watch placement: も sits <i>after<\/i> the noun, 也 sits <i>before<\/i> the verb.<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">と<\/div>\n    <div class=\"eq cjk\">≈ 和 / 跟<\/div>\n    <div class=\"note\"><span class=\"cjk\">猫と犬<\/span> <span class=\"romaji\">(neko to inu)<\/span> <span class=\"cjk\">= 猫和狗<\/span> (listing); <span class=\"cjk\">友達と<\/span> <span class=\"romaji\">(tomodachi to)<\/span> <span class=\"cjk\">= 跟朋友<\/span> (with someone).<\/div>\n  <\/div>\n  <div class=\"row\">\n    <div class=\"p cjk\">から<\/div>\n    <div class=\"eq cjk\">≈ 从 / 因为<\/div>\n    <div class=\"note\"><span class=\"cjk\">3時から<\/span> <span class=\"romaji\">(san-ji kara)<\/span> <span class=\"cjk\">= 从三点<\/span> (from a point); also \"because,\" like <span class=\"cjk\">因为<\/span> at a clause's head.<\/div>\n  <\/div>\n  <div class=\"cap\">Hooks, not exact equals &mdash; each Japanese particle stretches further than its Chinese cousin, but these get you standing up fast.<\/div>\n<\/div>\n\n<h2>The two pairs everyone mixes up<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3><span class=\"tag cjk\">は<\/span> wa &nbsp;vs&nbsp; <span class=\"tag cjk\">が<\/span> ga<\/h3>\n    <p>Both sit near the \"subject,\" so this is the classic trap. Rough rule that carries you far:<\/p>\n    <p><b>New information takes が. The already-known topic takes は.<\/b><\/p>\n    <div class=\"eg\"><span class=\"cjk\">誰<span class=\"jp\">が<\/span>来ましたか？&mdash; 田中さん<span class=\"jp\">が<\/span>来ました。<\/span><br><span class=\"romaji\">dare ga kimashita ka? &mdash; Tanaka-san ga kimashita.<\/span><br>\"Who came?\" &mdash; Tanaka's the new fact &rarr; が.<\/div>\n    <div class=\"eg\"><span class=\"cjk\">田中さん<span class=\"jp\">は<\/span>学生です。<\/span><br><span class=\"romaji\">Tanaka-san wa gakusei desu.<\/span><br>Tanaka's now known &rarr; は: \"as for Tanaka, he's a student.\"<\/div>\n    <p>は also <b>contrasts<\/b>: \"<i>this<\/i> one, unlike others.\" Real command comes from hearing thousands of correct examples &mdash; the ear, not the rule.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3><span class=\"tag cjk\">に<\/span> ni &nbsp;vs&nbsp; <span class=\"tag cjk\">で<\/span> de<\/h3>\n    <p>Both can translate as \"at,\" which is the whole confusion. The split is clean:<\/p>\n    <p><b>に = where something <i>is<\/i>. で = where something <i>happens<\/i>.<\/b><\/p>\n    <div class=\"eg\"><span class=\"cjk\">家<span class=\"jp\">に<\/span>います<\/span> <span class=\"romaji\">(ie ni imasu)<\/span> &mdash; \"is <i>at<\/i> home.\" (existence)<\/div>\n    <div class=\"eg\"><span class=\"cjk\">家<span class=\"jp\">で<\/span>食べます<\/span> <span class=\"romaji\">(ie de tabemasu)<\/span> &mdash; \"eats <i>at<\/i> home.\" (action)<\/div>\n    <p>Same trick for time &amp; means: に pins a clock time (<span class=\"cjk\">3時に<\/span>, <span class=\"romaji\">san-ji ni<\/span>), で gives the method (<span class=\"cjk\">電車で<\/span>, <span class=\"romaji\">densha de<\/span>, \"by train\"). Burn this pair in early.<\/p>\n  <\/div>\n<\/div>\n\n<h2>Pronunciation traps<\/h2>\n<p style=\"font-size:9px;margin:0 2px 6px;color:var(--ink2)\">Three particles are written with one kana but read as another &mdash; a historical spelling both of you will trip on once, then never again.<\/p>\n<div class=\"traps\">\n  <div class=\"trap\">\n    <div class=\"k cjk\">は<\/div>\n    <div class=\"say\">normally <i>ha<\/i> &rarr; as particle, say <b>wa<\/b><\/div>\n    <div class=\"why cjk\">私は &rarr; watashi wa<\/div>\n  <\/div>\n  <div class=\"trap\">\n    <div class=\"k cjk\">を<\/div>\n    <div class=\"say\">normally <i>wo<\/i> &rarr; as particle, say <b>o<\/b><\/div>\n    <div class=\"why cjk\">水を &rarr; mizu o<\/div>\n  <\/div>\n  <div class=\"trap\">\n    <div class=\"k cjk\">へ<\/div>\n    <div class=\"say\">normally <i>he<\/i> &rarr; as particle, say <b>e<\/b><\/div>\n    <div class=\"why cjk\">東京へ &rarr; Tōkyō e<\/div>\n  <\/div>\n<\/div>\n\n\n\n<\/body><\/html>"}, {"id": "teform", "title": "The て-form", "kanji": "て", "sub": "Japanese's master connector", "text": "why the て-form is the master key the て-form carries no tense of its own it&#39;s the universal hook that a dozen constructions clip onto: requests, \"am doing,\" permission, and linking actions into one sentence. learn the transformation once and all of them open at once. the catch is the sound-change (just like the counter mutations) so this is the sheet worth drilling. how to form it group 2 ru-verbs easy drop る , add て . no mutation. 食べる 食べて taberu tabete \"eat\" 見る 見て miru mite \"see\" irregulars just memorize する して (suru shite) \"do\" 来る 来て (kuru kite) \"come\" 行く 行って (iku itte) \"go\" breaks the く rule below group 1 u-verbs the sound-change, by final kana ending becomes example う・つ・る って 買う 買って (kau katte) 待つ 待って (matsu matte) 帰る 帰って (kaeru kaette) む・ぶ・ぬ んで 飲む 飲んで (nomu nonde) 遊ぶ 遊んで (asobu asonde) 死ぬ 死んで (shinu shinde) く いて 書く 書いて (kaku kaite) \"write\" (exception: 行く 行って itte) ぐ いで 泳ぐ 泳いで (oyogu oyoide) \"swim\" す して 話す 話して (hanasu hanashite) \"speak\" mnemonic: u-tsu-ru tte , mu-bu-nu nde , ku ite , gu ide , su shite . the nasals (mu/bu/nu) all voice to -nde , exactly the euphony logic behind the counter mutations. what it unlocks (all in your polite register) pattern meaning example 〜てください please do ちょっと待ってください chotto matte kudasai \"please wait a moment\" 〜ています am doing / ongoing state 今食べています ima tabete imasu \"i&#39;m eating now\" 〜てもいいです may i / it&#39;s ok to 入ってもいいですか haitte mo ii desu ka \"may i come in?\" 〜てから after doing 食べてから行きます tabete kara ikimasu \"i&#39;ll go after eating\" 〜て、〜て link actions (\"and then\") 起きて、食べて、行きます okite, tabete, ikimasu \"i get up, eat, and go\" chinese hook the ongoing 〜ている plays the role of mandarin&#39;s 在 / 着 aspect, and the action-linking 〜て is japanese&#39;s answer to the serial-verb chaining you already do in chinese the difference is japanese morphs the verb to do it, where chinese just lines bare verbs up.", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; tte compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">て<\/div><div><h1>The て-form<\/h1><div class=\"st\">Japanese's master connector<\/div><\/div><\/div>\n<h2>Why the て-form is the master key<\/h2>\n<div class=\"concept\"><div class=\"big\">\nThe <b>て-form<\/b> carries no tense of its own &mdash; it&#39;s the universal hook that a dozen\nconstructions clip onto: requests, \"am doing,\" permission, and linking actions into one sentence.\nLearn the transformation once and all of them open at once. The catch is the sound-change (just like\nthe counter mutations) &mdash; so this is the sheet worth drilling.\n<\/div><\/div>\n\n<h2>How to form it<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3><span class=\"tag\">Group 2<\/span> ru-verbs &mdash; easy<\/h3>\n    <p>Drop <span class=\"cjk jp\">る<\/span>, add <span class=\"cjk jp\">て<\/span>. No mutation.<\/p>\n    <div class=\"eg\"><span class=\"cjk\">食べる &rarr; 食べて<\/span><br><span class=\"romaji\">taberu &rarr; tabete<\/span> &middot; \"eat\"<\/div>\n    <div class=\"eg\"><span class=\"cjk\">見る &rarr; 見て<\/span><br><span class=\"romaji\">miru &rarr; mite<\/span> &middot; \"see\"<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3><span class=\"tag\">Irregulars<\/span> &mdash; just memorize<\/h3>\n    <div class=\"eg\"><span class=\"cjk\">する &rarr; して<\/span> <span class=\"romaji\">(suru &rarr; shite)<\/span> \"do\"<\/div>\n    <div class=\"eg\"><span class=\"cjk\">来る &rarr; 来て<\/span> <span class=\"romaji\">(kuru &rarr; kite)<\/span> \"come\"<\/div>\n    <div class=\"eg\"><span class=\"cjk\">行く &rarr; 行って<\/span> <span class=\"romaji\">(iku &rarr; itte)<\/span> \"go\" &mdash; breaks the く rule below<\/div>\n  <\/div>\n<\/div>\n\n<h2>Group 1 u-verbs &mdash; the sound-change, by final kana<\/h2>\n<table>\n  <thead><tr><th style=\"width:16%\">Ending<\/th><th style=\"width:16%\">Becomes<\/th><th style=\"width:68%\">Example<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"pt cjk\">う・つ・る<\/td><td class=\"pt\">&rarr; <span class=\"cjk\">って<\/span><\/td>\n      <td><span class=\"cjk exj\">買う&rarr;買って<\/span> <span class=\"exr\">(kau&rarr;katte)<\/span> &middot; <span class=\"cjk exj\">待つ&rarr;待って<\/span> <span class=\"exr\">(matsu&rarr;matte)<\/span> &middot; <span class=\"cjk exj\">帰る&rarr;帰って<\/span> <span class=\"exr\">(kaeru&rarr;kaette)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">む・ぶ・ぬ<\/td><td class=\"pt\">&rarr; <span class=\"cjk\">んで<\/span><\/td>\n      <td><span class=\"cjk exj\">飲む&rarr;飲んで<\/span> <span class=\"exr\">(nomu&rarr;nonde)<\/span> &middot; <span class=\"cjk exj\">遊ぶ&rarr;遊んで<\/span> <span class=\"exr\">(asobu&rarr;asonde)<\/span> &middot; <span class=\"cjk exj\">死ぬ&rarr;死んで<\/span> <span class=\"exr\">(shinu&rarr;shinde)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">く<\/td><td class=\"pt\">&rarr; <span class=\"cjk\">いて<\/span><\/td>\n      <td><span class=\"cjk exj\">書く&rarr;書いて<\/span> <span class=\"exr\">(kaku&rarr;kaite)<\/span> \"write\" &nbsp;<span class=\"exe\">(exception: 行く&rarr;行って itte)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">ぐ<\/td><td class=\"pt\">&rarr; <span class=\"cjk\">いで<\/span><\/td>\n      <td><span class=\"cjk exj\">泳ぐ&rarr;泳いで<\/span> <span class=\"exr\">(oyogu&rarr;oyoide)<\/span> \"swim\"<\/td><\/tr>\n    <tr><td class=\"pt cjk\">す<\/td><td class=\"pt\">&rarr; <span class=\"cjk\">して<\/span><\/td>\n      <td><span class=\"cjk exj\">話す&rarr;話して<\/span> <span class=\"exr\">(hanasu&rarr;hanashite)<\/span> \"speak\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\">Mnemonic: <b>u-tsu-ru<\/b> &rarr; <i>tte<\/i>, <b>mu-bu-nu<\/b> &rarr; <i>nde<\/i>, <b>ku<\/b> &rarr; <i>ite<\/i>, <b>gu<\/b> &rarr; <i>ide<\/i>, <b>su<\/b> &rarr; <i>shite<\/i>. The nasals (mu/bu/nu) all voice to <i>-nde<\/i>, exactly the euphony logic behind the counter mutations.<\/div>\n\n<h2>What it unlocks (all in your polite register)<\/h2>\n<table>\n  <thead><tr><th style=\"width:24%\">Pattern<\/th><th style=\"width:24%\">Meaning<\/th><th style=\"width:52%\">Example<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"cjk fn\">〜てください<\/td><td>Please do &hellip;<\/td><td><span class=\"cjk exj\">ちょっと待ってください<\/span> &middot; <span class=\"exr\">chotto matte kudasai<\/span> <span class=\"exe\">\"please wait a moment\"<\/span><\/td><\/tr>\n    <tr><td class=\"cjk fn\">〜ています<\/td><td>Am doing / ongoing state<\/td><td><span class=\"cjk exj\">今食べています<\/span> &middot; <span class=\"exr\">ima tabete imasu<\/span> <span class=\"exe\">\"I&#39;m eating now\"<\/span><\/td><\/tr>\n    <tr><td class=\"cjk fn\">〜てもいいです<\/td><td>May I / it&#39;s OK to<\/td><td><span class=\"cjk exj\">入ってもいいですか<\/span> &middot; <span class=\"exr\">haitte mo ii desu ka<\/span> <span class=\"exe\">\"may I come in?\"<\/span><\/td><\/tr>\n    <tr><td class=\"cjk fn\">〜てから<\/td><td>After doing &hellip;<\/td><td><span class=\"cjk exj\">食べてから行きます<\/span> &middot; <span class=\"exr\">tabete kara ikimasu<\/span> <span class=\"exe\">\"I&#39;ll go after eating\"<\/span><\/td><\/tr>\n    <tr><td class=\"cjk fn\">〜て、〜て &hellip;<\/td><td>Link actions (\"and then\")<\/td><td><span class=\"cjk exj\">起きて、食べて、行きます<\/span> &middot; <span class=\"exr\">okite, tabete, ikimasu<\/span> <span class=\"exe\">\"I get up, eat, and go\"<\/span><\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">Chinese hook<\/div>\nThe ongoing <span class=\"cjk jp\">〜ている<\/span> plays the role of Mandarin&#39;s <span class=\"cjk\">在 / 着<\/span> aspect, and the\naction-linking <span class=\"cjk jp\">〜て<\/span> is Japanese&#39;s answer to the serial-verb chaining you already do in Chinese\n&mdash; the difference is Japanese <i>morphs the verb<\/i> to do it, where Chinese just lines bare verbs up.\n<\/div>\n<\/body><\/html>"}, {"id": "verbs", "title": "Verb Forms", "kanji": "動", "sub": "Polite & plain conjugation chain", "text": "the conjugation chain the machinery chinese spared you chinese verbs never change shape 吃 is 吃 for everyone, every tense. japanese is the opposite: one stem, a train of endings for tense, negation, politeness, wanting, and ability. here is the same verb walked across every form you&#39;ll use, in both the polite register (your pimsleur default) and the plain form (what you hear in midnight diner). group 2 (ru-verb): 食べる — taberu, \"to eat\" form polite plain use non-past 食べます tabemasu 食べる taberu eat / will eat negative 食べません tabemasen 食べない tabenai don&#39;t eat past 食べました tabemashita 食べた tabeta ate past negative 食べませんでした tabemasen deshita 食べなかった tabenakatta didn&#39;t eat て-form 食べて tabete (shared see the て-form sheet) connector volitional 食べましょう tabemashō 食べよう tabeyō let&#39;s eat want to 食べたいです tabetai desu i want to eat potential (can) 食べられます taberaremasu 食べられる taberareru can eat group 1 (u-verb): 飲む — nomu, \"to drink\" form polite plain use non-past 飲みます nomimasu 飲む nomu drink negative 飲みません nomimasen 飲まない nomanai don&#39;t drink past 飲みました nomimashita 飲んだ nonda drank past negative 飲みませんでした nomimasen deshita 飲まなかった nomanakatta didn&#39;t drink て-form 飲んで nonde connector volitional 飲みましょう nomimashō 飲もう nomō let&#39;s drink want to 飲みたいです nomitai desu i want to drink potential (can) 飲めます nomemasu 飲める nomeru can drink the pattern to see: ru-verbs just drop る and add the ending; u-verbs shift the final kana onto the i -row before ます ( 飲 み ます ) and the a -row before ない ( 飲 ま ない ). two irregulars run the whole language: する します (suru shimasu) and 来る 来ます (kuru kimasu) .", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq .zh { font-size: 15px; }\n  .zhbox .note { flex: 1; font-size: 8.8px; color: var(--ink2); }\n  .zhbox .cap { font-size: 8.3px; color: var(--muted); margin-top: 6px; font-style: italic; }\n\n  .traps { display: flex; gap: 9px; }\n  .trap {\n    flex: 1; text-align: center; background: var(--card);\n    border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px;\n  }\n  .trap .k { font-size: 20px; font-weight: 700; color: var(--jp); }\n  .trap .say { font-size: 9px; margin-top: 2px; }\n  .trap .say b { color: var(--red); }\n  .trap .why { font-size: 7.8px; color: var(--muted); margin-top: 2px; }\n\n  footer {\n    margin-top: 12px; padding-top: 7px; border-top: 1px solid var(--line);\n    font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between;\n  }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d; --ink2: #2c3e5c; --red: #c1362f; --indigo: #3d5a80;\n    --paper: #faf8f3; --card: #ffffff; --line: #e4ddce; --muted: #6b7280;\n    --jp: #b5341f; --zh: #1f6f4a;\n  }\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  header {\n    border-bottom: 3px solid var(--ink); padding-bottom: 9px; margin-bottom: 12px;\n    display: flex; align-items: flex-end; justify-content: space-between;\n  }\n  header .title h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink); }\n  header .title .sub { font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px; }\n  header .mark { text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4; }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px; }\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800; margin: 13px 0 6px;\n    padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  .concept { background: var(--ink); color: #eef1f6; border-radius: 7px; padding: 10px 13px; margin-bottom: 6px; }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10px; line-height: 1.5; }\n\n  /* number grids */\n  .numwrap { display: flex; gap: 9px; }\n  .numcard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }\n  .numcard.sino { border-top: 3px solid var(--zh); }\n  .numcard.native { border-top: 3px solid var(--jp); }\n  .numcard .cap { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }\n  .numcard .cap b { color: var(--ink); }\n  .ngrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px 6px; }\n  .ncell { text-align: center; padding: 3px 2px; background: #f4f1e9; border-radius: 4px; }\n  .ncell .g { font-size: 14px; font-weight: 700; color: var(--jp); }\n  .ncell .r { font-size: 8px; font-style: italic; color: var(--ink2); display: block; }\n  .ncell .alt { color: var(--red); }\n\n  .bigrow { display: flex; gap: 6px; margin-top: 6px; }\n  .bigrow .ncell { flex: 1; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 9px 12px; margin: 6px 0;\n  }\n  .zhbox .hd { font-weight: 800; color: var(--ink); font-size: 9.5px; margin-bottom: 3px; }\n  .zhbox .eg { font-size: 9.2px; margin-top: 3px; }\n  .zhbox .eg .cjk { font-size: 11.5px; }\n\n  .flip { background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px; padding: 8px 11px; margin: 6px 0; font-size: 9.3px; }\n\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th { background: var(--ink2); color: #fff; text-align: left; padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.3px; }\n  td .exe { font-size: 8.5px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  .mutrow { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 4px; }\n  .mut { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 4px 1px; }\n  .mut .n { font-size: 8px; color: var(--muted); }\n  .mut .v { font-size: 9px; font-weight: 700; color: var(--jp); font-style: normal; }\n  .mut.hot { background: #fdece8; border-color: #f0b3a8; }\n\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; }\n  .card { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; }\n  .card h3 { font-size: 10.5px; color: var(--ink); margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11px; }\n  .card .eg .romaji { font-size: 8.3px; }\n\n  .order { background: var(--ink); color: #eef1f6; border-radius: 7px; padding: 10px 13px; }\n  .order .formula { font-size: 11px; margin-bottom: 6px; }\n  .order .formula .slot { background: #35507a; padding: 1px 6px; border-radius: 4px; color: #fff; }\n  .order .line { padding: 3px 0; border-bottom: 1px solid #2c3e5c; font-size: 9.4px; }\n  .order .line:last-child { border-bottom: none; }\n  .order .line .cjk { font-size: 12px; color: #fff; }\n  .order .line .romaji { color: #9fb4d4; }\n  .order .line .en { color: #cfd8e6; }\n\n  footer { margin-top: 11px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between; }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  :root {\n    --ink:#14213d; --ink2:#2c3e5c; --red:#c1362f; --indigo:#3d5a80;\n    --paper:#faf8f3; --card:#ffffff; --line:#e4ddce; --muted:#6b7280;\n    --jp:#b5341f; --zh:#1f6f4a;\n  }\n  html { font-family:'Helvetica Neue','DejaVu Sans','Noto Sans CJK JP',sans-serif; color:var(--ink); }\n  body { background:var(--paper); font-size:9.4px; line-height:1.45; }\n  .cjk { font-family:'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif; }\n  .jp { color:var(--jp); font-weight:600; }\n  .zh { color:var(--zh); font-weight:600; }\n  .romaji { font-style:italic; color:var(--muted); }\n  header { border-bottom:3px solid var(--ink); padding-bottom:9px; margin-bottom:12px;\n           display:flex; align-items:flex-end; justify-content:space-between; }\n  header .title h1 { font-size:20px; font-weight:800; letter-spacing:-0.4px; color:var(--ink); }\n  header .title .sub { font-size:9.6px; color:var(--red); font-weight:600; margin-top:2px; }\n  header .mark { text-align:right; font-size:8.5px; color:var(--muted); line-height:1.4; }\n  header .mark .kanji { font-size:25px; color:var(--red); font-weight:700; display:block; margin-bottom:2px; }\n  h2 { font-size:11.5px; color:var(--ink); font-weight:800; margin:12px 0 6px;\n       padding-left:8px; border-left:4px solid var(--red); text-transform:uppercase; letter-spacing:0.5px; }\n  h2:first-of-type { margin-top:0; }\n  .concept { background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">動<\/div><div><h1>Verb Forms<\/h1><div class=\"st\">Polite & plain conjugation chain<\/div><\/div><\/div>\n<h2>The conjugation chain &mdash; the machinery Chinese spared you<\/h2>\n<div class=\"concept\"><div class=\"big\">\nChinese verbs never change shape &mdash; <span class=\"cjk\">吃<\/span> is <span class=\"cjk\">吃<\/span> for everyone, every tense.\nJapanese is the opposite: one stem, a train of endings for tense, negation, politeness, wanting, and ability.\nHere is the same verb walked across every form you&#39;ll use, in both the <b>polite<\/b> register (your Pimsleur default)\nand the <b>plain<\/b> form (what you hear in Midnight Diner).\n<\/div><\/div>\n\n<h2>Group 2 (ru-verb): 食べる — <span class=\"romaji\">taberu, \"to eat\"<\/span><\/h2>\n<table>\n  <thead><tr><th style=\"width:26%\">Form<\/th><th style=\"width:27%\">Polite<\/th><th style=\"width:24%\">Plain<\/th><th style=\"width:23%\">Use<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Non-past<\/td><td><span class=\"cjk exj\">食べます<\/span> <span class=\"exr\">tabemasu<\/span><\/td><td><span class=\"cjk exj\">食べる<\/span> <span class=\"exr\">taberu<\/span><\/td><td class=\"exe\">eat / will eat<\/td><\/tr>\n    <tr><td class=\"fn\">Negative<\/td><td><span class=\"cjk exj\">食べません<\/span> <span class=\"exr\">tabemasen<\/span><\/td><td><span class=\"cjk exj\">食べない<\/span> <span class=\"exr\">tabenai<\/span><\/td><td class=\"exe\">don&#39;t eat<\/td><\/tr>\n    <tr><td class=\"fn\">Past<\/td><td><span class=\"cjk exj\">食べました<\/span> <span class=\"exr\">tabemashita<\/span><\/td><td><span class=\"cjk exj\">食べた<\/span> <span class=\"exr\">tabeta<\/span><\/td><td class=\"exe\">ate<\/td><\/tr>\n    <tr><td class=\"fn\">Past negative<\/td><td><span class=\"cjk exj\">食べませんでした<\/span> <span class=\"exr\">tabemasen deshita<\/span><\/td><td><span class=\"cjk exj\">食べなかった<\/span> <span class=\"exr\">tabenakatta<\/span><\/td><td class=\"exe\">didn&#39;t eat<\/td><\/tr>\n    <tr><td class=\"fn\">て-form<\/td><td colspan=\"2\"><span class=\"cjk exj\">食べて<\/span> <span class=\"exr\">tabete<\/span> &nbsp;<span class=\"exe\">(shared &mdash; see the て-form sheet)<\/span><\/td><td class=\"exe\">connector<\/td><\/tr>\n    <tr><td class=\"fn\">Volitional<\/td><td><span class=\"cjk exj\">食べましょう<\/span> <span class=\"exr\">tabemashō<\/span><\/td><td><span class=\"cjk exj\">食べよう<\/span> <span class=\"exr\">tabeyō<\/span><\/td><td class=\"exe\">let&#39;s eat<\/td><\/tr>\n    <tr><td class=\"fn\">Want to<\/td><td colspan=\"2\"><span class=\"cjk exj\">食べたいです<\/span> <span class=\"exr\">tabetai desu<\/span><\/td><td class=\"exe\">I want to eat<\/td><\/tr>\n    <tr><td class=\"fn\">Potential (can)<\/td><td><span class=\"cjk exj\">食べられます<\/span> <span class=\"exr\">taberaremasu<\/span><\/td><td><span class=\"cjk exj\">食べられる<\/span> <span class=\"exr\">taberareru<\/span><\/td><td class=\"exe\">can eat<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Group 1 (u-verb): 飲む — <span class=\"romaji\">nomu, \"to drink\"<\/span><\/h2>\n<table>\n  <thead><tr><th style=\"width:26%\">Form<\/th><th style=\"width:27%\">Polite<\/th><th style=\"width:24%\">Plain<\/th><th style=\"width:23%\">Use<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Non-past<\/td><td><span class=\"cjk exj\">飲みます<\/span> <span class=\"exr\">nomimasu<\/span><\/td><td><span class=\"cjk exj\">飲む<\/span> <span class=\"exr\">nomu<\/span><\/td><td class=\"exe\">drink<\/td><\/tr>\n    <tr><td class=\"fn\">Negative<\/td><td><span class=\"cjk exj\">飲みません<\/span> <span class=\"exr\">nomimasen<\/span><\/td><td><span class=\"cjk exj\">飲まない<\/span> <span class=\"exr\">nomanai<\/span><\/td><td class=\"exe\">don&#39;t drink<\/td><\/tr>\n    <tr><td class=\"fn\">Past<\/td><td><span class=\"cjk exj\">飲みました<\/span> <span class=\"exr\">nomimashita<\/span><\/td><td><span class=\"cjk exj\">飲んだ<\/span> <span class=\"exr\">nonda<\/span><\/td><td class=\"exe\">drank<\/td><\/tr>\n    <tr><td class=\"fn\">Past negative<\/td><td><span class=\"cjk exj\">飲みませんでした<\/span> <span class=\"exr\">nomimasen deshita<\/span><\/td><td><span class=\"cjk exj\">飲まなかった<\/span> <span class=\"exr\">nomanakatta<\/span><\/td><td class=\"exe\">didn&#39;t drink<\/td><\/tr>\n    <tr><td class=\"fn\">て-form<\/td><td colspan=\"2\"><span class=\"cjk exj\">飲んで<\/span> <span class=\"exr\">nonde<\/span><\/td><td class=\"exe\">connector<\/td><\/tr>\n    <tr><td class=\"fn\">Volitional<\/td><td><span class=\"cjk exj\">飲みましょう<\/span> <span class=\"exr\">nomimashō<\/span><\/td><td><span class=\"cjk exj\">飲もう<\/span> <span class=\"exr\">nomō<\/span><\/td><td class=\"exe\">let&#39;s drink<\/td><\/tr>\n    <tr><td class=\"fn\">Want to<\/td><td colspan=\"2\"><span class=\"cjk exj\">飲みたいです<\/span> <span class=\"exr\">nomitai desu<\/span><\/td><td class=\"exe\">I want to drink<\/td><\/tr>\n    <tr><td class=\"fn\">Potential (can)<\/td><td><span class=\"cjk exj\">飲めます<\/span> <span class=\"exr\">nomemasu<\/span><\/td><td><span class=\"cjk exj\">飲める<\/span> <span class=\"exr\">nomeru<\/span><\/td><td class=\"exe\">can drink<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\"><b>The pattern to see:<\/b> ru-verbs just drop <span class=\"cjk jp\">る<\/span> and add the ending; u-verbs shift the final\nkana onto the <i>i<\/i>-row before <span class=\"cjk jp\">ます<\/span> (<span class=\"cjk\">飲<u>み<\/u>ます<\/span>) and the <i>a<\/i>-row before\n<span class=\"cjk jp\">ない<\/span> (<span class=\"cjk\">飲<u>ま<\/u>ない<\/span>). Two irregulars run the whole language: <span class=\"cjk\">する&rarr;します<\/span>\n<span class=\"romaji\">(suru&rarr;shimasu)<\/span> and <span class=\"cjk\">来る&rarr;来ます<\/span> <span class=\"romaji\">(kuru&rarr;kimasu)<\/span>.<\/div>\n<\/body><\/html>"}, {"id": "adjectives", "title": "Adjectives — い & な", "kanji": "形", "sub": "How い-adjectives conjugate", "text": "two kinds of adjective japanese has two adjective classes . い -adjectives end in い and conjugate like little verbs (they carry their own past and negative). な -adjectives behave like nouns and need な to glue onto a following noun. the い conjugation is the genuinely new machinery; the な type you already half-know, because it works like の / 的 . chinese hook no \"to be\" needed. like mandarin, a japanese い -adjective is the predicate: 高い (takai) already means \"is expensive,\" the way 很贵 needs no 是 . you don&#39;t add a verb the adjective does the work. い-adjectives conjugate: 高い — takai, \"expensive / tall\" form japanese meaning present 高いです takai desu is expensive negative 高くないです takakunai desu isn&#39;t expensive (い くない) past 高かったです takakatta desu was expensive (い かった) past negative 高くなかったです takakunakatta desu wasn&#39;t expensive て-form (and ) 高くて takakute expensive and (links to next adj) adverb 高く takaku \"highly / expensively\" watch the one irregular: いい (ii, \"good\") conjugates off its old form よい (yoi) よくない (yokunai) , よかった (yokatta) . never \"iikunai.\" な-adjectives behave like nouns: 静か — shizuka, \"quiet\" form japanese meaning present 静かです shizuka desu is quiet negative 静かじゃないです shizuka ja nai desu isn&#39;t quiet past 静かでした shizuka deshita was quiet before a noun 静か な 部屋 shizuka na heya a quiet room (needs な) て-form (and ) 静かで shizuka de quiet and notice な-adjectives just ride on です / でした exactly like a noun does no special adjective endings. the only thing to remember is the な that appears when it sits in front of a noun ( きれいな花 , kirei na hana , \"a pretty flower\"). common な-adjectives: 好き (suki, liked) , 便利 (benri, convenient) , 有名 (yūmei, famous) , 元気 (genki, well/energetic) .", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-fami ut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">形<\/div><div><h1>Adjectives — い & な<\/h1><div class=\"st\">How い-adjectives conjugate<\/div><\/div><\/div>\n<h2>Two kinds of adjective<\/h2>\n<div class=\"concept\"><div class=\"big\">\nJapanese has <b>two adjective classes<\/b>. <span class=\"cjk jp\">い<\/span>-adjectives end in <span class=\"cjk jp\">い<\/span> and\n<b>conjugate like little verbs<\/b> (they carry their own past and negative). <span class=\"cjk jp\">な<\/span>-adjectives behave\nlike nouns and need <span class=\"cjk jp\">な<\/span> to glue onto a following noun. The <span class=\"cjk jp\">い<\/span> conjugation is\nthe genuinely new machinery; the <span class=\"cjk jp\">な<\/span> type you already half-know, because it works like\n<span class=\"cjk\">の<\/span>/<span class=\"cjk\">的<\/span>.\n<\/div><\/div>\n\n<div class=\"flip\">\n<b>Chinese hook &mdash; no \"to be\" needed.<\/b> Like Mandarin, a Japanese <span class=\"cjk jp\">い<\/span>-adjective <i>is<\/i> the\npredicate: <span class=\"cjk\">高い<\/span> <span class=\"romaji\">(takai)<\/span> already means \"is expensive,\" the way <span class=\"cjk\">很贵<\/span>\nneeds no <span class=\"cjk\">是<\/span>. You don&#39;t add a verb &mdash; the adjective does the work.\n<\/div>\n\n<h2>い-adjectives conjugate: 高い — <span class=\"romaji\">takai, \"expensive / tall\"<\/span><\/h2>\n<table>\n  <thead><tr><th style=\"width:24%\">Form<\/th><th style=\"width:40%\">Japanese<\/th><th style=\"width:36%\">Meaning<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Present<\/td><td><span class=\"cjk exj\">高いです<\/span> <span class=\"exr\">takai desu<\/span><\/td><td class=\"exe\">is expensive<\/td><\/tr>\n    <tr><td class=\"fn\">Negative<\/td><td><span class=\"cjk exj\">高くないです<\/span> <span class=\"exr\">takakunai desu<\/span><\/td><td class=\"exe\">isn&#39;t expensive &nbsp;(い &rarr; くない)<\/td><\/tr>\n    <tr><td class=\"fn\">Past<\/td><td><span class=\"cjk exj\">高かったです<\/span> <span class=\"exr\">takakatta desu<\/span><\/td><td class=\"exe\">was expensive &nbsp;(い &rarr; かった)<\/td><\/tr>\n    <tr><td class=\"fn\">Past negative<\/td><td><span class=\"cjk exj\">高くなかったです<\/span> <span class=\"exr\">takakunakatta desu<\/span><\/td><td class=\"exe\">wasn&#39;t expensive<\/td><\/tr>\n    <tr><td class=\"fn\">て-form (and&hellip;)<\/td><td><span class=\"cjk exj\">高くて<\/span> <span class=\"exr\">takakute<\/span><\/td><td class=\"exe\">expensive and&hellip; (links to next adj)<\/td><\/tr>\n    <tr><td class=\"fn\">Adverb<\/td><td><span class=\"cjk exj\">高く<\/span> <span class=\"exr\">takaku<\/span><\/td><td class=\"exe\">\"highly / expensively\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\"><b>Watch the one irregular:<\/b> <span class=\"cjk\">いい<\/span> <span class=\"romaji\">(ii, \"good\")<\/span> conjugates off its old form\n<span class=\"cjk\">よい<\/span> <span class=\"romaji\">(yoi)<\/span> &rarr; <span class=\"cjk\">よくない<\/span> <span class=\"romaji\">(yokunai)<\/span>,\n<span class=\"cjk\">よかった<\/span> <span class=\"romaji\">(yokatta)<\/span>. Never <i>\"iikunai.\"<\/i><\/div>\n\n<h2>な-adjectives behave like nouns: 静か — <span class=\"romaji\">shizuka, \"quiet\"<\/span><\/h2>\n<table>\n  <thead><tr><th style=\"width:24%\">Form<\/th><th style=\"width:40%\">Japanese<\/th><th style=\"width:36%\">Meaning<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Present<\/td><td><span class=\"cjk exj\">静かです<\/span> <span class=\"exr\">shizuka desu<\/span><\/td><td class=\"exe\">is quiet<\/td><\/tr>\n    <tr><td class=\"fn\">Negative<\/td><td><span class=\"cjk exj\">静かじゃないです<\/span> <span class=\"exr\">shizuka ja nai desu<\/span><\/td><td class=\"exe\">isn&#39;t quiet<\/td><\/tr>\n    <tr><td class=\"fn\">Past<\/td><td><span class=\"cjk exj\">静かでした<\/span> <span class=\"exr\">shizuka deshita<\/span><\/td><td class=\"exe\">was quiet<\/td><\/tr>\n    <tr><td class=\"fn\">Before a noun<\/td><td><span class=\"cjk exj\">静か<span class=\"jp\">な<\/span>部屋<\/span> <span class=\"exr\">shizuka na heya<\/span><\/td><td class=\"exe\">a quiet room &nbsp;(needs な)<\/td><\/tr>\n    <tr><td class=\"fn\">て-form (and&hellip;)<\/td><td><span class=\"cjk exj\">静かで<\/span> <span class=\"exr\">shizuka de<\/span><\/td><td class=\"exe\">quiet and&hellip;<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\">Notice な-adjectives just ride on <span class=\"cjk jp\">です / でした<\/span> exactly like a noun does &mdash; no special\nadjective endings. The only thing to remember is the <span class=\"cjk jp\">な<\/span> that appears when it sits in front of a noun\n(<span class=\"cjk\">きれいな花<\/span>, <span class=\"romaji\">kirei na hana<\/span>, \"a pretty flower\"). Common な-adjectives:\n<span class=\"cjk\">好き<\/span> <span class=\"romaji\">(suki, liked)<\/span>, <span class=\"cjk\">便利<\/span> <span class=\"romaji\">(benri, convenient)<\/span>,\n<span class=\"cjk\">有名<\/span> <span class=\"romaji\">(yūmei, famous)<\/span>, <span class=\"cjk\">元気<\/span> <span class=\"romaji\">(genki, well/energetic)<\/span>.<\/div>\n<\/body><\/html>"}, {"id": "kosoado", "title": "Pointing Words & Questions", "kanji": "此", "sub": "こそあど and question words", "text": "the こそあど system one tidy grid runs all of japanese&#39;s pointing words. the first syllable sets distance : こ = near me, そ = near you, あ = far from both, ど = the question (\"which / where\"). learn the four rows and you get \"this/that/which,\" \"here/there/where,\" and \"this way/how\" all at once. chinese hook: maps onto 这 / 那 / 哪 but where chinese has a two-way split (this vs that), japanese is three-way : it adds a middle \"that, near you \" ( そ ) that chinese folds into 那 . that extra rung is the only new part. row こ near me そ near you あ over there ど which? thing これ kore それ sore あれ are どれ dore + noun この kono その sono あの ano どの dono place ここ koko そこ soko あそこ asoko どこ doko direction / polite こちら kochira そちら sochira あちら achira どちら dochira manner (how) こう kō そう sō ああ ā どう dō kind (what sort) こんな konna そんな sonna あんな anna どんな donna the question words to pair with them 誰 dare who 何 nani / nan what いつ itsu when どこ doko where なぜ naze why どうして dōshite why / how come いくら ikura how much (price) いくつ ikutsu how many put to work the two you&#39;ll say daily これはいくらですか。 kore wa ikura desu ka \"how much is this?\" トイレはどこですか。 toire wa doko desu ka \"where is the toilet?\" handy combo for shopping: point and say これをください (kore o kudasai) , \"this one, please\" or あれ (are) for something up on a shelf.", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); ><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>The question words to pair with them<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">誰<\/span> <span class=\"r\">dare<\/span><span class=\"m\">who<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">何<\/span> <span class=\"r\">nani / nan<\/span><span class=\"m\">what<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">いつ<\/span> <span class=\"r\">itsu<\/span><span class=\"m\">when<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">どこ<\/span> <span class=\"r\">doko<\/span><span class=\"m\">where<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">なぜ<\/span> <span class=\"r\">naze<\/span><span class=\"m\">why<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">どうして<\/span> <span class=\"r\">dōshite<\/span><span class=\"m\">why / how come<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">いくら<\/span> <span class=\"r\">ikura<\/span><span class=\"m\">how much (price)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">いくつ<\/span> <span class=\"r\">ikutsu<\/span><span class=\"m\">how many<\/span><\/div>\n<\/div>\n\n<h2>Put to work &mdash; the two you&#39;ll say daily<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\"><div class=\"eg\"><span class=\"cjk\">これはいくらですか。<\/span><br><span class=\"romaji\">kore wa ikura desu ka<\/span><br>\"How much is this?\"<\/div><\/div>\n  <div class=\"card\"><div class=\"eg\"><span class=\"cjk\">トイレはどこですか。<\/span><br><span class=\"romaji\">toire wa doko desu ka<\/span><br>\"Where is the toilet?\"<\/div><\/div>\n<\/div>\n<div class=\"note\">Handy combo for shopping: point and say <span class=\"cjk\">これをください<\/span> <span class=\"romaji\">(kore o kudasai)<\/span>,\n\"this one, please\" &mdash; or <span class=\"cjk\">あれ<\/span> <span class=\"romaji\">(are)<\/span> for something up on a shelf.<\/div>\n<\/body><\/html>"}, {"id": "numbers", "title": "Numbers & Counters", "kanji": "数", "sub": "Two systems, counters, money", "text": "two systems and you already own one japanese runs two parallel number sets . the sino-japanese set was borrowed straight from chinese same characters, similar sounds and does almost all the heavy lifting (money, time, dates, counters). you read it on sight. the native set is indigenous, only goes to ten , ends in 〜つ , and handles casual counting of generic objects. sino-japanese from chinese, does everything structured 一 ichi 二 ni 三 san 四 shi / yon 五 go 六 roku 七 shichi / nana 八 hachi 九 kyū / ku 十 jū 百 hyaku 100 千 sen 1,000 万 man 10,000 native 1 10 only, casual generic counting 一つ hitotsu 二つ futatsu 三つ mittsu 四つ yottsu 五つ itsutsu 六つ muttsu 七つ nanatsu 八つ yattsu 九つ kokonotsu 十 tō eleven and up, everyone reverts to the sino set. the 〜つ ending is the generic counter when you don't know the right one, 二つ (futatsu) is your fallback. \"how many?\" = 幾つ (ikutsu) . big numbers group by 万 (10,000) your chinese reflex, not english's japanese 万 = chinese 萬 : numbers chunk every four zeros, not three. 三万五千 (san-man go-sen) = 35,000 十万 (jū-man) = 100,000 一万二千円 (ichi-man ni-sen en) = 12,000 you'll parse japanese prices faster than any english speaker the \"myriad\" grouping is already wired in. the reading traps 4, 7, 9, 0 digit readings why it flips and the safe default 四 shi / yon shi is a homophone of 死 \"death\" the same 四/死 taboo you know from chinese ( sì/sǐ ); buildings skip floor 4 in both countries. default to yon . 七 shichi / nana shichi is easily misheard as ichi (1), so nana is preferred for clarity. default to nana . 九 kyū / ku ku sounds like 苦 \"suffering,\" so japan reads 9 as unlucky opposite of china, where 九 jiǔ is lucky. default to kyū . 〇 zero / rei / maru zero in most everyday use; rei in formal/official contexts; maru (\"circle\") when reading out digits like phone numbers. yon and nana are actually native-set readings leaking into the sino system which is why counting aloud you'll hear the hybrid san, yon, go roku, nana, hachi counters (助数詞) like chinese 量词 same principle you know from chinese: a number can't touch a noun bare you need a category-appropriate counter, just as 三隻猫 needs 隻 . readings are new; the concept is free. counter reads counts example chinese hook 人 nin people 三人 san-nin \"three people\" ≈ 个 / 位 個 ko generic small objects the fallback りんごを五個 ringo o go-ko \"five apples\" = 個 / 个 (catch-all) 枚 mai flat thin things (paper, tickets, plates) 切符を二枚 kippu o ni-mai \"two tickets\" ≈ 張 本 hon long cylindrical things (bottles, pens) ビールを二本 bīru o ni-hon \"two beers (bottles)\" ≈ 支 / 根 杯 hai cupfuls / glassfuls (drinks on tap) 生ビールを二杯 nama-bīru o ni-hai \"two drafts\" = 杯 台 dai machines vehicles 車を一台 kuruma o ichi-dai \"one car\" ≈ 台 / 輛 冊 satsu bound books magazines 本を三冊 hon o san-satsu \"three books\" ≈ 本 匹 hiki small animals 猫を三匹 neko o san-biki \"three cats\" ≈ 隻 the sound-change trap counters mutate this one has no chinese equivalent and it's the real work: the counter's consonant shifts with the number in front of it. 本 ( hon ) is the classic offender watch the h p / b : 1 ippon 2 nihon 3 sanbon 4 yonhon 5 gohon 6 roppon 7 nanahon 8 happon 9 kyūhon 10 juppon 匹 ( ippiki, nihiki, sanbiki ), 杯 ( ippai, nihai, sanbai ) and 個 ( ikko, niko, sanko ) mutate the same way the 1, 6, 8, 10 slots are the usual troublemakers. clean counters that never mutate: 枚 ( mai ) and 台 ( dai ). recognize the meaning free; memorize the contortions. where the counter goes default float it after the noun unlike chinese, the counter usually drifts downstream , near the verb. noun keeps its particle; the number+counter floats free. ビール を 二本ください。 bīru o ni-hon kudasai \"two beers, please.\" 猫 を 三匹飼っています。 neko o san-biki katteimasu \"i keep three cats.\" alternative front it, chinese-style put it before the noun with の as glue your exact chinese word order. correct, but reads a touch more formal / written. 三匹 の 猫 san-biki no neko \"three cats\" 二本 の ビール ni-hon no bīru \"two beers\" ordering for the trip noun を number +
