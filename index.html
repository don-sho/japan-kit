ll .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">宅<\/div><div><h1>Takkyubin — Luggage<\/h1><div class=\"st\">Forward your bags city-to-city<\/div><\/div><\/div>\n<h2>Send your bags ahead &mdash; the multi-city hack<\/h2>\n<div class=\"concept\"><div class=\"big\">\n<b>Takkyubin<\/b> <span class=\"cjk\">(宅急便<\/span> <span class=\"romaji\">takkyūbin)<\/span> &mdash; Yamato's black-cat\n<span class=\"cjk\">(クロネコ<\/span> <span class=\"romaji\">kuroneko)<\/span> service &mdash; forwards a suitcase hotel&#8209;to&#8209;hotel or\nhotel&#8209;to&#8209;airport for roughly <b>&yen;2,000&ndash;2,500<\/b> a bag, usually next day. You travel light on the train; your\nluggage meets you there. This is the move that makes your Tokyo &rarr; Kyushu &rarr; Kyoto plan painless.\n<\/div><\/div>\n\n<h2>How it works &mdash; four steps<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:22%\" class=\"fn\">1. Ask<\/td><td class=\"exe\">Do it at your <b>hotel front desk<\/b> (easiest by far) &mdash; or a konbini or Yamato office.<\/td><\/tr>\n    <tr><td class=\"fn\">2. Fill the slip<\/td><td class=\"exe\">The <span class=\"cjk\">伝票<\/span> <span class=\"exr\">(denpyō)<\/span> form: who's sending, who's receiving, the date, the size.<\/td><\/tr>\n    <tr><td class=\"fn\">3. Pay<\/td><td class=\"exe\">Hand over the bag, pay, and keep the <b>receipt with the tracking number<\/b>.<\/td><\/tr>\n    <tr><td class=\"fn\">4. It arrives<\/td><td class=\"exe\">Next day at the destination (you can pick a date &amp; time slot). Done.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Filling the slip &mdash; the fields that matter<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">お届け先<\/span> <span class=\"r\">o-todokesaki<\/span><span class=\"m\">recipient / where it's going<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">ご依頼主<\/span> <span class=\"r\">go-irainushi<\/span><span class=\"m\">sender (you / this hotel)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">品名<\/span> <span class=\"r\">hinmei<\/span><span class=\"m\">contents &mdash; write 衣類 (clothes)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">お届け日<\/span> <span class=\"r\">o-todokebi<\/span><span class=\"m\">delivery date<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">時間帯<\/span> <span class=\"r\">jikantai<\/span><span class=\"m\">delivery time slot<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">クール便<\/span> <span class=\"r\">kūru-bin<\/span><span class=\"m\">chilled service &mdash; for food gifts, not bags<\/span><\/div>\n<\/div>\n\n<h2>Saying it<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">荷物を送りたいです<\/span> <span class=\"exr\">nimotsu o okuritai desu<\/span><\/td><td class=\"exe\">\"I'd like to send some luggage.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">このホテルに送れますか<\/span> <span class=\"exr\">kono hoteru ni okuremasu ka<\/span><\/td><td class=\"exe\">\"Can you send it to this hotel?\" (show the next hotel's details)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">いつ届きますか<\/span> <span class=\"exr\">itsu todokimasu ka<\/span><\/td><td class=\"exe\">\"When will it arrive?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">明日の午後でお願いします<\/span> <span class=\"exr\">ashita no gogo de onegaishimasu<\/span><\/td><td class=\"exe\">\"Tomorrow afternoon, please.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">私宛の荷物は届いていますか<\/span> <span class=\"exr\">watashi ate no nimotsu wa todoite imasu ka<\/span><\/td><td class=\"exe\">\"Has a parcel arrived for me?\" (at the receiving desk)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Your plan, specifically<\/h2>\n<div class=\"note\" style=\"margin-top:0\">Forward the big bags <b>Tokyo &rarr; Kyushu<\/b>, keep them in the rental car around Kyushu, then forward <b>Fukuoka &rarr; Narita<\/b> and do Kyoto on carry-ons. Two things worth doing: give the sending desk the <b>next hotel's address, phone, and your reservation name<\/b>, and <b>confirm the receiving hotel will hold the parcel<\/b> (your Setre to-do). For the airport leg, send with a <b>couple of days' buffer<\/b> so it's waiting before your flight.<\/div>\n\n<div class=\"zhbox\"><div class=\"hd\">Your Chinese eye on the form<\/div>\n<span class=\"cjk\">宅急便<\/span> reads almost literally &mdash; <span class=\"cjk\">宅<\/span> <span class=\"romaji\">(taku)<\/span> is\n\"residence,\" <span class=\"cjk\">便<\/span> <span class=\"romaji\">(bin)<\/span> is the \"service/post\" of <span class=\"cjk\">便利<\/span>. <span class=\"cjk\">荷物<\/span>\n<span class=\"romaji\">(nimotsu)<\/span> is your load/cargo (<span class=\"cjk\">荷<\/span> = load), and <span class=\"cjk\">品名<\/span>\n<span class=\"romaji\">(hinmei)<\/span> \"item name\" reads the same as in Chinese. The one purely-Japanese word to learn is\n<span class=\"cjk\">届く<\/span> <span class=\"romaji\">(todoku)<\/span> &mdash; \"to be delivered / to arrive.\"\n<\/div>\n<\/body><\/html>"}, {"id": "shopping", "title": "Shopping", "kanji": "買", "sub": "Browsing, sizes, tax-free, paying", "text": "how shopping works prices are fixed haggling isn't a thing outside flea markets. staff greet you with いらっしゃいませ (irasshaimase) ; you don't reply, just browse. tax-free is real money back for tourists, but it needs your passport and a 5,000+ spend at a participating shop. carry cash smaller shops and markets may not take cards. browsing trying 見ているだけです mite iru dake desu \"just looking, thanks.\" これを見せてください kore o misete kudasai \"could i see this one?\" 試着してもいいですか shichaku shite mo ii desu ka \"can i try it on?\" 〜はありますか ~ wa arimasu ka \"do you have ~?\" (slot anything in) もっと大きい / 小さいのは？ motto ōkii / chiisai no wa? \"a bigger / smaller one?\" 別の色はありますか betsu no iro wa arimasu ka \"is there another color?\" paying tax-free いくらですか ikura desu ka \"how much is it?\" カードで払えますか kādo de haraemasu ka \"can i pay by card?\" (現金 genkin = cash) 免税できますか menzei dekimasu ka \"can i do tax-free?\" (bring your passport) 袋をください / いりません fukuro o kudasai / irimasen \"a bag, please\" / \"no bag needed\" 海外に送れますか kaigai ni okuremasu ka \"can you ship this overseas?\" (for anything too big to carry) what the register will ask you 袋はいりますか fukuro wa irimasu ka \"do you want a bag?\" say はい / いいえ 温めますか atatamemasu ka \"shall i heat it up?\" (konbini) お箸はいりますか o-hashi wa irimasu ka \"do you need chopsticks?\" ポイントカードはお持ちですか pointo kādo wa o-mochi desu ka \"do you have a point card?\" just say いいえ signs you'll see 免税 menzei tax-free 会計 / レジ kaikei / reji checkout セール sēru sale 割引 waribiki discount 税込 zeikomi tax included 品切れ shinagire sold out tax-free, in one breath spend 5,000+ at a shop with a 免税 (tax-free) sign, show your passport at checkout, and the ~10% consumption tax comes off. consumables get sealed in a bag you're not meant to open until you leave japan. chinese hook: 免税 reads the same as 免税 in chinese. ceramics aside: if you do buy porcelain, 海外発送 (kaigai hassō, overseas shipping) is the phrase that saves your luggage.", "section": "ground", "group": "Shopping & money", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(- \"><span class=\"cjk exj\">見ているだけです<\/span> <span class=\"exr\">mite iru dake desu<\/span><\/td><td class=\"exe\">\"Just looking, thanks.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">これを見せてください<\/span> <span class=\"exr\">kore o misete kudasai<\/span><\/td><td class=\"exe\">\"Could I see this one?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">試着してもいいですか<\/span> <span class=\"exr\">shichaku shite mo ii desu ka<\/span><\/td><td class=\"exe\">\"Can I try it on?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜はありますか<\/span> <span class=\"exr\">~ wa arimasu ka<\/span><\/td><td class=\"exe\">\"Do you have ~?\" (slot anything in)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">もっと大きい / 小さいのは？<\/span> <span class=\"exr\">motto ōkii / chiisai no wa?<\/span><\/td><td class=\"exe\">\"A bigger / smaller one?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">別の色はありますか<\/span> <span class=\"exr\">betsu no iro wa arimasu ka<\/span><\/td><td class=\"exe\">\"Is there another color?\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Paying &amp; tax-free<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">いくらですか<\/span> <span class=\"exr\">ikura desu ka<\/span><\/td><td class=\"exe\">\"How much is it?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">カードで払えますか<\/span> <span class=\"exr\">kādo de haraemasu ka<\/span><\/td><td class=\"exe\">\"Can I pay by card?\" (現金 genkin = cash)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">免税できますか<\/span> <span class=\"exr\">menzei dekimasu ka<\/span><\/td><td class=\"exe\">\"Can I do tax-free?\" (bring your passport)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">袋をください / いりません<\/span> <span class=\"exr\">fukuro o kudasai / irimasen<\/span><\/td><td class=\"exe\">\"A bag, please\" / \"no bag needed\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">海外に送れますか<\/span> <span class=\"exr\">kaigai ni okuremasu ka<\/span><\/td><td class=\"exe\">\"Can you ship this overseas?\" (for anything too big to carry)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>What the register will ask you<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">袋はいりますか<\/span> <span class=\"exr\">fukuro wa irimasu ka<\/span><\/td><td class=\"exe\">\"Do you want a bag?\" &mdash; say <span class=\"cjk\">はい<\/span>/<span class=\"cjk\">いいえ<\/span><\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">温めますか<\/span> <span class=\"exr\">atatamemasu ka<\/span><\/td><td class=\"exe\">\"Shall I heat it up?\" (konbini)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お箸はいりますか<\/span> <span class=\"exr\">o-hashi wa irimasu ka<\/span><\/td><td class=\"exe\">\"Do you need chopsticks?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ポイントカードはお持ちですか<\/span> <span class=\"exr\">pointo kādo wa o-mochi desu ka<\/span><\/td><td class=\"exe\">\"Do you have a point card?\" &mdash; just say <span class=\"cjk\">いいえ<\/span><\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Signs you'll see<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">免税<\/span> <span class=\"r\">menzei<\/span><span class=\"m\">tax-free<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">会計 / レジ<\/span> <span class=\"r\">kaikei / reji<\/span><span class=\"m\">checkout<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">セール<\/span> <span class=\"r\">sēru<\/span><span class=\"m\">sale<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">割引<\/span> <span class=\"r\">waribiki<\/span><span class=\"m\">discount<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">税込<\/span> <span class=\"r\">zeikomi<\/span><span class=\"m\">tax included<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">品切れ<\/span> <span class=\"r\">shinagire<\/span><span class=\"m\">sold out<\/span><\/div>\n<\/div>\n\n<div class=\"zhbox\"><div class=\"hd\">Tax-free, in one breath<\/div>\nSpend <b>&yen;5,000+<\/b> at a shop with a <span class=\"cjk\">免税<\/span> (tax-free) sign, show your <b>passport<\/b> at checkout, and the ~10% consumption\ntax comes off. Consumables get sealed in a bag you're not meant to open until you leave Japan. Chinese hook: <span class=\"cjk\">免税<\/span> reads\nthe same as <span class=\"cjk\">免税<\/span> in Chinese. &nbsp; <i>Ceramics aside:<\/i> if you do buy porcelain, <span class=\"cjk\">海外発送<\/span>\n<span class=\"romaji\">(kaigai hassō, overseas shipping)<\/span> is the phrase that saves your luggage.<\/div>\n<\/body><\/html>"}, {"id": "money", "title": "Money & Payments", "kanji": "円", "sub": "Cash, ATMs, cards, Apple Pay, IC", "text": "the setup that just works for a modern japan trip you want three things: a suica in your iphone wallet , one no-foreign-fee visa or mastercard , and 15,000 20,000 cash . that covers ~90% of spending. cashless has crossed half of all spending and keeps climbing but cash is still non-negotiable at the small, characterful places you'll actually love. quick converter usd jpy $ loading rate mid-market rate, for a ballpark your card or atm adds a few % on top. rates by exchangerate-api. the money itself notes and don't panic if two designs show up: the 2024 series (released july 2024) circulates alongside the older 2004 series, and both are perfectly valid , forever. 2024 series 2004 series 10,000 2024 shibusawa / 2004 fukuzawa 5,000 2024 tsuda / 2004 higuchi 2,000 2004 series only design, rarely seen 1,000 2024 kitasato / 2004 noguchi tap a note to flip front back coins the 五 5 and 50 have a hole in the middle; the 5 is the odd one with no western numeral at all (only 五円 ), so learn it by sight. 1 5 10 50 100 500 heads-up: some older vending, ticket, and change machines still can't read the newest 1,000 10,000 notes or the 2021 two-tone 500 coin keep a few coins and older notes as backup for machines. getting cash atms most japanese bank atms reject foreign cards. don't walk up to a mizuho or mufg machine use a convenience-store atm instead. 7-eleven (7-bank) your default. in every 7-eleven, 24/7, english menu, takes visa / mastercard / amex / jcb / unionpay. ~ 220 fee. widest coverage, even rural. japan post (yucho) solid backup, at post offices some stations. a few smaller branches close sunday afternoons. lawson / familymart / aeon also take foreign cards if no 7-eleven is near. two habits that save money: withdraw a larger chunk ( 20,000 30,000) at once to spread the fixed fee; and if any machine or card reader offers to charge in dollars (\"with conversion\"), always choose yen that \"dcc\" convenience is a built-in bad exchange rate. before a rural or ryokan stretch, top up cash in the last big city. cards apple pay where cards work visa mastercard at hotels, department stores, chains, konbini, most mid-size restaurants. amex has gaps at small places. pay in yen , never dollars. know your pin since 2025, chip payments usually want your 4-digit pin , not a signature make sure you know it before you fly. apple pay + suica the slick move: add suica (or pasmo/icoca) to apple wallet before the trip and top it up with your card. tap your phone at train gates, konbini, and vending machines. set it up at home to skip the airport ticket lines. if top-up is declined some foreign visa cards won't load a digital suica a mastercard or amex often will. if it fails, just load cash onto the suica at any station machine. paypay (the qr-code app locals use everywhere) is great but needs setup and id verification for a two-week trip, suica + a card is enough; skip paypay unless you want it. using your suica on trains (fares, gates, not crossing rail companies) is covered on the trains transit sheet. cash-only, every time keep yen for these tiny ramen izakaya counters, temple/shrine offerings and 御朱印 (goshuin stamps), market festival stalls, coin lockers, rural buses, older ryokan, and most vending machines. a good rule: tap or card for the big and modern, cash for the small and old and refill at a 7-eleven whenever you dip below ~ 5,000.", "section": "ground", "group": "Shopping & money", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq .zh { font-size: 15px; }\n  .zhbox .note { flex: 1; font-size: 8.8px; color: var(--ink2); }\n  .zhbox .cap { font-size: 8.3px; color: var(--muted); margin-top: 6px; font-style: italic; }\n\n  .traps { display: flex; gap: 9px; }\n  .trap {\n    flex: 1; text-align: center; background: var(--card);\n    border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px;\n  }\n  .trap .k { font-size: 20px; font-weight: 700; color: var(--jp); }\n  .trap .say { font-size: 9px; margin-top: 2px; }\n  .trap .say b { color: var(--red); }\n  .trap .why { font-size: 7.8px; color: var(--muted); margin-top: 2px; }\n\n  footer {\n    margin-top: 12px; padding-top: 7px; border-top: 1px solid var(--line);\n    font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between;\n  }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d; --ink2: #2c3e5c; --red: #c1362f; --indigo: #3d5a80;\n    --paper: #faf8f3; --card: #ffffff; --line: #e4ddce; --muted: #6b7280;\n    --jp: #b5341f; --zh: #1f6f4a;\n  }\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  header {\n    border-bottom: 3px solid var(--ink); padding-bottom: 9px; margin-bottom: 12px;\n    display: flex; align-items: flex-end; justify-content: space-between;\n  }\n  header .title h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink); }\n  header .title .sub { font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px; }\n  header .mark { text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4; }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px; }\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800; margin: 13px 0 6px;\n    padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  .concept { background: var(--ink); color: #eef1f6; border-radius: 7px; padding: 10px 13px; margin-bottom: 6px; }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10px; line-height: 1.5; }\n\n  /* number grids */\n  .numwrap { display: flex; gap: 9px; }\n  .numcard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }\n  .numcard.sino { border-top: 3px solid var(--zh); }\n  .numcard.native { border-top: 3px solid var(--jp); }\n  .numcard .cap { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }\n  .numcard .cap b { color: var(--ink); }\n  .ngrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px 6px; }\n  .ncell { text-align: center; padding: 3px 2px; background: #f4f1e9; border-radius: 4px; }\n  .ncell .g { font-size: 14px; font-weight: 700; color: var(--jp); }\n  .ncell .r { font-size: 8px; font-style: italic; color: var(--ink2); display: block; }\n  .ncell .alt { color: var(--red); }\n\n  .bigrow { display: flex; gap: 6px; margin-top: 6px; }\n  .bigrow .ncell { flex: 1; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 9px 12px; margin: 6px 0;\n  }\n  .zhbox .hd { font-weight: 800; color: var(--ink); font-size: 9.5px; margin-bottom: 3px; }\n  .zhbox .eg { font-size: 9.2px; margin-top: 3px; }\n  .zhbox .eg .cjk { font-size: 11.5px; }\n\n  .flip { background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px; padding: 8px 11px; margin: 6px 0; font-size: 9.3px; }\n\n  table { width: 100%; border-collapse: col tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">円<\/div><div><h1>Money & Payments<\/h1><div class=\"st\">Cash, ATMs, cards, Apple Pay, IC<\/div><\/div><\/div>\n<style>\n  /* --- USD/JPY converter --- */\n  .fxcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:12px 0 6px;box-shadow:0 2px 10px rgba(90,70,40,.05);}\n  .fxhead{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--red);margin-bottom:10px;text-transform:uppercase;}\n  .fxrow{display:flex;align-items:center;gap:8px;}\n  .fxin{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);min-width:0;}\n  .fxin .fxsym{font-size:18px;font-weight:800;color:var(--muted);flex:0 0 auto;}\n  .fxin input{border:none;background:none;font-size:19px;font-weight:700;color:var(--ink);width:100%;min-width:0;outline:none;font-family:inherit;}\n  .fxeq{font-size:18px;color:var(--muted);font-weight:700;flex:0 0 auto;}\n  .fxchips{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px;}\n  .fxchip{background:#FBEDEA;color:var(--red);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;}\n  .fxrate{font-size:12.5px;color:var(--ink);font-weight:700;margin-top:10px;}\n  .fxattr{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45;}\n  /* --- note gallery --- */\n  .nseg{display:flex;gap:6px;background:#efe8db;border-radius:10px;padding:4px;max-width:300px;margin:8px 0 12px;}\n  .nseg button{flex:1;border:none;background:none;border-radius:7px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;}\n  .nseg button.on{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.08);}\n  .notes{display:flex;flex-direction:column;gap:13px;align-items:center;margin:6px 0 2px;}\n  .jnote{margin:0;cursor:pointer;width:100%;max-width:320px;text-align:center;}\n  .jnote img{width:100%;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.16);background:#efeae0;aspect-ratio:2.1/1;object-fit:contain;display:block;}\n  .jnote figcaption{font-size:12px;color:var(--muted);margin-top:5px;}\n  .jnote figcaption b{color:var(--ink);font-size:13px;}\n  .fliphint{text-align:center;font-size:11.5px;color:#b3a894;margin:4px 0 2px;}\n  /* --- coin row --- */\n  .jcoins{display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center;margin:10px 0 2px;}\n  .jcoin{width:66px;text-align:center;}\n  .jcoin img{width:60px;height:60px;object-fit:contain;display:block;margin:0 auto;}\n  .jcoin .cl{font-size:12px;font-weight:800;color:var(--ink);margin-top:3px;}\n<\/style>\n\n<h2>The setup that just works<\/h2>\n<div class=\"concept\"><div class=\"big\">\nFor a modern Japan trip you want three things: a <b>Suica in your iPhone wallet<\/b>, <b>one no-foreign-fee Visa or Mastercard<\/b>,\nand <b>&yen;15,000&ndash;20,000 cash<\/b>. That covers ~90% of spending. Cashless has crossed half of all spending and keeps\nclimbing &mdash; but cash is still non-negotiable at the small, characterful places you'll actually love.\n<\/div><\/div>\n\n<div class=\"fxcard\">\n  <div class=\"fxhead\">Quick converter &middot; USD &harr; JPY<\/div>\n  <div class=\"fxrow\">\n    <div class=\"fxin\"><span class=\"fxsym\">$<\/span><input id=\"fxusd\" type=\"text\" inputmode=\"decimal\" placeholder=\"0\" autocomplete=\"off\"><\/div>\n    <div class=\"fxeq\">&asymp;<\/div>\n    <div class=\"fxin\"><span class=\"fxsym\">&yen;<\/span><input id=\"fxjpy\" type=\"text\" inputmode=\"decimal\" placeholder=\"0\" autocomplete=\"off\"><\/div>\n  <\/div>\n  <div class=\"fxchips\" id=\"fxchips\"><\/div>\n  <div class=\"fxrate\" id=\"fxrate\">Loading rate&hellip;<\/div>\n  <div class=\"fxattr\">Mid-market rate, for a ballpark &mdash; your card or ATM adds a few % on top. Rates by ExchangeRate-API.<\/div>\n<\/div>\n\n<h2>The money itself<\/h2>\n<div class=\"note\" style=\"margin-top:0\"><b>Notes<\/b> &mdash; and don't panic if two designs show up: the 2024 series (released July 2024) circulates\nalongside the older 2004 series, and <b>both are perfectly valid<\/b>, forever.<\/div>\n<div class=\"nseg\" id=\"nseg\">\n  <button data-series=\"2024\" class=\"on\">2024 series<\/button>\n  <button data-series=\"2004\">2004 series<\/button>\n<\/div>\n<div class=\"notes\" id=\"notes\">\n  <figure class=\"jnote\" data-denom=\"10000\"><img alt=\"10,000 yen note\"><figcaption><b>&yen;10,000<\/b> &middot; 2024 Shibusawa / 2004 Fukuzawa<\/figcaption><\/figure>\n  <figure class=\"jnote\" data-denom=\"5000\"><img alt=\"5,000 yen note\"><figcaption><b>&yen;5,000<\/b> &middot; 2024 Tsuda / 2004 Higuchi<\/figcaption><\/figure>\n  <figure class=\"jnote\" data-denom=\"2000\"><img alt=\"2,000 yen note\"><figcaption><b>&yen;2,000<\/b> &middot; 2004 series &mdash; only design, rarely seen<\/figcaption><\/figure>\n  <figure class=\"jnote\" data-denom=\"1000\"><img alt=\"1,000 yen note\"><figcaption><b>&yen;1,000<\/b> &middot; 2024 Kitasato / 2004 Noguchi<\/figcaption><\/figure>\n<\/div>\n<div class=\"fliphint\">Tap a note to flip front &rlarr; back<\/div>\n<div class=\"note\" style=\"margin-top:0\"><b>Coins<\/b> &mdash; the <span class=\"cjk\">五<\/span>&yen;5 and &yen;50 have a <b>hole<\/b> in the middle; the\n&yen;5 is the odd one with <b>no Western numeral at all<\/b> (only <span class=\"cjk\">五円<\/span>), so learn it by sight.<\/div>\n<div class=\"jcoins\" id=\"jcoins\">\n  <div class=\"jcoin\"><img data-img=\"coin-1.png\" alt=\"1 yen\"><div class=\"cl\">&yen;1<\/div><\/div>\n  <div class=\"jcoin\"><img data-img=\"coin-5.png\" alt=\"5 yen\"><div class=\"cl\">&yen;5<\/div><\/div>\n  <div class=\"jcoin\"><img data-img=\"coin-10.png\" alt=\"10 yen\"><div class=\"cl\">&yen;10<\/div><\/div>\n  <div class=\"jcoin\"><img data-img=\"coin-50.png\" alt=\"50 yen\"><div class=\"cl\">&yen;50<\/div><\/div>\n  <div class=\"jcoin\"><img data-img=\"coin-100.png\" alt=\"100 yen\"><div class=\"cl\">&yen;100<\/div><\/div>\n  <div class=\"jcoin\"><img data-img=\"coin-500.png\" alt=\"500 yen\"><div class=\"cl\">&yen;500<\/div><\/div>\n<\/div>\n<div class=\"note\">Heads-up: some older vending, ticket, and change machines still can't read the newest &yen;1,000&ndash;&yen;10,000 notes\nor the 2021 two-tone &yen;500 coin &mdash; keep a few coins and older notes as backup for machines.<\/div>\n\n<h2>Getting cash &mdash; ATMs<\/h2>\n<div class=\"warn\" style=\"background:#fdf3e7;border:1px solid #e6c79e;border-left:4px solid #b8860b;border-radius:6px;padding:9px 12px;margin:5px 0;\">\n<b>Most Japanese bank ATMs reject foreign cards.<\/b> Don't walk up to a Mizuho or MUFG machine &mdash; use a convenience-store ATM instead.<\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\" class=\"fn\">7-Eleven (7-Bank)<\/td><td class=\"exe\"><b>Your default.<\/b> In every 7-Eleven, 24/7, English menu, takes Visa / Mastercard / Amex / JCB / UnionPay. ~&yen;220 fee. Widest coverage, even rural.<\/td><\/tr>\n    <tr><td class=\"fn\">Japan Post (Yucho)<\/td><td class=\"exe\">Solid backup, at post offices &amp; some stations. A few smaller branches close Sunday afternoons.<\/td><\/tr>\n    <tr><td class=\"fn\">Lawson / FamilyMart / Aeon<\/td><td class=\"exe\">Also take foreign cards if no 7-Eleven is near.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\"><b>Two habits that save money:<\/b> withdraw a larger chunk (&yen;20,000&ndash;30,000) at once to spread the fixed fee; and if any\nmachine or card reader offers to charge in dollars (\"with conversion\"), <b>always choose yen<\/b> &mdash; that \"DCC\" convenience is a\nbuilt-in bad exchange rate. Before a rural or ryokan stretch, top up cash in the last big city.<\/div>\n\n<h2>Cards &amp; Apple Pay<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\" class=\"fn\">Where cards work<\/td><td class=\"exe\">Visa &amp; Mastercard at hotels, department stores, chains, konbini, most mid-size restaurants. Amex has gaps at small places. Pay <b>in yen<\/b>, never dollars.<\/td><\/tr>\n    <tr><td class=\"fn\">Know your PIN<\/td><td class=\"exe\">Since 2025, chip payments usually want your <b>4-digit PIN<\/b>, not a signature &mdash; make sure you know it before you fly.<\/td><\/tr>\n    <tr><td class=\"fn\">Apple Pay + Suica<\/td><td class=\"exe\">The slick move: add <b>Suica<\/b> (or PASMO/ICOCA) to Apple Wallet <i>before<\/i> the trip and top it up with your card. Tap your phone at train gates, konbini, and vending machines. Set it up at home to skip the airport ticket lines.<\/td><\/tr>\n    <tr><td class=\"fn\">If top-up is declined<\/td><td class=\"exe\">Some foreign <b>Visa<\/b> cards won't load a digital Suica &mdash; a Mastercard or Amex often will. If it fails, just load <b>cash<\/b> onto the Suica at any station machine.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\"><b>PayPay<\/b> (the QR-code app locals use everywhere) is great but needs setup and ID verification &mdash; for a two-week trip, Suica + a card is enough; skip PayPay unless you want it. Using your <b>Suica on trains<\/b> (fares, gates, not crossing rail companies) is covered on the <b>Trains &amp; Transit<\/b> sheet.<\/div>\n\n<h2>Cash-only, every time<\/h2>\n<div class=\"zhbox\"><div class=\"hd\">Keep yen for these<\/div>\nTiny ramen &amp; izakaya counters, temple/shrine offerings and <span class=\"cjk\">御朱印<\/span> (goshuin stamps), market &amp; festival stalls,\ncoin lockers, rural buses, older ryokan, and most vending machines. A good rule: tap or card for the big and modern, <b>cash for the\nsmall and old<\/b> &mdash; and refill at a 7-Eleven whenever you dip below ~&yen;5,000.<\/div>\n\n<script>\n(function(){\n  function el(id){return document.getElementById(id);}\n  var BASE=\"%BASE%\";if(BASE.charAt(0)===\"%\"){BASE=document.baseURI.replace(/[^/]*$/,\"\");}\n  function imgurl(name){return BASE+\"img/\"+name;}\n\n  // coins (and any static data-img)\n  try{\n    Array.prototype.forEach.call(document.querySelectorAll(\"img[data-img]\"),function(im){\n      im.src=imgurl(im.getAttribute(\"data-img\"));\n    });\n  }catch(e){}\n\n  // notes: per-note flip + shared series toggle\n  try{\n    var series=\"2024\";\n    var side={\"10000\":\"front\",\"5000\":\"front\",\"2000\":\"front\",\"1000\":\"front\"};\n    function noteSrc(d){var s=(d===\"2000\")?\"2004\":series;return imgurl(\"note-\"+d+\"-\"+s+\"-\"+side[d]+\".jpg\");}\n    function paint(){Array.prototype.forEach.call(document.querySelectorAll(\".jnote\"),function(f){\n      var d=f.getAttribute(\"data-denom\");var im=f.querySelector(\"img\");if(im)im.src=noteSrc(d);});}\n    Array.prototype.forEach.call(document.querySelectorAll(\".jnote\"),function(f){\n      f.addEventListener(\"click\",function(){var d=f.getAttribute(\"data-denom\");\n        side[d]=(side[d]===\"front\")?\"back\":\"front\";var im=f.querySelector(\"img\");if(im)im.src=noteSrc(d);});\n    });\n    Array.prototype.forEach.call(document.querySelectorAll(\"#nseg button\"),function(b){\n      b.addEventListener(\"click\",function(){series=b.getAttribute(\"data-series\");\n        Array.prototype.forEach.call(document.querySelectorAll(\"#nseg button\"),function(x){x.className=(x===b)?\"on\":\"\";});\n        paint();});\n    });\n    paint();\n  }catch(e){}\n\n  // converter\n  try{\n    var SEED=158, LS=\"jk_fx_v1\";\n    var rate=SEED, asOf=\"approx.\", live=false;\n    function jpy(n){return Math.round(n).toLocaleString(\"en-US\");}\n    function usd(n){return (Math.round(n*100)/100).toLocaleString(\"en-US\",{minimumFractionDigits:2,maximumFractionDigits:2});}\n    function num(v){v=(v||\"\").replace(/[^0-9.]/g,\"\");return v===\"\"?null:parseFloat(v);}\n    try{var c=JSON.parse(localStorage.getItem(LS));if(c&&c.rate){rate=c.rate;asOf=c.date;live=true;}}catch(e){}\n    var iu=el(\"fxusd\"), ij=el(\"fxjpy\");\n    function fromUSD(){var u=num(iu.value);ij.value=(u==null)?\"\":jpy(u*rate);}\n    function fromJPY(){var j=num(ij.value);iu.value=(j==null)?\"\":usd(j/rate);}\n    if(iu)iu.addEventListener(\"input\",fromUSD);\n    if(ij)ij.addEventListener(\"input\",fromJPY);\n    function chips(){var ds=[100,500,1000,5000,10000];var h=\"\";ds.forEach(function(d){\n      h+='<span class=\"fxchip\">\\u00A5'+d.toLocaleString(\"en-US\")+' \\u2248 $'+usd(d/rate)+'<\/span>';});\n      if(el(\"fxchips\"))el(\"fxchips\").innerHTML=h;}\n    function show(){if(el(\"fxrate\"))el(\"fxrate\").textContent=(live?\"Live\":\"Offline\")+\" \\u00B7 $1 \\u2248 \\u00A5\"+jpy(rate)+\"  (as of \"+asOf+\")\";chips();\n      if(document.activeElement!==ij)fromUSD();}\n    show();\n    function apply(r,date){if(r&&isFinite(r)){rate=r;asOf=date;live=true;\n      try{localStorage.setItem(LS,JSON.stringify({rate:rate,date:asOf}));}catch(e){}show();}}\n    fetch(\"https://open.er-api.com/v6/latest/USD\").then(function(r){return r.json();}).then(function(d){\n      if(d&&d.rates&&d.rates.JPY){var dt=(d.time_last_update_utc||\"\").slice(5,16)||new Date().toISOString().slice(0,10);apply(d.rates.JPY,dt);}\n      else throw 0;\n    }).catch(function(){\n      fetch(\"https://api.frankfurter.dev/v1/latest?base=USD&symbols=JPY\").then(function(r){return r.json();}).then(function(d){\n        if(d&&d.rates&&d.rates.JPY)apply(d.rates.JPY,d.date);\n      }).catch(function(){});\n    });\n  }catch(e){}\n})();\n<\/script><\/body><\/html>"}, {"id": "konbini", "title": "Konbini", "kanji": "店", "sub": "Food, counter phrases & services", "text": "the convenience store is your basecamp konbini (コンビニ konbini) 7-eleven, familymart (ファミマ famima) , lawson (ローソン) are open 24/7, everywhere, and the food is genuinely good. you'll be in one daily: quick meals, a services hub, and a warm refuge on a cold nov dec day. what to actually eat not junk some of it is trip-highlight good. おにぎり onigiri rice balls cheap, fresh, endless fillings. the staple grab-and-go. 卵サンド tamago sando the legendary egg-salad sandwich a genuine rite of passage. おでん oden winter hot-pot bites by the register perfect for your dates. 肉まん nikuman steamed pork bun from the hot case hot, cheap, ideal on a cold night. コーヒー kōhī counter machine coffee, ~ 120 genuinely excellent. say the size and pour it yourself. the counter exchange what they'll ask 温めますか atatamemasu ka \"shall i heat it up?\" はい、お願いします (hai, onegaishimasu) or 大丈夫です (daijōbu desu , \"no thanks\"). 袋は要りますか fukuro wa irimasu ka \"need a bag?\" (a few yen now) お願いします or 要りません (irimasen) . お箸はお付けしますか o-hashi wa o-tsuke shimasu ka \"chopsticks with that?\" ( スプーン supūn = spoon) ポイントカードはお持ちですか pointo kādo wa o-mochi desu ka \"have a point card?\" just say 大丈夫です (daijōbu desu) . paying is easy: cash, card, or tap your suica . just tap and go for small stuff. the services that save your trip atm takes foreign cards which cards, fees, and habits are on the money payments sheet. takkyubin drop off or receive forwarded luggage see the takkyubin sheet for how. tickets bills the in-store machine (loppi / famiport) does event tickets and bill payments. the basics clean toilets (ask staff), free wifi, copy/print, umbrellas, phone chargers, socks. your chinese eye on the shelf 店 (ten/mise) is \"shop,\" same as chinese. the nicest hook: 肉まん (nikuman) is exactly your 肉包 a meat bun. 弁当 (bentō) is a boxed meal, and 温 (atatameru) \"to warm\" shares the 温 you already know. konbini convenience store 7-eleven seven eleven familymart lawson onigiri tamago sando egg sandwich oden nikuman pork bun coffee atatameru heat bag fukuro suica atm loppi famiport tickets", "section": "ground", "group": "Shopping & money", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; backg nter phrases & services<\/div><\/div><\/div>\n<h2>The convenience store is your basecamp<\/h2>\n<div class=\"concept\"><div class=\"big\">\n<b>Konbini<\/b> <span class=\"cjk\">(コンビニ<\/span> <span class=\"romaji\">konbini)<\/span> &mdash; 7-Eleven, <b>FamilyMart<\/b>\n<span class=\"cjk\">(ファミマ<\/span> <span class=\"romaji\">famima)<\/span>, <b>Lawson<\/b> <span class=\"cjk\">(ローソン)<\/span> &mdash; are open 24/7,\neverywhere, and the food is genuinely good. You'll be in one daily: quick meals, a services hub, and a warm refuge on a\ncold Nov&ndash;Dec day.\n<\/div><\/div>\n\n<h2>What to actually eat<\/h2>\n<div class=\"note\" style=\"margin-top:0\">Not junk &mdash; some of it is trip-highlight good.<\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:42%\"><span class=\"cjk exj\">おにぎり<\/span> <span class=\"exr\">onigiri<\/span><\/td><td class=\"exe\">Rice balls &mdash; cheap, fresh, endless fillings. The staple grab-and-go.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">卵サンド<\/span> <span class=\"exr\">tamago sando<\/span><\/td><td class=\"exe\">The legendary egg-salad sandwich &mdash; a genuine rite of passage.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おでん<\/span> <span class=\"exr\">oden<\/span><\/td><td class=\"exe\">Winter hot-pot bites by the register &mdash; perfect for your dates.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">肉まん<\/span> <span class=\"exr\">nikuman<\/span><\/td><td class=\"exe\">Steamed pork bun from the hot case &mdash; hot, cheap, ideal on a cold night.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">コーヒー<\/span> <span class=\"exr\">kōhī<\/span><\/td><td class=\"exe\">Counter machine coffee, ~&yen;120 &mdash; genuinely excellent. Say the size and pour it yourself.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>The counter exchange &mdash; what they'll ask<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">温めますか<\/span> <span class=\"exr\">atatamemasu ka<\/span><\/td><td class=\"exe\">\"Shall I heat it up?\" &rarr; <span class=\"cjk\">はい、お願いします<\/span> <span class=\"exr\">(hai, onegaishimasu)<\/span> or <span class=\"cjk\">大丈夫です<\/span> <span class=\"exr\">(daijōbu desu<\/span>, \"no thanks\").<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">袋は要りますか<\/span> <span class=\"exr\">fukuro wa irimasu ka<\/span><\/td><td class=\"exe\">\"Need a bag?\" (a few yen now) &rarr; <span class=\"cjk\">お願いします<\/span> or <span class=\"cjk\">要りません<\/span> <span class=\"exr\">(irimasen)<\/span>.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お箸はお付けしますか<\/span> <span class=\"exr\">o-hashi wa o-tsuke shimasu ka<\/span><\/td><td class=\"exe\">\"Chopsticks with that?\" (<span class=\"cjk\">スプーン<\/span> supūn = spoon)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ポイントカードはお持ちですか<\/span> <span class=\"exr\">pointo kādo wa o-mochi desu ka<\/span><\/td><td class=\"exe\">\"Have a point card?\" &mdash; just say <span class=\"cjk\">大丈夫です<\/span> <span class=\"exr\">(daijōbu desu)<\/span>.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\">Paying is easy: cash, card, or tap your <b>Suica<\/b>. Just tap and go for small stuff.<\/div>\n\n<h2>The services that save your trip<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\" class=\"fn\">ATM<\/td><td class=\"exe\">Takes foreign cards &mdash; which cards, fees, and habits are on the <b>Money &amp; Payments<\/b> sheet.<\/td><\/tr>\n    <tr><td class=\"fn\">Takkyubin<\/td><td class=\"exe\">Drop off or receive forwarded luggage &mdash; see the <b>Takkyubin<\/b> sheet for how.<\/td><\/tr>\n    <tr><td class=\"fn\">Tickets &amp; bills<\/td><td class=\"exe\">The in-store machine (Loppi / Famiport) does event tickets and bill payments.<\/td><\/tr>\n    <tr><td class=\"fn\">The basics<\/td><td class=\"exe\">Clean toilets (ask staff), free wifi, copy/print, umbrellas, phone chargers, socks.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"zhbox\"><div class=\"hd\">Your Chinese eye on the shelf<\/div>\n<span class=\"cjk\">店<\/span> <span class=\"romaji\">(ten/mise)<\/span> is \"shop,\" same as Chinese. The nicest hook:\n<span class=\"cjk\">肉まん<\/span> <span class=\"romaji\">(nikuman)<\/span> is exactly your <span class=\"cjk\">肉包<\/span> &mdash; a meat bun.\n<span class=\"cjk\">弁当<\/span> <span class=\"romaji\">(bentō)<\/span> is a boxed meal, and <span class=\"cjk\">温<\/span> <span class=\"romaji\">(atatameru)<\/span>\n&mdash; \"to warm\" &mdash; shares the <span class=\"cjk\">温<\/span> you already know.\n<\/div>\n<\/body><\/html>"}, {"id": "etiquette", "title": "Etiquette", "kanji": "礼", "sub": "Manners & faux pas vs China", "text": "the one principle everything flows from nearly all japanese public etiquette comes from a single idea: 迷惑をかけない (meiwaku o kakenai) don&#39;t be a bother to others. keep your impact on strangers near zero and you&#39;re 95% right. you already know 面子 (mianzi, face) from china japan is face-conscious too, but its public-conduct engine is meiwaku , plus 建前 / 本音 (tatemae / honne) : the polished public face vs. the private truth. read the room; harmony beats directness. china vs japan where your instincts diverge each card: the china line is the habit you may carry in; the japan line is what's expected there instead. volume in public china lively and loud is perfectly normal. japan keep it low near-silence on trains and in quiet cars. phone on transit china taking calls on the train is normal. japan no calls at all; set the phone to マナーモード (manā mōdo, silent). eating on the move china street-snacking while walking is common. japan 食べ歩き (tabearuki) is frowned on eat standing by the stall. greeting someone china handshakes are common. japan a bow or nod is the default; no handshakes or hugs. saying no china you can be fairly direct. japan refusals are indirect ちょっと… (chotto…) trailing off is the \"no.\" trash china public bins are easy to find. japan almost no public bins carry your trash until you're back at the hotel. at the table chopstick taboos never stand them upright in rice, and never pass food chopstick-to-chopstick both are funeral rites. (the upright one you know from china; the hand-to-hand pass is the big japanese one.) don&#39;t spear, wave, or point with them. slurping fine even a compliment for ramen and soba. go ahead. drinks pour for others, not yourself; hold your glass with both hands when poured for. wait for 乾杯 (kanpai) before the first sip. bookends いただきます (itadakimasu) before eating, ごちそうさまでした (gochisōsama deshita) after. paying no tipping. place cash on the little tray ( トレイ , torei) don&#39;t hand it to the cashier. out about trains quiet zone: no calls, low voices, give up priority seats, and let people off before you board. gestures beckon palm-down (palm-up waving reads as rude); point with an open hand, never a finger and never at a person. nose don&#39;t blow your nose in public or at the table step away. a mask when you&#39;re sick is courtesy, not alarm. sacred social shrine vs temple at a shinto shrine ( 神社 , jinja) prayer is 二礼二拍手一礼 (ni-rei ni-hakushu ichi-rei) bow twice, clap twice, bow once. at a buddhist temple ( お寺 , otera), hands together quietly do not clap. rinse hands at the 手水 (temizu) basin first. shoes off at homes, ryokan, tatami rooms, some restaurants and temple halls and never wear the toilet slippers back out. gifts numbers give and receive with both hands , a little modestly. avoid sets of 4 ( 死 , death) and 9 ( 苦 , suffering) you know 4 from china, but 9 is the flip: unlucky here, lucky there. phrases that smooth everything すみません sumimasen \"excuse me / sorry / thanks\" the universal lubricant 大丈夫です daijōbu desu \"i&#39;m fine / no thanks\" (your false-friend word, used well) 結構です kekkō desu a polite \"no thank you\" when declining ちょっと… chotto… trail it off to decline softly and read it the same way when you hear it more do's don'ts western reflexes to adjust don't jaywalk. locals wait for the walk signal even on an empty street at midnight crossing against the light marks you instantly. don't photograph people without asking and in kyoto's gion, never chase or photograph geiko maiko; some streets ban it outright, with fines. don't haggle. outside a flea market, prices are fixed and asking for a discount is awkward. don't tip leaving cash confuses or embarrasses staff. a sincere ありがとうございます is the tip. do carry cash. small restaurants, shrines, markets, and rural spots are still cash-only don't assume cards work. do bag your wet umbrella at the entrance stand (or use the umbrella locker) before entering a shop don't drip through the aisles. do let riders off before you board, and stand sin", "section": "ground", "group": "Culture & safety", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq .zh { font-size: 15px; }\n  .zhbox .note { flex: 1; font-size: 8.8px; color: var(--ink2); }\n  .zhbox .cap { font-size: 8.3px; color: var(--muted); margin-top: 6px; font-style: italic; }\n\n  .traps { display: flex; gap: 9px; }\n  .trap {\n    flex: 1; text-align: center; background: var(--card);\n    border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px;\n  }\n  .trap .k { font-size: 20px; font-weight: 700; color: var(--jp); }\n  .trap .say { font-size: 9px; margin-top: 2px; }\n  .trap .say b { color: var(--red); }\n  .trap .why { font-size: 7.8px; color: var(--muted); margin-top: 2px; }\n\n  footer {\n    margin-top: 12px; padding-top: 7px; border-top: 1px solid var(--line);\n    font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between;\n  }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d; --ink2: #2c3e5c; --red: #c1362f; --indigo: #3d5a80;\n    --paper: #faf8f3; --card: #ffffff; --line: #e4ddce; --muted: #6b7280;\n    --jp: #b5341f; --zh: #1f6f4a;\n  }\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { col
