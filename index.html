-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">早<\/div><div><h1>Quick Reference<\/h1><div class=\"st\">The ~20 essentials to learn cold<\/div><\/div><\/div>\n<div class=\"concept\"><div class=\"big\">\nThe ~20 that carry most of the trip. Learn these cold and everything else is upside. Full detail lives in the other sheets\n&mdash; this is the fast-access card.\n<\/div><\/div>\n<h2>Absolute essentials<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">すみません<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">excuse me / sorry / thanks<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お願いします<\/span> <span class=\"exr\">onegaishimasu<\/span><\/td><td class=\"exe\">please / I'd like this<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ありがとうございます<\/span> <span class=\"exr\">arigatō gozaimasu<\/span><\/td><td class=\"exe\">thank you<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">大丈夫です<\/span> <span class=\"exr\">daijōbu desu<\/span><\/td><td class=\"exe\">it's fine / no thanks<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">日本語が少しわかります<\/span> <span class=\"exr\">nihongo ga sukoshi wakarimasu<\/span><\/td><td class=\"exe\">I understand a little Japanese<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ゆっくりお願いします<\/span> <span class=\"exr\">yukkuri onegaishimasu<\/span><\/td><td class=\"exe\">slowly, please<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<h2>Ordering &amp; shopping<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">これください<\/span> <span class=\"exr\">kore kudasai<\/span><\/td><td class=\"exe\">this one, please (point)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おすすめは何ですか<\/span> <span class=\"exr\">osusume wa nan desu ka<\/span><\/td><td class=\"exe\">what do you recommend?<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">二人です<\/span> <span class=\"exr\">futari desu<\/span><\/td><td class=\"exe\">two people<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">生ビール一つ<\/span> <span class=\"exr\">nama bīru hitotsu<\/span><\/td><td class=\"exe\">one draft beer<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">いくらですか<\/span> <span class=\"exr\">ikura desu ka<\/span><\/td><td class=\"exe\">how much is it?<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お会計お願いします<\/span> <span class=\"exr\">okaikei onegaishimasu<\/span><\/td><td class=\"exe\">the check, please<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<h2>Getting around &amp; trouble<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">〜はどこですか<\/span> <span class=\"exr\">~ wa doko desu ka<\/span><\/td><td class=\"exe\">where is ~? (slot anything in)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">トイレはどこですか<\/span> <span class=\"exr\">toire wa doko desu ka<\/span><\/td><td class=\"exe\">where's the toilet?<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜に行きたいです<\/span> <span class=\"exr\">~ ni ikitai desu<\/span><\/td><td class=\"exe\">I want to go to ~ (show it written)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">助けてください<\/span> <span class=\"exr\">tasukete kudasai<\/span><\/td><td class=\"exe\">please help<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">救急車を呼んでください<\/span> <span class=\"exr\">kyūkyūsha o yonde kudasai<\/span><\/td><td class=\"exe\">call an ambulance &mdash; <b>119<\/b>; police <b>110<\/b><\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">Say the bookends at meals<\/div>\n<span class=\"cjk\">いただきます<\/span> <span class=\"romaji\">(itadakimasu)<\/span> before eating, <span class=\"cjk\">ごちそうさまでした<\/span>\n<span class=\"romaji\">(gochisōsama deshita)<\/span> after &mdash; warm, well-mannered, zero register risk.<\/div>\n<\/body><\/html>"}, {"id": "core", "title": "Core Survival & Greetings", "kanji": "挨", "sub": "Greetings, politeness, phone", "text": "core survival the non-negotiables if you learn nothing else, learn these. すみません alone carries half a trip it means \"excuse me,\" \"sorry,\" and \"hey, over here\" at once. kanji/kana first since you read it; romaji below. すみません sumimasen excuse me / sorry / thanks the swiss-army word ありがとうございます arigatō gozaimasu thank you (polite full form) お願いします onegaishimasu please / i'd like this attach to anything 大丈夫です daijōbu desu it's fine / i'm ok / no thanks はい / いいえ hai / iie yes / no (はい is closer to \"i hear you\") greetings by time of day おはようございます ohayō gozaimasu good morning (until ~10am) your ryokan greeting こんにちは konnichiwa hello (~10am 5pm) こんばんは konbanwa good evening (after dark) your yatai greeting はじめまして hajimemashite nice to meet you (first m play:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">挨<\/div><div><h1>Core Survival & Greetings<\/h1><div class=\"st\">Greetings, politeness, phone<\/div><\/div><\/div>\n<h2>Core survival &mdash; the non-negotiables<\/h2>\n<div class=\"concept\"><div class=\"big\">\nIf you learn nothing else, learn these. <span class=\"cjk jp\">すみません<\/span> alone carries half a trip &mdash; it means\n\"excuse me,\" \"sorry,\" and \"hey, over here\" at once. Kanji/kana first since you read it; romaji below.\n<\/div><\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">すみません<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">Excuse me / sorry / thanks &mdash; the Swiss-army word<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ありがとうございます<\/span> <span class=\"exr\">arigatō gozaimasu<\/span><\/td><td class=\"exe\">Thank you (polite full form)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お願いします<\/span> <span class=\"exr\">onegaishimasu<\/span><\/td><td class=\"exe\">Please / I'd like this &mdash; attach to anything<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">大丈夫です<\/span> <span class=\"exr\">daijōbu desu<\/span><\/td><td class=\"exe\">It's fine / I'm OK / no thanks<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">はい / いいえ<\/span> <span class=\"exr\">hai / iie<\/span><\/td><td class=\"exe\">Yes / no (はい is closer to \"I hear you\")<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Greetings by time of day<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">おはようございます<\/span> <span class=\"exr\">ohayō gozaimasu<\/span><\/td><td class=\"exe\">Good morning (until ~10am) &mdash; your ryokan greeting<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">こんにちは<\/span> <span class=\"exr\">konnichiwa<\/span><\/td><td class=\"exe\">Hello (~10am&ndash;5pm)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">こんばんは<\/span> <span class=\"exr\">konbanwa<\/span><\/td><td class=\"exe\">Good evening (after dark) &mdash; your yatai greeting<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">はじめまして<\/span> <span class=\"exr\">hajimemashite<\/span><\/td><td class=\"exe\">Nice to meet you (first meeting only)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おやすみなさい<\/span> <span class=\"exr\">oyasuminasai<\/span><\/td><td class=\"exe\">Goodnight<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>When you're lost in the conversation<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">英語は話せますか<\/span> <span class=\"exr\">eigo wa hanasemasu ka<\/span><\/td><td class=\"exe\">Do you speak English? &mdash; asking it in Japanese lands better<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">日本語が少しわかります<\/span> <span class=\"exr\">nihongo ga sukoshi wakarimasu<\/span><\/td><td class=\"exe\">I understand a little Japanese &mdash; shifts people into slower, simpler speech<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ゆっくりお願いします<\/span> <span class=\"exr\">yukkuri onegaishimasu<\/span><\/td><td class=\"exe\">Slowly, please &mdash; the highest-leverage request you can make<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">もう一度お願いします<\/span> <span class=\"exr\">mō ichido onegaishimasu<\/span><\/td><td class=\"exe\">One more time, please<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">わかりました / わかりません<\/span> <span class=\"exr\">wakarimashita / wakarimasen<\/span><\/td><td class=\"exe\">Got it / I don't understand<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>On the phone<\/h2>\n<div class=\"note\" style=\"margin-top:0\">Phone calls are the hardest mode &mdash; no gestures, no menu to point at. Prefer email, a booking site, or your hotel front desk for reservations. For the short practical calls, these do the job.<\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">もしもし<\/span> <span class=\"exr\">moshi moshi<\/span><\/td><td class=\"exe\">Hello &mdash; on the phone only, never in person<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">予約をお願いします<\/span> <span class=\"exr\">yoyaku o onegaishimasu<\/span><\/td><td class=\"exe\">I'd like to make a reservation<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">十二月三日、七時、二人です<\/span> <span class=\"exr\">jūni-gatsu mikka, shichi-ji, futari desu<\/span><\/td><td class=\"exe\">\"Dec 3rd, 7 o'clock, two people\" &mdash; the template; swap the numbers, write it out first<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">少し遅れます<\/span> <span class=\"exr\">sukoshi okuremasu<\/span><\/td><td class=\"exe\">I'll be a little late &mdash; the most useful call you'll make<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">キャンセルしたいです<\/span> <span class=\"exr\">kyanseru shitai desu<\/span><\/td><td class=\"exe\">I'd like to cancel &mdash; do call; no-shows are a big deal at small places<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/body><\/html>"}, {"id": "kana", "title": "Kana Starter", "kanji": "仮", "sub": "Read the script — hiragana & katakana", "text": "two scripts, same sounds japanese has two phonetic scripts for the same 46 sounds : hiragana (rounded native words grammar) and katakana (angular foreign/loan words). this is the reference ; to actually burn them in, use the kana practice tool next door flashcards, a quiz, and whole-word reading. recognition is the goal; you never need to handwrite them. hiragana あ a い i う u え e お o か ka き ki く ku け ke こ ko さ sa し shi す su せ se そ so た ta ち chi つ tsu て te と to な na に ni ぬ nu ね ne の no は ha ひ hi ふ fu へ he ほ ho ま ma み mi む mu め me も mo や ya ゆ yu よ yo ら ra り ri る ru れ re ろ ro わ wa を wo ん n katakana ア a イ i ウ u エ e オ o カ ka キ ki ク ku ケ ke コ ko サ sa シ shi ス su セ se ソ so タ ta チ chi ツ tsu テ te ト to ナ na ニ ni ヌ nu ネ ne ノ no ハ ha ヒ hi フ fu ヘ he ホ ho マ ma ミ mi ム mu メ me モ mo ヤ ya ユ yu ヨ yo ラ ra リ ri ル ru レ re ロ ro ワ wa ヲ wo ン n the look-alikes that trip everyone き / さ ki / sa same top; さ has one lower stroke, き has two. は / ほ ha / ho ほ has an extra horizontal bar up top. ぬ / め / わ / れ nu / me / wa / re the loop (or lack of it) at the tail is the tell. シ / ツ shi / tsu katakana: シ strokes sweep up (shallow), ツ come down (steep). ソ / ン so / n katakana: ソ stroke is vertical-ish, ン is more horizontal. sound these out the real unlock is joining kana into words. a few to read aloud then open kana practice → words for the full set. みず mi-zu water えき e-ki station たまご ta-ma-go egg コーヒー kō-hī coffee (katakana the ー just lengthens the vowel) コンビニ ko-n-bi-ni convenience store two marks that multiply the set a dakuten (゛) voices a kana: か ka が ga, は ha ば ba. a small ゃゅょ makes a combo: き + ゃ = きゃ kya. both are drillable in the practice tool under +dakuten and +combos .", "section": "lang", "group": "Reading the script", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: ss=\"kr\">hi<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">フ<\/span><span class=\"kr\">fu<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ヘ<\/span><span class=\"kr\">he<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ホ<\/span><span class=\"kr\">ho<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">マ<\/span><span class=\"kr\">ma<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ミ<\/span><span class=\"kr\">mi<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ム<\/span><span class=\"kr\">mu<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">メ<\/span><span class=\"kr\">me<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">モ<\/span><span class=\"kr\">mo<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ヤ<\/span><span class=\"kr\">ya<\/span><\/div><div class=\"kc empty\"><\/div><div class=\"kc\"><span class=\"kk cjk\">ユ<\/span><span class=\"kr\">yu<\/span><\/div><div class=\"kc empty\"><\/div><div class=\"kc\"><span class=\"kk cjk\">ヨ<\/span><span class=\"kr\">yo<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ラ<\/span><span class=\"kr\">ra<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">リ<\/span><span class=\"kr\">ri<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ル<\/span><span class=\"kr\">ru<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">レ<\/span><span class=\"kr\">re<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ロ<\/span><span class=\"kr\">ro<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ワ<\/span><span class=\"kr\">wa<\/span><\/div><div class=\"kc empty\"><\/div><div class=\"kc empty\"><\/div><div class=\"kc empty\"><\/div><div class=\"kc\"><span class=\"kk cjk\">ヲ<\/span><span class=\"kr\">wo<\/span><\/div><div class=\"kc\"><span class=\"kk cjk\">ン<\/span><span class=\"kr\">n<\/span><\/div><div class=\"kc empty\"><\/div><div class=\"kc empty\"><\/div><div class=\"kc empty\"><\/div><div class=\"kc empty\"><\/div><\/div>\n\n<h2>The look-alikes that trip everyone<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\"><span class=\"cjk exj\">き / さ<\/span> <span class=\"exr\">ki / sa<\/span><\/td><td class=\"exe\">Same top; さ has one lower stroke, き has two.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">は / ほ<\/span> <span class=\"exr\">ha / ho<\/span><\/td><td class=\"exe\">ほ has an extra horizontal bar up top.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ぬ / め / わ / れ<\/span> <span class=\"exr\">nu / me / wa / re<\/span><\/td><td class=\"exe\">The loop (or lack of it) at the tail is the tell.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">シ / ツ<\/span> <span class=\"exr\">shi / tsu<\/span><\/td><td class=\"exe\">Katakana: シ strokes sweep up (shallow), ツ come down (steep).<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ソ / ン<\/span> <span class=\"exr\">so / n<\/span><\/td><td class=\"exe\">Katakana: ソ stroke is vertical-ish, ン is more horizontal.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Sound these out<\/h2>\n<div class=\"note\" style=\"margin-top:0\">The real unlock is joining kana into words. A few to read aloud &mdash; then open <b>Kana Practice → Words<\/b> for the full set.<\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:40%\"><span class=\"cjk exj\">みず<\/span> <span class=\"exr\">mi-zu<\/span><\/td><td class=\"exe\">water<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">えき<\/span> <span class=\"exr\">e-ki<\/span><\/td><td class=\"exe\">station<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">たまご<\/span> <span class=\"exr\">ta-ma-go<\/span><\/td><td class=\"exe\">egg<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">コーヒー<\/span> <span class=\"exr\">kō-hī<\/span><\/td><td class=\"exe\">coffee (katakana &mdash; the ー just lengthens the vowel)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">コンビニ<\/span> <span class=\"exr\">ko-n-bi-ni<\/span><\/td><td class=\"exe\">convenience store<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">Two marks that multiply the set<\/div>\nA <b>dakuten<\/b> (゛) voices a kana: <span class=\"cjk\">か<\/span> ka &rarr; <span class=\"cjk\">が<\/span> ga, <span class=\"cjk\">は<\/span> ha &rarr;\n<span class=\"cjk\">ば<\/span> ba. A small <span class=\"cjk\">ゃゅょ<\/span> makes a combo: <span class=\"cjk\">き<\/span>+<span class=\"cjk\">ゃ<\/span> =\n<span class=\"cjk\">きゃ<\/span> kya. Both are drillable in the Practice tool under <b>+Dakuten<\/b> and <b>+Combos<\/b>.<\/div>\n<\/body><\/html>"}, {"id": "practice", "title": "Kana Practice", "kanji": "練", "sub": "Flashcards, quiz & word reading", "text": "kana practice drill the two scripts, then read whole words — progress saves on this phone kana practice flashcards quiz hiragana katakana dakuten combos words reading drill sound out study", "section": "lang", "group": "Reading the script", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  bo  \"kawa\", \"m\": \"river\", \"s\": \"h\"}, {\"w\": \"そら\", \"r\": \"sora\", \"m\": \"sky\", \"s\": \"h\"}, {\"w\": \"はな\", \"r\": \"hana\", \"m\": \"flower / nose\", \"s\": \"h\"}, {\"w\": \"くるま\", \"r\": \"kuruma\", \"m\": \"car\", \"s\": \"h\"}, {\"w\": \"でんしゃ\", \"r\": \"densha\", \"m\": \"train\", \"s\": \"h\"}, {\"w\": \"えき\", \"r\": \"eki\", \"m\": \"station\", \"s\": \"h\"}, {\"w\": \"みせ\", \"r\": \"mise\", \"m\": \"shop\", \"s\": \"h\"}, {\"w\": \"ほん\", \"r\": \"hon\", \"m\": \"book\", \"s\": \"h\"}, {\"w\": \"あさ\", \"r\": \"asa\", \"m\": \"morning\", \"s\": \"h\"}, {\"w\": \"よる\", \"r\": \"yoru\", \"m\": \"night\", \"s\": \"h\"}, {\"w\": \"あめ\", \"r\": \"ame\", \"m\": \"rain\", \"s\": \"h\"}, {\"w\": \"ゆき\", \"r\": \"yuki\", \"m\": \"snow\", \"s\": \"h\"}, {\"w\": \"たまご\", \"r\": \"tamago\", \"m\": \"egg\", \"s\": \"h\"}, {\"w\": \"さかな\", \"r\": \"sakana\", \"m\": \"fish\", \"s\": \"h\"}, {\"w\": \"にく\", \"r\": \"niku\", \"m\": \"meat\", \"s\": \"h\"}, {\"w\": \"ごはん\", \"r\": \"gohan\", \"m\": \"rice / meal\", \"s\": \"h\"}, {\"w\": \"おちゃ\", \"r\": \"ocha\", \"m\": \"tea\", \"s\": \"h\"}, {\"w\": \"ともだち\", \"r\": \"tomodachi\", \"m\": \"friend\", \"s\": \"h\"}, {\"w\": \"せんせい\", \"r\": \"sensei\", \"m\": \"teacher\", \"s\": \"h\"}, {\"w\": \"がっこう\", \"r\": \"gakkō\", \"m\": \"school\", \"s\": \"h\"}, {\"w\": \"でぐち\", \"r\": \"deguchi\", \"m\": \"exit\", \"s\": \"h\"}, {\"w\": \"いりぐち\", \"r\": \"iriguchi\", \"m\": \"entrance\", \"s\": \"h\"}, {\"w\": \"おかね\", \"r\": \"okane\", \"m\": \"money\", \"s\": \"h\"}, {\"w\": \"じかん\", \"r\": \"jikan\", \"m\": \"time\", \"s\": \"h\"}, {\"w\": \"きって\", \"r\": \"kitte\", \"m\": \"postage stamp\", \"s\": \"h\"}, {\"w\": \"て\", \"r\": \"te\", \"m\": \"hand\", \"s\": \"h\"}, {\"w\": \"コーヒー\", \"r\": \"kōhī\", \"m\": \"coffee\", \"s\": \"k\"}, {\"w\": \"ビール\", \"r\": \"bīru\", \"m\": \"beer\", \"s\": \"k\"}, {\"w\": \"パン\", \"r\": \"pan\", \"m\": \"bread\", \"s\": \"k\"}, {\"w\": \"テレビ\", \"r\": \"terebi\", \"m\": \"TV\", \"s\": \"k\"}, {\"w\": \"ホテル\", \"r\": \"hoteru\", \"m\": \"hotel\", \"s\": \"k\"}, {\"w\": \"タクシー\", \"r\": \"takushī\", \"m\": \"taxi\", \"s\": \"k\"}, {\"w\": \"カメラ\", \"r\": \"kamera\", \"m\": \"camera\", \"s\": \"k\"}, {\"w\": \"レストラン\", \"r\": \"resutoran\", \"m\": \"restaurant\", \"s\": \"k\"}, {\"w\": \"コンビニ\", \"r\": \"konbini\", \"m\": \"convenience store\", \"s\": \"k\"}, {\"w\": \"バス\", \"r\": \"basu\", \"m\": \"bus\", \"s\": \"k\"}, {\"w\": \"チケット\", \"r\": \"chiketto\", \"m\": \"ticket\", \"s\": \"k\"}, {\"w\": \"トイレ\", \"r\": \"toire\", \"m\": \"toilet\", \"s\": \"k\"}]}<\/script><script>\nvar K = JSON.parse(document.getElementById(\"kdata\").textContent);\nvar LS = \"jk_kana_v1\";\nfunction load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {best:0,miss:{}}; }catch(e){ return {best:0,miss:{}}; } }\nfunction save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }\nvar store = load();\n\nvar S = { mode:\"flash\", script:\"hira\", level:\"basic\", i:0, flipped:false, deck:[], score:0, streak:0, q:null };\n\nfunction pool(kind){ // kind 'H' or 'K'\n  var a = K[\"basic\"+kind].slice();\n  if(S.level===\"dak\"||S.level===\"combo\") a = a.concat(K[\"dak\"+kind]);\n  if(S.level===\"combo\") a = a.concat(K[\"combo\"+kind]);\n  return a;\n}\nfunction buildDeck(){\n  var d = [];\n  if(S.script===\"hira\"||S.script===\"both\") d = d.concat(pool(\"H\"));\n  if(S.script===\"kata\"||S.script===\"both\") d = d.concat(pool(\"K\"));\n  S.deck = d; S.i = 0; S.flipped = false;\n}\nfunction wordDeck(){\n  return K.words.filter(function(w){\n    if(S.script===\"hira\") return w.s===\"h\";\n    if(S.script===\"kata\") return w.s===\"k\";\n    return true;\n  });\n}\nfunction shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }\n\nfunction el(id){ return document.getElementById(id); }\nfunction seg(id, opts, cur, on){\n  var h = \"\";\n  opts.forEach(function(o){ h += '<button data-v=\"'+o[0]+'\"'+(o[0]===cur?' class=\"on\"':'')+'>'+o[1]+'<\/button>'; });\n  var c = el(id); c.innerHTML = h;\n  Array.prototype.forEach.call(c.querySelectorAll(\"button\"), function(b){\n    b.onclick = function(){ on(b.getAttribute(\"data-v\")); };\n  });\n}\n\nfunction renderControls(){\n  seg(\"modeseg\", [[\"flash\",\"Flashcards\"],[\"quiz\",\"Quiz\"],[\"words\",\"Words\"]], S.mode, function(v){ S.mode=v; start(); });\n  el(\"levelwrap\").style.display = (S.mode===\"words\") ? \"none\" : \"\";\n  seg(\"scriptseg\", [[\"hira\",\"Hiragana\"],[\"kata\",\"Katakana\"],[\"both\",\"Both\"]], S.script, function(v){ S.script=v; start(); });\n  seg(\"levelseg\", [[\"basic\",\"Basic\"],[\"dak\",\"+Dakuten\"],[\"combo\",\"+Combos\"]], S.level, function(v){ S.level=v; start(); });\n}\n\nfunction start(){\n  renderControls();\n  if(S.mode===\"words\"){ S.wdeck = shuffle(wordDeck()); S.i=0; S.flipped=false; renderWords(); }\n  else { buildDeck(); if(S.mode===\"flash\"){ shuffle(S.deck); renderFlash(); } else { S.score=0; S.streak=0; nextQuiz(); } }\n}\n\nfunction renderFlash(){\n  var d = S.deck[S.i];\n  el(\"stage\").innerHTML =\n    '<div class=\"card\" id=\"fc\"><div class=\"kana\">'+d.c+'<\/div>'\n    +'<div class=\"ro\">'+(S.flipped? d.r : \"&nbsp;\")+'<\/div>'\n    +'<div class=\"hint\">'+(S.flipped? \"tap for next\" : \"tap to reveal\")+'<\/div><\/div>'\n    +'<div class=\"row\"><button id=\"bak\">\\u2039 Back<\/button><button id=\"shuf\">Shuffle<\/button><button id=\"nxt\" class=\"primary\">Next \\u203A<\/button><\/div>'\n    +'<div class=\"counter\">'+(S.i+1)+' / '+S.deck.length+'<\/div>';\n  el(\"fc\").onclick = function(){ if(!S.flipped){ S.flipped=true; } else { adv(1); } renderFlash(); };\n  el(\"nxt\").onclick = function(){ adv(1); renderFlash(); };\n  el(\"shuf\").onclick = function(){ shuffle(S.deck); S.i=0; S.flipped=false; renderFlash(); };\n  el(\"bak\").onclick = function(){ adv(-1); renderFlash(); };\n}\nfunction adv(n){ S.i = (S.i + n + S.deck.length) % S.deck.length; S.flipped=false; }\n\nfunction pickWeighted(){\n  var w = S.deck.map(function(x){ return 1 + (store.miss[x.c]||0)*2; });\n  var sum = w.reduce(function(a,b){return a+b;},0);\n  var r = Math.random()*sum;\n  for(var i=0;i<w.length;i++){ r -= w[i]; if(r<=0) return S.deck[i]; }\n  return S.deck[S.deck.length-1];\n}\nfunction nextQuiz(){\n  S.q = pickWeighted();\n  var ans = S.q.r;\n  var others = [];\n  var seen = {}; seen[ans]=1;\n  var bag = shuffle(S.deck.slice());\n  for(var i=0;i<bag.length && others.length<3;i++){ var r=bag[i].r; if(!seen[r]){ seen[r]=1; others.push(r); } }\n  var choices = shuffle([ans].concat(others));\n  var h = '<div class=\"prompt\">'+S.q.c+'<\/div><div class=\"choices\">';\n  choices.forEach(function(c){ h += '<button data-r=\"'+c+'\">'+c+'<\/button>'; });\n  h += '<\/div><div class=\"scorebar\"><span>Score <b>'+S.score+'<\/b><\/span>'\n     +'<span>Streak <b>'+S.streak+'<\/b><\/span><span>Best <b>'+store.best+'<\/b><\/span><\/div>';\n  el(\"stage\").innerHTML = h;\n  Array.prototype.forEach.call(el(\"stage\").querySelectorAll(\".choices button\"), function(b){\n    b.onclick = function(){ answer(b, ans); };\n  });\n}\nfunction answer(btn, ans){\n  var chosen = btn.getAttribute(\"data-r\");\n  var all = el(\"stage\").querySelectorAll(\".choices button\");\n  Array.prototype.forEach.call(all, function(b){ b.onclick=null;\n    if(b.getAttribute(\"data-r\")===ans) b.className=\"correct\";\n  });\n  if(chosen===ans){ S.score++; S.streak++; if(S.streak>store.best){ store.best=S.streak; save(); } }\n  else { btn.className=\"wrong\"; S.streak=0; store.miss[S.q.c]=(store.miss[S.q.c]||0)+1; save(); }\n  setTimeout(nextQuiz, chosen===ans ? 550 : 950);\n}\n\nfunction renderWords(){\n  var d = S.wdeck[S.i];\n  el(\"stage\").innerHTML =\n    '<div class=\"card\" id=\"wc\"><div class=\"word\">'+d.w+'<\/div>'\n    +'<div class=\"ro\">'+(S.flipped? d.r : \"&nbsp;\")+'<\/div>'\n    +'<div class=\"mean\">'+(S.flipped? d.m : \"&nbsp;\")+'<\/div>'\n    +'<div class=\"hint\">'+(S.flipped? \"tap for next\" : \"sound it out, then tap\")+'<\/div><\/div>'\n    +'<div class=\"row\"><button id=\"bak\">\\u2039 Back<\/button><button id=\"shuf\">Shuffle<\/button><button id=\"nxt\" class=\"primary\">Next \\u203A<\/button><\/div>'\n    +'<div class=\"counter\">'+(S.i+1)+' / '+S.wdeck.length+'<\/div>';\n  el(\"wc\").onclick = function(){ if(!S.flipped){ S.flipped=true; } else { S.i=(S.i+1)%S.wdeck.length; S.flipped=false; } renderWords(); };\n  el(\"nxt\").onclick = function(){ S.i=(S.i+1)%S.wdeck.length; S.flipped=false; renderWords(); };\n  el(\"shuf\").onclick = function(){ S.wdeck=shuffle(S.wdeck); S.i=0; S.flipped=false; renderWords(); };\n  el(\"bak\").onclick = function(){ S.i=(S.i-1+S.wdeck.length)%S.wdeck.length; S.flipped=false; renderWords(); };\n}\n\nstart();\n<\/script><\/body><\/html>"}, {"id": "signs", "title": "Signs & Menu Kanji", "kanji": "漢", "sub": "Characters you already read", "text": "the characters you get free this is pure chinese payoff: you already read the meaning of nearly every character on a japanese sign or menu. all you&#39;re adding is the japanese reading (romaji below each) and, in a few cases, a meaning that drifted from chinese. skim it once before the trip and signs will simply parse themselves. getting around signs 入口 iriguchi entrance 出口 deguchi exit 押 osu push (door) 引 hiku pull (door) 駅 eki station 改札 kaisatsu ticket gate 切符 kippu ticket 乗換 norikae transfer お手洗い otearai toilet 男 / 女 otoko / onna men / women 湯 yu hot water / bath 危険 kiken danger 注意 chūi caution 禁煙 kin&#39;en no smoking 無料 / 有料 muryō / yūryō free / paid 営業中 eigyōchū open (for business) 準備中 junbichū not yet open 閉店 heiten closed 会計 / レジ kaikei / reji checkout / register 税込 zeikomi tax included on the menu proteins staples 肉 niku meat 牛 gyū beef 豚 buta pork 鶏 / 鳥 tori chicken 魚 sakana fish 海老 ebi shrimp 飯 / ご飯 gohan rice / meal 麺 men noodles 丼 don rice bowl 定食 teishoku set meal 卵 tamago egg 野菜 yasai veget kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">漢<\/div><div><h1>Signs & Menu Kanji<\/h1><div class=\"st\">Characters you already read<\/div><\/div><\/div>\n<h2>The characters you get free<\/h2>\n<div class=\"concept\"><div class=\"big\">\nThis is pure Chinese payoff: you already <b>read the meaning<\/b> of nearly every character on a Japanese sign or menu.\nAll you&#39;re adding is the Japanese reading (romaji below each) &mdash; and, in a few cases, a meaning that drifted from Chinese.\nSkim it once before the trip and signs will simply parse themselves.\n<\/div><\/div>\n\n<h2>Getting around &mdash; signs<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">入口<\/span> <span class=\"r\">iriguchi<\/span><span class=\"m\">entrance<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">出口<\/span> <span class=\"r\">deguchi<\/span><span class=\"m\">exit<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">押<\/span> <span class=\"r\">osu<\/span><span class=\"m\">push (door)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">引<\/span> <span class=\"r\">hiku<\/span><span class=\"m\">pull (door)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">駅<\/span> <span class=\"r\">eki<\/span><span class=\"m\">station<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">改札<\/span> <span class=\"r\">kaisatsu<\/span><span class=\"m\">ticket gate<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">切符<\/span> <span class=\"r\">kippu<\/span><span class=\"m\">ticket<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">乗換<\/span> <span class=\"r\">norikae<\/span><span class=\"m\">transfer<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">お手洗い<\/span> <span class=\"r\">otearai<\/span><span class=\"m\">toilet<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">男 / 女<\/span> <span class=\"r\">otoko / onna<\/span><span class=\"m\">men / women<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">湯<\/span> <span class=\"r\">yu<\/span><span class=\"m\">hot water / bath<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">危険<\/span> <span class=\"r\">kiken<\/span><span class=\"m\">danger<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">注意<\/span> <span class=\"r\">chūi<\/span><span class=\"m\">caution<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">禁煙<\/span> <span class=\"r\">kin&#39;en<\/span><span class=\"m\">no smoking<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">無料 / 有料<\/span> <span class=\"r\">muryō / yūryō<\/span><span class=\"m\">free / paid<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">営業中<\/span> <span class=\"r\">eigyōchū<\/span><span class=\"m\">open (for business)<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">準備中<\/span> <span class=\"r\">junbichū<\/span><span class=\"m\">not yet open<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">閉店<\/span> <span class=\"r\">heiten<\/span><span class=\"m\">closed<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">会計 / レジ<\/span> <span class=\"r\">kaikei / reji<\/span><span class=\"m\">checkout / register<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">税込<\/span> <span class=\"r\">zeikomi<\/span><span class=\"m\">tax included<\/span><\/div>\n<\/div>\n\n<h2>On the menu &mdash; proteins &amp; staples<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">肉<\/span> <span class=\"r\">niku<\/span><span class=\"m\">meat<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">牛<\/span> <span class=\"r\">gyū<\/span><span class=\"m\">beef<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">豚<\/span> <span class=\"r\">buta<\/span><span class=\"m\">pork<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">鶏 / 鳥<\/span> <span class=\"r\">tori<\/span><span class=\"m\">chicken<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">魚<\/span> <span class=\"r\">sakana<\/span><span class=\"m\">fish<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">海老<\/span> <span class=\"r\">ebi<\/span><span class=\"m\">shrimp<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">飯 / ご飯<\/span> <span class=\"r\">gohan<\/span><span class=\"m\">rice / meal<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">麺<\/span> <span class=\"r\">men<\/span><span class=\"m\">noodles<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">丼<\/span> <span class=\"r\">don<\/span><span class=\"m\">rice bowl<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">定食<\/span> <span class=\"r\">teishoku<\/span><span class=\"m\">set meal<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">卵<\/span> <span class=\"r\">tamago<\/span><span class=\"m\">egg<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">野菜<\/span> <span class=\"r\">yasai<\/span><span class=\"m\">vegetables<\/span><\/div>\n<\/div>\n\n<h2>On the menu &mdash; how it&#39;s cooked &amp; tastes<\/h2>\n<div class=\"kgrid\">\n  <div class=\"kcell\"><span class=\"k cjk\">焼<\/span> <span class=\"r\">yaki<\/span><span class=\"m\">grilled<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">揚<\/span> <span class=\"r\">age<\/span><span class=\"m\">deep-fried<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">煮<\/span> <span class=\"r\">ni<\/span><span class=\"m\">simmered<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">蒸<\/span> <span class=\"r\">mushi<\/span><span class=\"m\">steamed<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">刺身<\/span> <span class=\"r\">sashimi<\/span><span class=\"m\">raw sliced fish<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">生<\/span> <span class=\"r\">nama<\/span><span class=\"m\">raw / draft<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">辛 / 甘<\/span> <span class=\"r\">kara / ama<\/span><span class=\"m\">spicy / sweet<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">塩<\/span> <span class=\"r\">shio<\/span><span class=\"m\">salt<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">醤油<\/span> <span class=\"r\">shōyu<\/span><span class=\"m\">soy sauce<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">茶<\/span> <span class=\"r\">cha<\/span><span class=\"m\">tea<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">酒<\/span> <span class=\"r\">sake<\/span><span class=\"m\">alcohol / sake<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">飲み放題<\/span> <span class=\"r\">nomihōdai<\/span><span class=\"m\">all-you-can-drink<\/span><\/div>\n<\/div>\n<div class=\"note\"><b>Two that will trip a Chinese reader:<\/b> <span class=\"cjk jp\">湯<\/span> is \"hot water / a bath\" here, not soup; and\n<span class=\"cjk jp\">生<\/span> on a drinks menu means <i>draft beer<\/i>. See the false-friends sheet for the full set.<\/div>\n<\/body><\/html>"}, {"id": "falsefriends", "title": "False Friends", "kanji": "偽", "sub": "Same hanzi, different meaning", "text": "same hanzi, different meaning the trap that only a chinese speaker falls into: characters you know, meaning something else in japanese. your mandarin will confidently mislead you on these, so they&#39;re worth a deliberate look. left is the japanese word and what it actually means; right is what your chinese brain expects. japanese reading means in japanese what chinese expects 手紙 tegami a letter (mail) 手纸 = toilet paper 勉強 benkyō study 勉强 = reluctant / to force 床 yuka floor 床 = bed 湯 yu hot water / bath 汤 = soup 汽車 kisha (steam) train 汽车 = car (jp car = 車 kuruma) 走 hashiru to run 走 = to walk 娘 musume daughter 娘 = mother 高校 kōkō high school 高校 = university / college 先生 sensei teacher / doctor 先生 = mr. / husband 愛人 aijin lover / mistress 爱人 = spouse 老婆 rōba old woman 老婆 = wife 丈夫 jōbu sturdy / healthy 丈夫 = husband 大丈夫 daijōbu it&#39;s ok / no problem 大丈夫 = a manly man 新聞 shinbun newspaper 新闻 = news 怪我 kega an injury 怪我 = blame me 猪 inoshishi wild boar 猪 = pig (jp pig = 豚 buta) 麻雀 mājan mahjong 麻雀 = sparrow 得意 tokui good at / one&#39;s strong suit 得意 = pleased / smug the three most likely to embarrass you on the trip 手紙 (tegami) asking for \"letter\" at a table won&#39;t get you napkins; 床 (yuka) it&#39;s the floor , so \"on the 床\" is not where you sleep; 大丈夫 (daijōbu) the single most useful one to keep : \"i&#39;m fine / it&#39;s ok,\" your all-purpose polite deflection.", "section": "lang", "group": "Reading the script", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-ser \"width:34%\">Means in Japanese<\/th><th style=\"width:34%\">What Chinese expects<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"pt cjk\">手紙<\/td><td class=\"rd\">tegami<\/td><td class=\"fn\">a letter (mail)<\/td><td class=\"hook cjk\">手纸 = toilet paper<\/td><\/tr>\n    <tr><td class=\"pt cjk\">勉強<\/td><td class=\"rd\">benkyō<\/td><td class=\"fn\">study<\/td><td class=\"hook cjk\">勉强 = reluctant / to force<\/td><\/tr>\n    <tr><td class=\"pt cjk\">床<\/td><td class=\"rd\">yuka<\/td><td class=\"fn\">floor<\/td><td class=\"hook cjk\">床 = bed<\/td><\/tr>\n    <tr><td class=\"pt cjk\">湯<\/td><td class=\"rd\">yu<\/td><td class=\"fn\">hot water / bath<\/td><td class=\"hook cjk\">汤 = soup<\/td><\/tr>\n    <tr><td class=\"pt cjk\">汽車<\/td><td class=\"rd\">kisha<\/td><td class=\"fn\">(steam) train<\/td><td class=\"hook cjk\">汽车 = car &nbsp;<span class=\"dim\">(JP car = 車 kuruma)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">走<\/td><td class=\"rd\">hashiru<\/td><td class=\"fn\">to run<\/td><td class=\"hook cjk\">走 = to walk<\/td><\/tr>\n    <tr><td class=\"pt cjk\">娘<\/td><td class=\"rd\">musume<\/td><td class=\"fn\">daughter<\/td><td class=\"hook cjk\">娘 = mother<\/td><\/tr>\n    <tr><td class=\"pt cjk\">高校<\/td><td class=\"rd\">kōkō<\/td><td class=\"fn\">high school<\/td><td class=\"hook cjk\">高校 = university / college<\/td><\/tr>\n    <tr><td class=\"pt cjk\">先生<\/td><td class=\"rd\">sensei<\/td><td class=\"fn\">teacher / doctor<\/td><td class=\"hook cjk\">先生 = Mr. / husband<\/td><\/tr>\n    <tr><td class=\"pt cjk\">愛人<\/td><td class=\"rd\">aijin<\/td><td class=\"fn\">lover / mistress<\/td><td class=\"hook cjk\">爱人 = spouse<\/td><\/tr>\n    <tr><td class=\"pt cjk\">老婆<\/td><td class=\"rd\">rōba<\/td><td class=\"fn\">old woman<\/td><td class=\"hook cjk\">老婆 = wife<\/td><\/tr>\n    <tr><td class=\"pt cjk\">丈夫<\/td><td class=\"rd\">jōbu<\/td><td class=\"fn\">sturdy / healthy<\/td><td class=\"hook cjk\">丈夫 = husband<\/td><\/tr>\n    <tr><td class=\"pt cjk\">大丈夫<\/td><td class=\"rd\">daijōbu<\/td><td class=\"fn\">it&#39;s OK / no problem<\/td><td class=\"hook cjk\">大丈夫 = a manly man<\/td><\/tr>\n    <tr><td class=\"pt cjk\">新聞<\/td><td class=\"rd\">shinbun<\/td><td class=\"fn\">newspaper<\/td><td class=\"hook cjk\">新闻 = news<\/td><\/tr>\n    <tr><td class=\"pt cjk\">怪我<\/td><td class=\"rd\">kega<\/td><td class=\"fn\">an injury<\/td><td class=\"hook cjk\">怪我 = blame me<\/td><\/tr>\n    <tr><td class=\"pt cjk\">猪<\/td><td class=\"rd\">inoshishi<\/td><td class=\"fn\">wild boar<\/td><td class=\"hook cjk\">猪 = pig &nbsp;<span class=\"dim\">(JP pig = 豚 buta)<\/span><\/td><\/tr>\n    <tr><td class=\"pt cjk\">麻雀<\/td><td class=\"rd\">mājan<\/td><td class=\"fn\">mahjong<\/td><td class=\"hook cjk\">麻雀 = sparrow<\/td><\/tr>\n    <tr><td class=\"pt cjk\">得意<\/td><td class=\"rd\">tokui<\/td><td class=\"fn\">good at / one&#39;s strong suit<\/td><td class=\"hook cjk\">得意 = pleased / smug<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">The three most likely to embarrass you on the trip<\/div>\n<span class=\"cjk\">手紙<\/span> <span class=\"romaji\">(tegami)<\/span> &mdash; asking for \"letter\" at a table won&#39;t get you napkins; &nbsp;\n<span class=\"cjk\">床<\/span> <span class=\"romaji\">(yuka)<\/span> &mdash; it&#39;s the <i>floor<\/i>, so \"on the 床\" is not where you sleep; &nbsp;\n<span class=\"cjk\">大丈夫<\/span> <span class=\"romaji\">(daijōbu)<\/span> &mdash; the single most useful one to <i>keep<\/i>: \"I&#39;m fine / it&#39;s OK,\"\nyour all-purpose polite deflection.\n<\/div>\n<\/body><\/html>"}, {"id": "particles", "title": "Particles", "kanji": "助", "sub": "The tags that mark each noun's job", "text": "the one idea a particle is a little tag that comes after a noun and announces that noun's job in the sentence who's doing it, what it's done to, where, when. because the job is labeled, word order goes loose only the verb is fixed, always last . the particles do the work your word order used to do. chinese position does the work (like english) 我 吃 鱼 s v o. \"i eat fish.\" move the words, change the meaning. japanese tags do the work 私 は 魚 を 食べます watashi wa sakana o tabemasu s o v, verb last. what this buys you free word order. the role is glued to the noun, not its spot: 猫 が 魚 を 食べました = 魚 を 猫 が 食べました neko ga sakana o tabemashita = sakana o neko ga tabemashita both still mean the cat ate the fish . が marks the doer, を the done-to, wherever they sit. what's genuinely new for you: chinese marks subject and object by position , exactly like english it has no case tags. so は / が / を are the real new machinery. what's already familiar: a handful of particles line up almost one-to-one with characters you know (の = 的, か = 吗 ) see page 2. the workhorse particles particle reads its job example chinese hook は wa* topic \"as for \" 私 は 学生です watashi wa gakusei desu \"as for me, i'm a student.\" (no equivalent) が ga subject the doer, often new info 誰 が 来ましたか？ dare ga kimashita ka? \"who came?\" (no equivalent) を o* direct object 水 を 飲みます mizu o nomimasu \"drink water.\" (word order in 中文) に ni to / at destination, clock time, where something exists 東京 に 行きます tōkyō ni ikimasu \"go to tokyo.\" 家 に います (ie ni imasu) \"is at home.\" ≈ 到 / 在 (到东京) で de where an action happens; by means of 家 で 食べます ie de tabemasu \"eat at home.\" 電車 で (densha de) \"by train.\" ≈ 在 / 用 へ e* toward direction 東京 へ 行きます tōkyō e ikimasu \"head toward tokyo.\" ≈ 往 / 向 の no of / 's links noun to noun 私 の 本 watashi no hon \"my book.\" = 的 (我的书) と to and (full list) / with 猫 と 犬 neko to inu \"cats and dogs.\" 友達 と (tomodachi to) \"with a friend.\" ≈ 和 / 跟 も mo also / too 私 も 行きます watashi mo ikimasu \"i'll go too.\" = 也 から kara from / since / because 9時 から ku-ji kara \"from 9 o'clock.\" ≈ 从 / 因为 まで made until / as far as 駅 まで eki made \"as far as the station.\" ≈ 到 / 为止 か ka turns a statement into a yes/no question 学生です か gakusei desu ka \"are you a student?\" = 吗 * spelled with one kana but pronounced differently as a particle see the pronunciation traps on the next page. verbs are shown in the polite masu / desu register pimsleur drills; the plain forms (&#39;taberu&#39;, &#39;iku&#39;) come later the particles work identically in both. your unfair advantage particles you already know の = 的 私の本 (watashi no hon) = 我的书 \"my book.\" same job: hooks a modifier onto a noun. this one is a true equal, lean on it hard. か = 吗 学生ですか (gakusei desu ka) = 是学生吗？ tack it on the end, statement becomes a yes/no question. も = 也 私も (watashi mo) = 我也 \"me too.\" watch placement: も sits after the noun, 也 sits before the verb. と ≈ 和 / 跟 猫と犬 (neko to inu) = 猫和狗 (listing); 友達と (tomodachi to) = 跟朋友 (with someone). から ≈ 从 / 因为 3時から (san-ji kara) = 从三点 (from a point); also \"because,\" like 因为 at a clause's head. hooks, not exact equals each japanese particle stretches further than its chinese cousin, but these get you standing up fast. the two pairs everyone mixes up は wa vs が ga both sit near the \"subject,\" so this is the classic trap. rough rule that carries you far: new information takes が. the already-known topic takes は. 誰 が 来ましたか？ 田中さん が 来ました。 dare ga kimashita ka? tanaka-san ga kimashita. \"who came?\" tanaka's the new fact が. 田中さん は 学生です。 tanaka-san wa gakusei desu. tanaka's now known は: \"as for tanaka, he's a student.\" は also contrasts : \" this one, unlike others.\" real command comes from hearing thousands of correct examples the ear, not the rule. に ni vs で de both can translate as \"at,\" which is the whole confusion. the split is clean: に = where something is . で = where something happens . 家 に います (ie ni imasu) \"is at home.\" (existence) 家 で 食べます (ie de tabemasu) \"eats at home.\" (action) same trick for time means: に pins a cloc", "section": "lang", "group": "Grammar", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line xt-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq .zh { font-size: 15px; }\n  .zhbox .note { flex: 1; font-size: 8.8px; color: var(--ink2); }\n  .zhbox .cap { font-size: 8.3px; color: var(--muted); margin-top: 6px; font-style: italic; }\n\n  .traps { display: flex; gap: 9px; }\n  .trap {\n    flex: 1; text-align: center; backgro
