ground: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; }\n  .card h3 { font-size: 10.5px; color: var(--ink); margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11px; }\n  .card .eg .romaji { font-size: 8.3px; }\n\n  .order { background: var(--ink); color: #eef1f6; border-radius: 7px; padding: 10px 13px; }\n  .order .formula { font-size: 11px; margin-bottom: 6px; }\n  .order .formula .slot { background: #35507a; padding: 1px 6px; border-radius: 4px; color: #fff; }\n  .order .line { padding: 3px 0; border-bottom: 1px solid #2c3e5c; font-size: 9.4px; }\n  .order .line:last-child { border-bottom: none; }\n  .order .line .cjk { font-size: 12px; color: #fff; }\n  .order .line .romaji { color: #9fb4d4; }\n  .order .line .en { color: #cfd8e6; }\n\n  footer { margin-top: 11px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between; }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  :root {\n    --ink:#14213d; --ink2:#2c3e5c; --red:#c1362f; --indigo:#3d5a80;\n    --paper:#faf8f3; --card:#ffffff; --line:#e4ddce; --muted:#6b7280;\n    --jp:#b5341f; --zh:#1f6f4a;\n  }\n  html { font-family:'Helvetica Neue','DejaVu Sans','Noto Sans CJK JP',sans-serif; color:var(--ink); }\n  body { background:var(--paper); font-size:9.4px; line-height:1.45; }\n  .cjk { font-family:'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif; }\n  .jp { color:var(--jp); font-weight:600; }\n  .zh { color:var(--zh); font-weight:600; }\n  .romaji { font-style:italic; color:var(--muted); }\n  header { border-bottom:3px solid var(--ink); padding-bottom:9px; margin-bottom:12px;\n           display:flex; align-items:flex-end; justify-content:space-between; }\n  header .title h1 { font-size:20px; font-weight:800; letter-spacing:-0.4px; color:var(--ink); }\n  header .title .sub { font-size:9.6px; color:var(--red); font-weight:600; margin-top:2px; }\n  header .mark { text-align:right; font-size:8.5px; color:var(--muted); line-height:1.4; }\n  header .mark .kanji { font-size:25px; color:var(--red); font-weight:700; display:block; margin-bottom:2px; }\n  h2 { font-size:11.5px; color:var(--ink); font-weight:800; margin:12px 0 6px;\n       padding-left:8px; border-left:4px solid var(--red); text-transform:uppercase; letter-spacing:0.5px; }\n  h2:first-of-type { margin-top:0; }\n  .concept { background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">礼<\/div><div><h1>Etiquette<\/h1><div class=\"st\">Manners & faux pas vs China<\/div><\/div><\/div>\n<style>\n  h2 { margin: 8px 0 4px; }\n  td { padding: 3.5px 8px; }\n  .concept { padding: 8px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.4px; line-height: 1.45; }\n  .zhbox { margin: 5px 0; padding: 8px 12px; }\n  .note { margin-top: 4px; }\n  .cmp { border:1px solid var(--line); border-radius:8px; background:#fff; padding:7px 11px; margin:6px 0; }\n  .cmp .sit { font-weight:800; font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink); margin-bottom:4px; }\n  .cmp .cnrow { font-size:9.4px; color:var(--muted); padding:2px 0; }\n  .cmp .jprow { font-size:9.6px; color:var(--ink); padding:2px 0; }\n  .tagCN { display:inline-block; background:#ece7dd; color:#7a736a; font-weight:800; font-size:7.6px; letter-spacing:.04em;\n           border-radius:4px; padding:1px 6px; margin-right:7px; vertical-align:1px; }\n  .tagJP { display:inline-block; background:#C63A2F; color:#fff; font-weight:800; font-size:7.6px; letter-spacing:.04em;\n           border-radius:4px; padding:1px 6px; margin-right:7px; vertical-align:1px; }\n  .tagDO { display:inline-block; background:#1f6f4a; color:#fff; font-weight:800; font-size:7.6px; border-radius:4px;\n           padding:1px 7px; margin-right:7px; vertical-align:1px; }\n  .tagNO { display:inline-block; background:#C63A2F; color:#fff; font-weight:800; font-size:7.6px; border-radius:4px;\n           padding:1px 6px; margin-right:7px; vertical-align:1px; }\n<\/style>\n\n<h2>The one principle everything flows from<\/h2>\n<div class=\"concept\"><div class=\"big\">\nNearly all Japanese public etiquette comes from a single idea: <b><span class=\"cjk\">迷惑をかけない<\/span><\/b>\n<span class=\"romaji\">(meiwaku o kakenai)<\/span> &mdash; don&#39;t be a bother to others. Keep your impact on strangers near zero\nand you&#39;re 95% right. You already know <span class=\"cjk\">面子<\/span> <span class=\"romaji\">(mianzi, face)<\/span> from China &mdash;\nJapan is face-conscious too, but its public-conduct engine is <i>meiwaku<\/i>, plus <span class=\"cjk\">建前 / 本音<\/span>\n<span class=\"romaji\">(tatemae / honne)<\/span>: the polished public face vs. the private truth. Read the room; harmony beats directness.\n<\/div><\/div>\n\n<h2>China vs Japan &mdash; where your instincts diverge<\/h2>\n<div class=\"note\" style=\"margin:0 2px 6px\">Each card: the <span class=\"tagCN\">CHINA<\/span> line is the habit you may carry in; the <span class=\"tagJP\">JAPAN<\/span> line is what's expected there instead.<\/div>\n<div class=\"cmp\"><div class=\"sit\">Volume in public<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>Lively and loud is perfectly normal.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span>Keep it low &mdash; near-silence on trains and in quiet cars.<\/div><\/div>\n<div class=\"cmp\"><div class=\"sit\">Phone on transit<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>Taking calls on the train is normal.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span>No calls at all; set the phone to <span class=\"cjk\">マナーモード<\/span> (manā mōdo, silent).<\/div><\/div>\n<div class=\"cmp\"><div class=\"sit\">Eating on the move<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>Street-snacking while walking is common.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span><span class=\"cjk\">食べ歩き<\/span> (tabearuki) is frowned on &mdash; eat standing by the stall.<\/div><\/div>\n<div class=\"cmp\"><div class=\"sit\">Greeting someone<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>Handshakes are common.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span>A bow or nod is the default; no handshakes or hugs.<\/div><\/div>\n<div class=\"cmp\"><div class=\"sit\">Saying no<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>You can be fairly direct.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span>Refusals are indirect &mdash; <span class=\"cjk\">ちょっと…<\/span> (chotto…) trailing off <i>is<\/i> the \"no.\"<\/div><\/div>\n<div class=\"cmp\"><div class=\"sit\">Trash<\/div>\n  <div class=\"cnrow\"><span class=\"tagCN\">CHINA<\/span>Public bins are easy to find.<\/div>\n  <div class=\"jprow\"><span class=\"tagJP\">JAPAN<\/span>Almost no public bins &mdash; carry your trash until you're back at the hotel.<\/div><\/div>\n\n<h2>At the table<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Chopstick taboos<\/td><td class=\"exe\">Never stand them upright in rice, and never pass food <b>chopstick-to-chopstick<\/b> &mdash; both are funeral rites. (The upright one you know from China; the hand-to-hand pass is the big Japanese one.) Don&#39;t spear, wave, or point with them.<\/td><\/tr>\n    <tr><td class=\"fn\">Slurping<\/td><td class=\"exe\">Fine &mdash; even a compliment for ramen and soba. Go ahead.<\/td><\/tr>\n    <tr><td class=\"fn\">Drinks<\/td><td class=\"exe\">Pour for others, not yourself; hold your glass with both hands when poured for. Wait for <span class=\"cjk\">乾杯<\/span> (kanpai) before the first sip.<\/td><\/tr>\n    <tr><td class=\"fn\">Bookends<\/td><td class=\"exe\"><span class=\"cjk\">いただきます<\/span> (itadakimasu) before eating, <span class=\"cjk\">ごちそうさまでした<\/span> (gochisōsama deshita) after.<\/td><\/tr>\n    <tr><td class=\"fn\">Paying<\/td><td class=\"exe\"><b>No tipping.<\/b> Place cash on the little tray (<span class=\"cjk\">トレイ<\/span>, torei) &mdash; don&#39;t hand it to the cashier.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Out &amp; about<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Trains<\/td><td class=\"exe\">Quiet zone: no calls, low voices, give up priority seats, and let people off <i>before<\/i> you board.<\/td><\/tr>\n    <tr><td class=\"fn\">Gestures<\/td><td class=\"exe\">Beckon <b>palm-down<\/b> (palm-up waving reads as rude); point with an open hand, never a finger and never at a person.<\/td><\/tr>\n    <tr><td class=\"fn\">Nose<\/td><td class=\"exe\">Don&#39;t blow your nose in public or at the table &mdash; step away. A mask when you&#39;re sick is courtesy, not alarm.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Sacred &amp; social<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:32%\" class=\"fn\">Shrine vs temple<\/td><td class=\"exe\">At a Shinto shrine (<span class=\"cjk\">神社<\/span>, jinja) prayer is <span class=\"cjk\">二礼二拍手一礼<\/span> <span class=\"romaji\">(ni-rei ni-hakushu ichi-rei)<\/span> &mdash; bow twice, clap twice, bow once. At a Buddhist temple (<span class=\"cjk\">お寺<\/span>, otera), hands together quietly &mdash; <b>do not clap.<\/b> Rinse hands at the <span class=\"cjk\">手水<\/span> (temizu) basin first.<\/td><\/tr>\n    <tr><td class=\"fn\">Shoes<\/td><td class=\"exe\">Off at homes, ryokan, tatami rooms, some restaurants and temple halls &mdash; and never wear the toilet slippers back out.<\/td><\/tr>\n    <tr><td class=\"fn\">Gifts &amp; numbers<\/td><td class=\"exe\">Give and receive with <b>both hands<\/b>, a little modestly. Avoid sets of <b>4<\/b> (<span class=\"cjk\">死<\/span>, death) and <b>9<\/b> (<span class=\"cjk\">苦<\/span>, suffering) &mdash; you know 4 from China, but 9 is the flip: unlucky here, lucky there.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Phrases that smooth everything<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:34%\"><span class=\"cjk exj\">すみません<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">\"excuse me / sorry / thanks\" &mdash; the universal lubricant<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">大丈夫です<\/span> <span class=\"exr\">daijōbu desu<\/span><\/td><td class=\"exe\">\"I&#39;m fine / no thanks\" (your false-friend word, used well)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">結構です<\/span> <span class=\"exr\">kekkō desu<\/span><\/td><td class=\"exe\">a polite \"no thank you\" when declining<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ちょっと…<\/span> <span class=\"exr\">chotto…<\/span><\/td><td class=\"exe\">trail it off to decline softly &mdash; and read it the same way when you hear it<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>More do's &amp; don'ts &mdash; Western reflexes to adjust<\/h2>\n<table>\n  <tbody>\n    <tr><td class=\"exe\"><span class=\"tagNO\">DON'T<\/span>Jaywalk. Locals wait for the walk signal even on an empty street at midnight &mdash; crossing against the light marks you instantly.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagNO\">DON'T<\/span>Photograph people without asking &mdash; and in Kyoto's Gion, never chase or photograph geiko &amp; maiko; some streets ban it outright, with fines.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagNO\">DON'T<\/span>Haggle. Outside a flea market, prices are fixed and asking for a discount is awkward.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagNO\">DON'T<\/span>Tip &mdash; leaving cash confuses or embarrasses staff. A sincere <span class=\"cjk\">ありがとうございます<\/span> is the tip.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagDO\">DO<\/span>Carry cash. Small restaurants, shrines, markets, and rural spots are still cash-only &mdash; don't assume cards work.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagDO\">DO<\/span>Bag your wet umbrella at the entrance stand (or use the umbrella locker) before entering a shop &mdash; don't drip through the aisles.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagDO\">DO<\/span>Let riders off before you board, and stand single-file on one side of the escalator.<\/td><\/tr>\n    <tr><td class=\"exe\"><span class=\"tagDO\">DO<\/span>Hand money to the cashier on the little tray, and take change or a card back with both hands.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"zhbox\"><div class=\"hd\">The five to burn in &mdash; and the fallback<\/div>\n<b>1.<\/b> Keep quiet and no phone calls on trains &mdash; the #1 adjustment coming from China. &nbsp;\n<b>2.<\/b> Never chopsticks-upright, never pass food chopstick-to-chopstick. &nbsp;\n<b>3.<\/b> No tipping &mdash; use the tray. &nbsp;\n<b>4.<\/b> Don&#39;t clap at a Buddhist temple (clapping is for shrines). &nbsp;\n<b>5.<\/b> Read the soft no &mdash; <span class=\"cjk\">ちょっと<\/span> means no. &nbsp;\n<b>Fallback:<\/b> when unsure, pick the option that inconveniences others least. That instinct is right almost every time.\n<\/div>\n<\/body><\/html>"}, {"id": "emergency", "title": "Emergency & Medical", "kanji": "救", "sub": "Numbers, meds rules, pharmacy", "text": "the playbook japan is exceptionally safe, but the system differs from home in ways worth knowing cold: one number (119) covers both fire and ambulance , there&#39;s a triage line if you&#39;re unsure, you pay upfront for care, and medication rules are strict some common western drugs are outright banned. calls below are free from any phone , even with no sim. for an interpreter, say 英語をお願いします (eigo o onegaishimasu) and stay on the line. numbers to save now 110 police crime, theft, accidents. ( 警察 , keisatsu) 119 fire ambulance both on one number. say 救急 (kyūkyū) for ambulance, 火事です (kaji desu) for fire. #7119 \"do i need an ambulance?\" a nurse triages your symptoms. 24/7 in tokyo with english; coverage varies elsewhere. 118 coast guard emergencies at sea. #9110 police non-emergency advice line for lost items, safety questions (not urgent). 171 disaster message board record/check a voice message to tell family you&#39;re safe when phone lines jam. 050-3816-2787 jnto japan visitor hotline 24/7 in english / chinese / korean. your best \"what do i do now?\" line. (overseas: +81-50-3816-2787) 03-5285-8181 himawari (tokyo) finds clinics/hospitals with foreign-language support. 9:00 20:00. who does what the medical system クリニック / 診療所 kurinikku / shinryōjo clinic walk-in for minor issues (cold, minor injury). no gp-gatekeeper; just go. daytime hours. 病院 byōin hospital serious problems after-hours er. (note: hospital is 病院 here, not the chinese 医院 .) 薬局 yakkyoku pharmacy fills prescriptions ( 処方箋 , shohōsen). often closes early evening. ドラッグストア doraggu sutoa drugstore otc medicine ( 市販薬 , shihan&#39;yaku), longer hours (matsukiyo, don quijote). some meds are kept behind the counter. pay upfront. your home insurance won&#39;t bill japanese providers you pay the full cost on the spot, then claim on travel insurance. bring your passport , keep every receipt, and get travel medical cover before you fly. english is limited use himawari or the jnto hotline to find an english-friendly clinic. protocols that differ from home lost something go to a 交番 (kōban) the small neighborhood police boxes everywhere. japan&#39;s lost-and-found is remarkable; wallets and phones are routinely handed in. earthquakes install safety tips (official english push-alerts for quakes, tsunami, typhoons) and follow nhk world-japan. in a quake: drop, cover, hold on ; don&#39;t bolt outside; after shaking, open a door and avoid elevators. head to a marked 避難所 (hinanjo, evacuation site) if told to. ambulance cost transport itself is generally free (run by the fire department); you pay for treatment at the hospital. bringing medication check before you pack some common western medicines are illegal in japan a prescription does not exempt you. rules go by active ingredient , not brand. getting this wrong can mean confiscation, detention, or prosecution so verify every medication against japan&#39;s official list well before travel, and apply for a permit if needed. status examples what to do banned adderall, vyvanse / elvanse (amphetamine adhd meds); pseudoephedrine decongestants sudafed (original), actifed, vicks inhalers; cannabis / thc / most cbd. do not bring, even with a prescription no exceptions . leave at home; ask your doctor about a legal alternative. permit methylphenidate (ritalin, concerta); codeine , tramadol, morphine; benzodiazepines (diazepam, alprazolam) over 1 month; any injectable incl. insulin epipen over 1 month; any prescription med over a 1-month supply. get a yunyu kakunin-sho import certificate (formerly \"yakkan shoumei\") in advance and carry it with the meds at customs. usually ok acetaminophen (tylenol), ibuprofen (advil); most antidepressants (sertraline, escitalopram); insulin most heart meds within a 1-month supply. fine carry them in original packaging with your prescription . otc up to a 2-month supply, vitamins up to 4 months. the permit: download the yunyu kakunin-sho form from the mhlw website, attach your prescription + a doctor&#39;s let", "section": "ground", "group": "Culture & safety", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n rgin-top:2px; }\n  header .mark { text-align:right; font-size:8.5px; color:var(--muted); line-height:1.4; }\n  header .mark .kanji { font-size:25px; color:var(--red); font-weight:700; display:block; margin-bottom:2px; }\n  h2 { font-size:11.5px; color:var(--ink); font-weight:800; margin:12px 0 6px;\n       padding-left:8px; border-left:4px solid var(--red); text-transform:uppercase; letter-spacing:0.5px; }\n  h2:first-of-type { margin-top:0; }\n  .concept { background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">救<\/div><div><h1>Emergency & Medical<\/h1><div class=\"st\">Numbers, meds rules, pharmacy<\/div><\/div><\/div>\n<style>\n  h2 { margin: 9px 0 4px; }\n  td { padding: 3.5px 8px; }\n  .concept { padding: 8px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.4px; line-height: 1.45; }\n  .zhbox { margin: 5px 0; padding: 8px 12px; }\n  .num { font-size: 15px; font-weight: 800; color: var(--red); white-space: nowrap; }\n  .warn { background: #fdece8; border: 1px solid #e6a99e; border-left: 4px solid var(--red);\n          border-radius: 6px; padding: 9px 12px; margin: 5px 0; }\n  .warn .hd { font-weight: 800; color: var(--red); font-size: 10px; margin-bottom: 3px; }\n  .ban td { border-bottom: 1px solid var(--line); }\n  .tagB { color: #fff; background: var(--red); font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n  .tagP { color: #fff; background: #b8860b; font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n  .tagOK { color: #fff; background: var(--zh); font-weight: 700; font-size: 8px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }\n<\/style>\n\n<h2>The playbook<\/h2>\n<div class=\"concept\"><div class=\"big\">\nJapan is exceptionally safe, but the system differs from home in ways worth knowing cold: <b>one number (119) covers both\nfire and ambulance<\/b>, there&#39;s a triage line if you&#39;re unsure, you <b>pay upfront<\/b> for care, and <b>medication rules\nare strict<\/b> &mdash; some common Western drugs are outright banned. Calls below are <b>free from any phone<\/b>, even with no SIM.\nFor an interpreter, say <span class=\"cjk\">英語をお願いします<\/span> <span class=\"romaji\">(eigo o onegaishimasu)<\/span> and stay on the line.\n<\/div><\/div>\n\n<h2>Numbers to save now<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:20%\"><span class=\"num\">110<\/span><\/td><td class=\"exe\"><b>Police<\/b> &mdash; crime, theft, accidents. (<span class=\"cjk\">警察<\/span>, keisatsu)<\/td><\/tr>\n    <tr><td><span class=\"num\">119<\/span><\/td><td class=\"exe\"><b>Fire &amp; Ambulance<\/b> &mdash; both on one number. Say <span class=\"cjk\">救急<\/span> (kyūkyū) for ambulance, <span class=\"cjk\">火事です<\/span> (kaji desu) for fire.<\/td><\/tr>\n    <tr><td><span class=\"num\">#7119<\/span><\/td><td class=\"exe\"><b>\"Do I need an ambulance?\"<\/b> &mdash; a nurse triages your symptoms. 24/7 in Tokyo with English; coverage varies elsewhere.<\/td><\/tr>\n    <tr><td><span class=\"num\">118<\/span><\/td><td class=\"exe\"><b>Coast Guard<\/b> &mdash; emergencies at sea.<\/td><\/tr>\n    <tr><td><span class=\"num\">#9110<\/span><\/td><td class=\"exe\"><b>Police non-emergency<\/b> &mdash; advice line for lost items, safety questions (not urgent).<\/td><\/tr>\n    <tr><td><span class=\"num\">171<\/span><\/td><td class=\"exe\"><b>Disaster message board<\/b> &mdash; record/check a voice message to tell family you&#39;re safe when phone lines jam.<\/td><\/tr>\n    <tr><td><span class=\"num\">050-3816-2787<\/span><\/td><td class=\"exe\"><b>JNTO Japan Visitor Hotline<\/b> &mdash; 24/7 in English / Chinese / Korean. Your best \"what do I do now?\" line. (Overseas: +81-50-3816-2787)<\/td><\/tr>\n    <tr><td><span class=\"num\">03-5285-8181<\/span><\/td><td class=\"exe\"><b>HIMAWARI (Tokyo)<\/b> &mdash; finds clinics/hospitals with foreign-language support. 9:00&ndash;20:00.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Who does what &mdash; the medical system<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:30%\" class=\"fn\"><span class=\"cjk\">クリニック / 診療所<\/span> <span class=\"exr\">kurinikku / shinryōjo<\/span><\/td><td class=\"exe\"><b>Clinic<\/b> &mdash; walk-in for minor issues (cold, minor injury). No GP-gatekeeper; just go. Daytime hours.<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">病院<\/span> <span class=\"exr\">byōin<\/span><\/td><td class=\"exe\"><b>Hospital<\/b> &mdash; serious problems &amp; after-hours ER. (Note: hospital is <span class=\"cjk\">病院<\/span> here, not the Chinese <span class=\"cjk\">医院<\/span>.)<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">薬局<\/span> <span class=\"exr\">yakkyoku<\/span><\/td><td class=\"exe\"><b>Pharmacy<\/b> &mdash; fills prescriptions (<span class=\"cjk\">処方箋<\/span>, shohōsen). Often closes early evening.<\/td><\/tr>\n    <tr><td class=\"fn\"><span class=\"cjk\">ドラッグストア<\/span> <span class=\"exr\">doraggu sutoa<\/span><\/td><td class=\"exe\"><b>Drugstore<\/b> &mdash; OTC medicine (<span class=\"cjk\">市販薬<\/span>, shihan&#39;yaku), longer hours (Matsukiyo, Don Quijote). Some meds are kept behind the counter.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\" style=\"font-size:8.5px; color:var(--ink2);\"><b>Pay upfront.<\/b> Your home insurance won&#39;t bill Japanese providers &mdash; you pay the full cost on the spot, then claim on travel insurance. <b>Bring your passport<\/b>, keep every receipt, and get travel medical cover before you fly. English is limited &mdash; use HIMAWARI or the JNTO hotline to find an English-friendly clinic.<\/div>\n\n<h2>Protocols that differ from home<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:24%\" class=\"fn\">Lost something<\/td><td class=\"exe\">Go to a <span class=\"cjk\">交番<\/span> (kōban) &mdash; the small neighborhood police boxes everywhere. Japan&#39;s lost-and-found is remarkable; wallets and phones are routinely handed in.<\/td><\/tr>\n    <tr><td class=\"fn\">Earthquakes<\/td><td class=\"exe\">Install <b>Safety Tips<\/b> (official English push-alerts for quakes, tsunami, typhoons) and follow NHK WORLD-JAPAN. In a quake: <b>drop, cover, hold on<\/b>; don&#39;t bolt outside; after shaking, open a door and avoid elevators. Head to a marked <span class=\"cjk\">避難所<\/span> (hinanjo, evacuation site) if told to.<\/td><\/tr>\n    <tr><td class=\"fn\">Ambulance cost<\/td><td class=\"exe\">Transport itself is generally <b>free<\/b> (run by the fire department); you pay for treatment at the hospital.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"page-break\"><\/div>\n\n<h2>Bringing medication &mdash; check BEFORE you pack<\/h2>\n<div class=\"warn\"><div class=\"hd\">Some common Western medicines are illegal in Japan &mdash; a prescription does not exempt you.<\/div>\n<div style=\"font-size:9.2px;\">Rules go by <b>active ingredient<\/b>, not brand. Getting this wrong can mean confiscation, detention, or prosecution &mdash; so verify every medication against Japan&#39;s official list well before travel, and apply for a permit if needed.<\/div>\n<\/div>\n<table class=\"ban\">\n  <thead><tr><th style=\"width:16%\">Status<\/th><th style=\"width:46%\">Examples<\/th><th style=\"width:38%\">What to do<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td><span class=\"tagB\">BANNED<\/span><\/td>\n      <td class=\"exe\"><b>Adderall, Vyvanse / Elvanse<\/b> (amphetamine ADHD meds); <b>pseudoephedrine<\/b> decongestants &mdash; Sudafed (original), Actifed, Vicks inhalers; cannabis / THC / most CBD.<\/td>\n      <td class=\"exe\">Do not bring, even with a prescription &mdash; <b>no exceptions<\/b>. Leave at home; ask your doctor about a legal alternative.<\/td><\/tr>\n    <tr><td><span class=\"tagP\">PERMIT<\/span><\/td>\n      <td class=\"exe\"><b>Methylphenidate<\/b> (Ritalin, Concerta); <b>codeine<\/b>, tramadol, morphine; <b>benzodiazepines<\/b> (diazepam, alprazolam) over 1 month; any <b>injectable<\/b> incl. insulin &amp; EpiPen over 1 month; any prescription med over a 1-month supply.<\/td>\n      <td class=\"exe\">Get a <b>Yunyu Kakunin-sho<\/b> import certificate (formerly \"Yakkan Shoumei\") in advance and carry it with the meds at customs.<\/td><\/tr>\n    <tr><td><span class=\"tagOK\">USUALLY OK<\/span><\/td>\n      <td class=\"exe\">Acetaminophen (Tylenol), ibuprofen (Advil); most antidepressants (sertraline, escitalopram); insulin &amp; most heart meds within a 1-month supply.<\/td>\n      <td class=\"exe\">Fine &mdash; carry them in original packaging <b>with your prescription<\/b>. OTC up to a 2-month supply, vitamins up to 4 months.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\" style=\"font-size:8.6px; color:var(--ink2);\">\n<b>The permit:<\/b> download the Yunyu Kakunin-sho form from the MHLW website, attach your prescription + a doctor&#39;s letter (English is fine) + passport copy, and submit to the regional bureau <b>at least two weeks before<\/b> you fly. &nbsp;\n<b>Quick fix for decongestants:<\/b> swap pseudoephedrine Sudafed for <b>Sudafed PE<\/b> (phenylephrine), which is allowed. &nbsp;\nWhen unsure, the official <b>MHLW list<\/b> is the only always-current source &mdash; check the active ingredient there.<\/div>\n\n<h2>Emergency &amp; pharmacy phrases<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">助けて！<\/span> <span class=\"exr\">tasukete!<\/span><\/td><td class=\"exe\">\"Help!\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">救急車を呼んでください。<\/span> <span class=\"exr\">kyūkyūsha o yonde kudasai<\/span><\/td><td class=\"exe\">\"Please call an ambulance.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">病院に行きたいです。<\/span> <span class=\"exr\">byōin ni ikitai desu<\/span><\/td><td class=\"exe\">\"I want to go to a hospital.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜が痛いです。<\/span> <span class=\"exr\">~ ga itai desu<\/span><\/td><td class=\"exe\">\"My ~ hurts.\" (+ body part below)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">熱があります。<\/span> <span class=\"exr\">netsu ga arimasu<\/span><\/td><td class=\"exe\">\"I have a fever.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜アレルギーがあります。<\/span> <span class=\"exr\">~ arerugī ga arimasu<\/span><\/td><td class=\"exe\">\"I&#39;m allergic to ~.\" (critical before meds/food)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">この薬はありますか。<\/span> <span class=\"exr\">kono kusuri wa arimasu ka<\/span><\/td><td class=\"exe\">\"Do you have this medicine?\" (show the box/name)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Symptom &amp; body words<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">痛い<\/span> <span class=\"r\">itai<\/span><span class=\"m\">painful<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">頭<\/span> <span class=\"r\">atama<\/span><span class=\"m\">head<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">お腹<\/span> <span class=\"r\">onaka<\/span><span class=\"m\">stomach<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">熱<\/span> <span class=\"r\">netsu<\/span><span class=\"m\">fever<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">吐き気<\/span> <span class=\"r\">hakike<\/span><span class=\"m\">nausea<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">めまい<\/span> <span class=\"r\">memai<\/span><span class=\"m\">dizziness<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">怪我<\/span> <span class=\"r\">kega<\/span><span class=\"m\">injury<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">薬<\/span> <span class=\"r\">kusuri<\/span><span class=\"m\">medicine<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">病院<\/span> <span class=\"r\">byōin<\/span><span class=\"m\">hospital<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">気分が悪い<\/span> <span class=\"r\">kibun ga warui<\/span><span class=\"m\">feel unwell<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">アレルギー<\/span> <span class=\"r\">arerugī<\/span><span class=\"m\">allergy<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">保険<\/span> <span class=\"r\">hoken<\/span><span class=\"m\">insurance<\/span><\/div>\n<\/div>\n<div class=\"note\" style=\"font-size:8.4px; color:var(--muted);\"><span class=\"cjk\">怪我<\/span> (kega, injury) is a false friend &mdash; in Chinese those characters read \"blame me.\" Here it just means you&#39;re hurt.<\/div>\n<\/body><\/html>"}]}</script><script>
var DATA = JSON.parse(document.getElementById("appdata").textContent);
var SHEETS = DATA.sheets;
var byId = {}; SHEETS.forEach(function(s){ byId[s.id]=s; });
var NEWSET={}, CLDATE="";
(function(){ var cl=(DATA.changelog||[]); if(cl.length){ CLDATE=cl[0].date; cl[0].items.forEach(function(it){ if(it.to) NEWSET[it.to]=1; }); } })();
function loadSeen(){ try{ return JSON.parse(localStorage.getItem("jk_seen_v1"))||{}; }catch(e){ return {}; } }
var SEEN=loadSeen();
function isNew(id){ return !!NEWSET[id] && SEEN[id]!==CLDATE; }
function markSeen(id){ if(NEWSET[id] && SEEN[id]!==CLDATE){ SEEN[id]=CLDATE; try{ localStorage.setItem("jk_seen_v1",JSON.stringify(SEEN)); }catch(e){} } }
function sectionNew(sid){ for(var i=0;i<SHEETS.length;i++){ if(SHEETS[i].section===sid && isNew(SHEETS[i].id)) return true; } return false; }
var SECTIONS = [
  {id:"lang",  name:"Japanese Language", kj:"語", sub:"Learn & read — grammar, kana, numbers, phrases",
   groups:["Start here","Reading the script","Grammar","Numbers & time"]},
  {id:"ground",name:"On the Ground",     kj:"旅", sub:"The trip playbook — food, stays, transit, safety",
   groups:["Food & stays","Getting around","Shopping & money","Culture & safety"]}
];
var view = document.getElementById("view");
var bar = document.getElementById("bar");
var barTitle = document.getElementById("bartitle");
var backBtn = document.getElementById("back");
backBtn.onclick = function(){ if(history.length>1) history.back(); else go("#/"); };

function go(h){ location.hash = h; }
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function chev(){ return '<span class="chev">\u203A</span>'; }

function sheetCard(s){
  var dot = isNew(s.id) ? '<span class="newdot"></span>' : '';
  return '<a class="card" href="#/sheet/'+s.id+'"><span class="kj">'+s.kanji+'</span>'
    +'<span class="tx"><b>'+esc(s.title)+dot+'</b><span>'+esc(s.sub)+'</span></span>'+chev()+'</a>';
}
function countdownHTML(){
  return '<div class="countdown" id="cd"><div class="cd-lbl">Trip starts in</div>'
    +'<div class="cd-grid">'
    +'<div class="cd-cell"><span id="cd-d">\u2013</span><em>days</em></div>'
    +'<div class="cd-cell"><span id="cd-h">\u2013</span><em>hrs</em></div>'
    +'<div class="cd-cell"><span id="cd-m">\u2013</span><em>min</em></div>'
    +'<div class="cd-cell"><span id="cd-s">\u2013</span><em>sec</em></div>'
    +'</div></div>';
}
function updateCountdown(){
  var d=document.getElementById("cd-d"); if(!d) return;
  var diff=(DATA.trip_ms||0)-Date.now();
  if(diff<=0){ var b=document.getElementById("cd"); if(b){ b.innerHTML='<div class="cd-lbl">The trip is here</div><div class="cd-live">\u65C5 have an amazing time</div>'; } return; }
  var s=Math.floor(diff/1000);
  d.textContent=Math.floor(s/86400);
  document.getElementById("cd-h").textContent=Math.floor(s%86400/3600);
  document.getElementById("cd-m").textContent=Math.floor(s%3600/60);
  document.getElementById("cd-s").textContent=s%60;
}
function whatsNewHTML(){
  var cl=(DATA.changelog||[]); if(!cl.length) return "";
  function items(list){ return '<ul class="wn-list">'+list.map(function(it){
      return '<li class="wn-item"'+(it.to?' data-to="'+it.to+'"':'')+'><span>'+esc(it.text)+'</span>'+(it.to?'<span class="wn-go">\u203A</span>':'')+'</li>';
    }).join('')+'</ul>'; }
  var h='<div class="whatsnew"><div class="wn-hd">What\u2019s new<span class="wn-date">'+cl[0].date+'</span></div>';
  h+=items(cl[0].items);
  if(cl.length>1){
    h+='<button class="wn-more" id="wnmore">Show earlier updates</button><div id="wnold" style="display:none">';
    cl.slice(1).forEach(function(e){ h+='<div class="wn-old-date">'+e.date+'</div>'+items(e.items); });
    h+='</div>';
  }
  return h+'</div>';
}
function wireWhatsNew(){
  Array.prototype.forEach.call(document.querySelectorAll('.wn-item[data-to]'), function(li){
    li.onclick=function(){ go('#/sheet/'+li.getAttribute('data-to')); };
  });
  var mb=document.getElementById('wnmore');
  if(mb){ mb.onclick=function(){ var o=document.getElementById('wnold'); if(!o) return;
    var vis=o.style.display!=='none'; o.style.display=vis?'none':'block';
    mb.textContent=vis?'Show earlier updates':'Hide earlier updates'; }; }
}

function renderHome(){
  bar.classList.remove("showback");
  barTitle.textContent = "Japan Kit";
  var h = '<div class="wrap"><div class="hero"><div class="stamp serif">\u65C5</div>'
    +'<h1>Japan Kit</h1><p>Japanese reference &amp; trip playbook</p></div>';
  h += countdownHTML();
  h += '<div class="search"><input id="q" type="search" placeholder="Search sheets & terms\u2026" '
    +'autocomplete="off" autocorrect="off" autocapitalize="off"></div>';
  h += '<div id="results"></div>';
  h += '<div id="sections">';
  SECTIONS.forEach(function(sec){
    var n = SHEETS.filter(function(s){return s.section===sec.id;}).length;
    var sdot = sectionNew(sec.id) ? '<span class="newdot"></span>' : '';
    h += '<a class="card secfe" href="#/sec/'+sec.id+'"><span class="kj big serif">'+sec.kj+'</span>'
      +'<span class="tx"><b>'+sec.name+sdot+'</b><span>'+sec.sub+'</span>'
      +'<span class="count">'+n+' sheets</span></span>'+chev()+'</a>';
  });
  h += '</div>';
  h += whatsNewHTML();
  h += '<div class="foot">\u65C5 Japan Kit \u00B7 tap the share icon \u2192 Add to Home Screen \u00B7 works offline</div>';
  h += '</div>';
  view.innerHTML = h;
  var q = document.getElementById("q");
  q.oninput = function(){ runSearch(q.value); };
  wireWhatsNew();
  updateCountdown();
}

function runSearch(term){
  var res = document.getElementById("results");
  var secs = document.getElementById("sections");
  term = (term||"").trim().toLowerCase();
  if(!term){ res.innerHTML=""; secs.style.display=""; return; }
  secs.style.display="none";
  var hits = SHEETS.filter(function(s){
    return (s.title+" "+s.sub+" "+s.group).toLowerCase().indexOf(term)>=0
        || (s.text||"").indexOf(term)>=0;
  });
  if(!hits.length){ res.innerHTML='<div class="empty">No matches for \u201C'+esc(term)+'\u201D</div>'; return; }
  res.innerHTML = hits.map(sheetCard).join("");
}

function renderSection(id){
  var sec = SECTIONS.filter(function(s){return s.id===id;})[0];
  if(!sec){ go("#/"); return; }
  bar.classList.add("showback");
  barTitle.textContent = sec.name;
  var h = '<div class="wrap">';
  sec.groups.forEach(function(g){
    var items = SHEETS.filter(function(s){return s.section===id && s.group===g;});
    if(!items.length) return;
    h += '<div class="grouphd">'+esc(g)+'</div>';
    h += items.map(sheetCard).join("");
  });
  h += '</div>';
  view.innerHTML = h;
  window.scrollTo(0,0);
}

function renderSheet(id){
  var s = byId[id];
  if(!s){ go("#/"); return; }
  bar.classList.add("showback");
  barTitle.textContent = s.title;
  markSeen(id);
  view.innerHTML = '<iframe id="sf" class="sheetframe" title="'+esc(s.title)+'"></iframe>';
  var f = document.getElementById("sf");
  f.onload = function(){
    try{
      var d = f.contentWindow.document;
      var resize = function(){ f.style.height = (d.body.scrollHeight+24)+"px"; };
      resize(); setTimeout(resize,120); setTimeout(resize,400);
      if(f.contentWindow.matchMedia){
        var mq = f.contentWindow.matchMedia("(orientation:portrait)");
        (mq.addEventListener?mq.addEventListener.bind(mq,"change"):mq.addListener.bind(mq))(resize);
      }
    }catch(e){}
  };
  var base = location.href.replace(/[#?].*$/,"").replace(/[^/]*$/,"");
  f.srcdoc = s.doc.replace(/%BASE%/g, base);
  window.scrollTo(0,0);
}

function route(){
  var h = location.hash || "#/";
  var m;
  if((m = h.match(/^#\/sheet\/(.+)$/))) return renderSheet(m[1]);
  if((m = h.match(/^#\/sec\/(.+)$/)))  return renderSection(m[1]);
  return renderHome();
}
window.addEventListener("hashchange", route);
route();
setInterval(updateCountdown, 1000);

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script></body></html>
