background:var(--ink); color:#eef1f6; border-radius:7px; padding:10px 13px; margin-bottom:6px; }\n  .concept b { color:#ffd9a0; }\n  .concept .big { font-size:10px; line-height:1.5; }\n  .flip { background:#fff5ec; border:1px dashed var(--red); border-radius:6px; padding:8px 11px; margin:6px 0; font-size:9.3px; }\n  .flip .cjk { font-size:12px; }\n  table { width:100%; border-collapse:collapse; margin-top:4px; }\n  th { background:var(--ink2); color:#fff; text-align:left; padding:5px 8px; font-size:8px;\n       text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }\n  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }\n  tbody tr:nth-child(even) { background:#f4f1e9; }\n  .pt { font-size:14px; font-weight:700; color:var(--jp); white-space:nowrap; }\n  .rd { font-style:italic; color:var(--muted); font-size:8.6px; white-space:nowrap; }\n  .fn { font-weight:600; }\n  .exj { font-size:11px; }\n  .exr { font-style:italic; color:var(--muted); font-size:8.3px; }\n  .exe { font-size:8.5px; }\n  .hook { color:var(--zh); font-weight:700; white-space:nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n  .zhbox { background:#eef7f1; border:1px solid #bfe0cd; border-left:4px solid var(--zh);\n           border-radius:6px; padding:9px 12px; margin:6px 0; }\n  .zhbox .hd { font-weight:800; color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">数<\/div><div><h1>Numbers & Counters<\/h1><div class=\"st\">Two systems, counters, money<\/div><\/div><\/div>\n\n\n\n<h2>Two systems &mdash; and you already own one<\/h2>\n<div class=\"concept\">\n  <div class=\"big\">\n    Japanese runs <b>two parallel number sets<\/b>. The <b>Sino-Japanese<\/b> set was borrowed straight from Chinese &mdash;\n    same characters, similar sounds &mdash; and does almost all the heavy lifting (money, time, dates, counters). You read\n    it on sight. The <b>Native<\/b> set is indigenous, <b>only goes to ten<\/b>, ends in <span class=\"cjk jp\">〜つ<\/span>,\n    and handles casual counting of generic objects.\n  <\/div>\n<\/div>\n\n<div class=\"numwrap\">\n  <div class=\"numcard sino\">\n    <div class=\"cap\"><b>Sino-Japanese<\/b> &mdash; from Chinese, does everything structured<\/div>\n    <div class=\"ngrid\">\n      <div class=\"ncell\"><span class=\"g cjk\">一<\/span><span class=\"r\">ichi<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">二<\/span><span class=\"r\">ni<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">三<\/span><span class=\"r\">san<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">四<\/span><span class=\"r\">shi / <span class=\"alt\">yon<\/span><\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">五<\/span><span class=\"r\">go<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">六<\/span><span class=\"r\">roku<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">七<\/span><span class=\"r\">shichi / <span class=\"alt\">nana<\/span><\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">八<\/span><span class=\"r\">hachi<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">九<\/span><span class=\"r\">kyū / <span class=\"alt\">ku<\/span><\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">十<\/span><span class=\"r\">jū<\/span><\/div>\n    <\/div>\n    <div class=\"bigrow\">\n      <div class=\"ncell\"><span class=\"g cjk\">百<\/span><span class=\"r\">hyaku &middot; 100<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">千<\/span><span class=\"r\">sen &middot; 1,000<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">万<\/span><span class=\"r\">man &middot; 10,000<\/span><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"numcard native\">\n    <div class=\"cap\"><b>Native<\/b> &mdash; 1&ndash;10 only, casual generic counting<\/div>\n    <div class=\"ngrid\">\n      <div class=\"ncell\"><span class=\"g cjk\">一つ<\/span><span class=\"r\">hitotsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">二つ<\/span><span class=\"r\">futatsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">三つ<\/span><span class=\"r\">mittsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">四つ<\/span><span class=\"r\">yottsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">五つ<\/span><span class=\"r\">itsutsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">六つ<\/span><span class=\"r\">muttsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">七つ<\/span><span class=\"r\">nanatsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">八つ<\/span><span class=\"r\">yattsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">九つ<\/span><span class=\"r\">kokonotsu<\/span><\/div>\n      <div class=\"ncell\"><span class=\"g cjk\">十<\/span><span class=\"r\">tō<\/span><\/div>\n    <\/div>\n    <div style=\"font-size:8.4px; color:var(--ink2); margin-top:6px; line-height:1.4;\">\n      Eleven and up, everyone reverts to the Sino set. The <span class=\"cjk jp\">〜つ<\/span> ending <i>is<\/i> the generic\n      counter &mdash; when you don't know the right one, <span class=\"cjk\">二つ<\/span> <span class=\"romaji\">(futatsu)<\/span>\n      is your fallback. \"How many?\" = <span class=\"cjk\">幾つ<\/span> <span class=\"romaji\">(ikutsu)<\/span>.\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"zhbox\">\n  <div class=\"hd cjk\">Big numbers group by 万 (10,000) &mdash; your Chinese reflex, not English's<\/div>\n  Japanese <span class=\"cjk\">万<\/span> = Chinese <span class=\"cjk\">萬<\/span>: numbers chunk every <b>four<\/b> zeros, not three.\n  <div class=\"eg\"><span class=\"cjk\">三万五千<\/span> <span class=\"romaji\">(san-man go-sen)<\/span> = 35,000 &nbsp;&middot;&nbsp; <span class=\"cjk\">十万<\/span> <span class=\"romaji\">(jū-man)<\/span> = 100,000 &nbsp;&middot;&nbsp; <span class=\"cjk\">一万二千円<\/span> <span class=\"romaji\">(ichi-man ni-sen en)<\/span> = &yen;12,000<\/div>\n  You'll parse Japanese prices faster than any English speaker &mdash; the \"myriad\" grouping is already wired in.\n<\/div>\n\n<h2>The reading traps &mdash; 4, 7, 9, 0<\/h2>\n<table>\n  <thead><tr><th style=\"width:8%\">Digit<\/th><th style=\"width:24%\">Readings<\/th><th style=\"width:68%\">Why it flips &mdash; and the safe default<\/th><\/tr><\/thead>\n  <tbody>\n    <tr>\n      <td class=\"pt cjk\">四<\/td><td class=\"rd\">shi / <span style=\"color:var(--red)\">yon<\/span><\/td>\n      <td><i>shi<\/i> is a homophone of <span class=\"cjk\">死<\/span> \"death\" &mdash; the same <span class=\"cjk\">四/死<\/span> taboo you know from Chinese (<i>sì/sǐ<\/i>); buildings skip floor 4 in both countries. <b>Default to <i>yon<\/i>.<\/b><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">七<\/td><td class=\"rd\">shichi / <span style=\"color:var(--red)\">nana<\/span><\/td>\n      <td><i>shichi<\/i> is easily misheard as <i>ichi<\/i> (1), so <i>nana<\/i> is preferred for clarity. <b>Default to <i>nana<\/i>.<\/b><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">九<\/td><td class=\"rd\"><span style=\"color:var(--red)\">kyū<\/span> / ku<\/td>\n      <td><i>ku<\/i> sounds like <span class=\"cjk\">苦<\/span> \"suffering,\" so <b>Japan<\/b> reads 9 as unlucky &mdash; opposite of China, where <span class=\"cjk\">九<\/span> <i>jiǔ<\/i> is lucky. <b>Default to <i>kyū<\/i>.<\/b><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">〇<\/td><td class=\"rd\">zero / rei / maru<\/td>\n      <td><i>zero<\/i> in most everyday use; <i>rei<\/i> in formal/official contexts; <i>maru<\/i> (\"circle\") when reading out digits like phone numbers.<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<p style=\"font-size:8px;color:var(--muted);margin-top:4px\"><i>yon<\/i> and <i>nana<\/i> are actually native-set readings leaking into the Sino system &mdash; which is why counting aloud you'll hear the hybrid <i>&hellip; san, yon, go &hellip; roku, nana, hachi &hellip;<\/i><\/p>\n\n<!-- ===================== PAGE 2 ===================== -->\n<div class=\"page-break\"><\/div>\n\n<h2>Counters (助数詞) &mdash; like Chinese 量词<\/h2>\n<p style=\"font-size:9.3px; margin:0 2px 5px; color:var(--ink2);\">\n  Same principle you know from Chinese: a number can't touch a noun bare &mdash; you need a category-appropriate counter,\n  just as <span class=\"cjk\">三隻猫<\/span> needs <span class=\"cjk\">隻<\/span>. Readings are new; the concept is free.\n<\/p>\n<table>\n  <thead><tr>\n    <th style=\"width:8%\">Counter<\/th><th style=\"width:9%\">Reads<\/th><th style=\"width:24%\">Counts<\/th>\n    <th style=\"width:38%\">Example<\/th><th style=\"width:21%\">Chinese hook<\/th>\n  <\/tr><\/thead>\n  <tbody>\n    <tr>\n      <td class=\"pt cjk\">人<\/td><td class=\"rd\">nin<\/td><td class=\"fn\">People<\/td>\n      <td><span class=\"cjk exj\">三人<\/span> &middot; <span class=\"exr\">san-nin<\/span> <span class=\"exe\">\"three people\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 个 / 位<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">個<\/td><td class=\"rd\">ko<\/td><td class=\"fn\">Generic small objects &mdash; the fallback<\/td>\n      <td><span class=\"cjk exj\">りんごを五個<\/span> &middot; <span class=\"exr\">ringo o go-ko<\/span> <span class=\"exe\">\"five apples\"<\/span><\/td>\n      <td class=\"hook cjk\">= 個 / 个 <span class=\"dim\">(catch-all)<\/span><\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">枚<\/td><td class=\"rd\">mai<\/td><td class=\"fn\">Flat thin things (paper, tickets, plates)<\/td>\n      <td><span class=\"cjk exj\">切符を二枚<\/span> &middot; <span class=\"exr\">kippu o ni-mai<\/span> <span class=\"exe\">\"two tickets\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 張<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">本<\/td><td class=\"rd\">hon<\/td><td class=\"fn\">Long cylindrical things (bottles, pens)<\/td>\n      <td><span class=\"cjk exj\">ビールを二本<\/span> &middot; <span class=\"exr\">bīru o ni-hon<\/span> <span class=\"exe\">\"two beers (bottles)\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 支 / 根<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">杯<\/td><td class=\"rd\">hai<\/td><td class=\"fn\">Cupfuls / glassfuls (drinks on tap)<\/td>\n      <td><span class=\"cjk exj\">生ビールを二杯<\/span> &middot; <span class=\"exr\">nama-bīru o ni-hai<\/span> <span class=\"exe\">\"two drafts\"<\/span><\/td>\n      <td class=\"hook cjk\">= 杯<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">台<\/td><td class=\"rd\">dai<\/td><td class=\"fn\">Machines &amp; vehicles<\/td>\n      <td><span class=\"cjk exj\">車を一台<\/span> &middot; <span class=\"exr\">kuruma o ichi-dai<\/span> <span class=\"exe\">\"one car\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 台 / 輛<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">冊<\/td><td class=\"rd\">satsu<\/td><td class=\"fn\">Bound books &amp; magazines<\/td>\n      <td><span class=\"cjk exj\">本を三冊<\/span> &middot; <span class=\"exr\">hon o san-satsu<\/span> <span class=\"exe\">\"three books\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 本<\/td>\n    <\/tr>\n    <tr>\n      <td class=\"pt cjk\">匹<\/td><td class=\"rd\">hiki<\/td><td class=\"fn\">Small animals<\/td>\n      <td><span class=\"cjk exj\">猫を三匹<\/span> &middot; <span class=\"exr\">neko o san-biki<\/span> <span class=\"exe\">\"three cats\"<\/span><\/td>\n      <td class=\"hook cjk\">≈ 隻<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>The sound-change trap &mdash; counters mutate<\/h2>\n<p style=\"font-size:9.3px; margin:0 2px 4px; color:var(--ink2);\">\n  This one has <b>no Chinese equivalent<\/b> and it's the real work: the counter's consonant shifts with the number in\n  front of it. <span class=\"cjk\">本<\/span> (<i>hon<\/i>) is the classic offender &mdash; watch the <i>h &rarr; p / b<\/i>:\n<\/p>\n<div class=\"mutrow\">\n  <div class=\"mut hot\"><span class=\"n\">1<\/span><span class=\"v\">ippon<\/span><\/div>\n  <div class=\"mut\"><span class=\"n\">2<\/span><span class=\"v\">nihon<\/span><\/div>\n  <div class=\"mut hot\"><span class=\"n\">3<\/span><span class=\"v\">sanbon<\/span><\/div>\n  <div class=\"mut\"><span class=\"n\">4<\/span><span class=\"v\">yonhon<\/span><\/div>\n  <div class=\"mut\"><span class=\"n\">5<\/span><span class=\"v\">gohon<\/span><\/div>\n  <div class=\"mut hot\"><span class=\"n\">6<\/span><span class=\"v\">roppon<\/span><\/div>\n  <div class=\"mut\"><span class=\"n\">7<\/span><span class=\"v\">nanahon<\/span><\/div>\n  <div class=\"mut hot\"><span class=\"n\">8<\/span><span class=\"v\">happon<\/span><\/div>\n  <div class=\"mut\"><span class=\"n\">9<\/span><span class=\"v\">kyūhon<\/span><\/div>\n  <div class=\"mut hot\"><span class=\"n\">10<\/span><span class=\"v\">juppon<\/span><\/div>\n<\/div>\n<p style=\"font-size:8.6px; margin-top:5px; color:var(--ink2);\">\n  <span class=\"cjk jp\">匹<\/span> (<i>ippiki, nihiki, sanbiki&hellip;<\/i>), <span class=\"cjk jp\">杯<\/span> (<i>ippai, nihai, sanbai&hellip;<\/i>) and\n  <span class=\"cjk jp\">個<\/span> (<i>ikko, niko, sanko&hellip;<\/i>) mutate the same way &mdash; the <b>1, 6, 8, 10<\/b> slots are the usual\n  troublemakers. Clean counters that <b>never<\/b> mutate: <span class=\"cjk jp\">枚<\/span> (<i>mai<\/i>) and <span class=\"cjk jp\">台<\/span> (<i>dai<\/i>).\n  Recognize the meaning free; memorize the contortions.\n<\/p>\n\n<h2>Where the counter goes<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3>Default &mdash; <b>float it after the noun<\/b><\/h3>\n    <p style=\"font-size:9px;\">Unlike Chinese, the counter usually drifts <i>downstream<\/i>, near the verb. Noun keeps its particle; the number+counter floats free.<\/p>\n    <div class=\"eg\"><span class=\"cjk\">ビール<span class=\"jp\">を<\/span>二本ください。<\/span><br><span class=\"romaji\">bīru o ni-hon kudasai<\/span><br>\"Two beers, please.\"<\/div>\n    <div class=\"eg\"><span class=\"cjk\">猫<span class=\"jp\">を<\/span>三匹飼っています。<\/span><br><span class=\"romaji\">neko o san-biki katteimasu<\/span><br>\"I keep three cats.\"<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Alternative &mdash; <b>front it, Chinese-style<\/b><\/h3>\n    <p style=\"font-size:9px;\">Put it before the noun with <span class=\"cjk jp\">の<\/span> as glue &mdash; your exact Chinese word order. Correct, but reads a touch more formal / written.<\/p>\n    <div class=\"eg\"><span class=\"cjk\">三匹<span class=\"jp\">の<\/span>猫<\/span><br><span class=\"romaji\">san-biki no neko<\/span><br>\"three cats\"<\/div>\n    <div class=\"eg\"><span class=\"cjk\">二本<span class=\"jp\">の<\/span>ビール<\/span><br><span class=\"romaji\">ni-hon no bīru<\/span><br>\"two beers\"<\/div>\n  <\/div>\n<\/div>\n\n<h2>Ordering &mdash; for the trip<\/h2>\n<div class=\"order\">\n  <div class=\"formula\"><span class=\"slot cjk\">noun<\/span> <span class=\"cjk\">を<\/span> <span class=\"slot cjk\">number + counter<\/span> <span class=\"cjk\">お願いします<\/span> / <span class=\"cjk\">ください<\/span> &nbsp;<span style=\"color:#9fb4d4; font-style:italic;\">(o-negai-shimasu / kudasai)<\/span><\/div>\n  <div class=\"line\"><span class=\"cjk\">生ビールを二杯お願いします。<\/span> <span class=\"romaji\">nama-bīru o ni-hai onegaishimasu<\/span> &mdash; <span class=\"en\">\"Two drafts, please.\"<\/span><\/div>\n  <div class=\"line\"><span class=\"cjk\">切符を二枚ください。<\/span> <span class=\"romaji\">kippu o ni-mai kudasai<\/span> &mdash; <span class=\"en\">\"Two tickets, please.\"<\/span><\/div>\n  <div class=\"line\"><span class=\"cjk\">これを三つください。<\/span> <span class=\"romaji\">kore o mittsu kudasai<\/span> &mdash; <span class=\"en\">\"Three of these, please.\"<\/span> <span style=\"color:#9fb4d4;\">(generic 〜つ, point at it)<\/span><\/div>\n  <div class=\"line\"><span class=\"cjk\">生二つ！<\/span> <span class=\"romaji\">nama futatsu<\/span> &mdash; <span class=\"en\">\"Two drafts!\"<\/span> <span style=\"color:#9fb4d4;\">(casual &mdash; drop the noun &amp; particle, hold up fingers)<\/span><\/div>\n<\/div>\n<p style=\"font-size:8.4px; margin-top:5px; color:var(--ink2);\">\n  When what you're counting is obvious, drop the noun and just say the counter: <span class=\"cjk\">二本ください<\/span>\n  <span class=\"romaji\">(ni-hon kudasai)<\/span>, \"two, please.\" And <span class=\"cjk jp\">を<\/span> is safely dropped in casual\n  speech &mdash; but keep it in your polite register and you're never wrong.\n<\/p>\n\n\n\n<\/body><\/html>"}, {"id": "time", "title": "Time & Dates", "kanji": "時", "sub": "Clock, days, months", "text": "clock time 〜時 (hour) + 〜分 (minute) time builds straight on the numbers sheet: sino numbers + 時 (ji, o&#39;clock) and 分 (fun/pun, minutes) . a few hours read irregularly, and the minutes mutate exactly like the counters. 午前 (gozen) = am, 午後 (gogo) = pm, 半 (han) = half past. hours watch 4, 7, 9 1時 ichiji 2時 niji 3時 sanji 4時 yoji 5時 goji 6時 rokuji 7時 shichiji 8時 hachiji 9時 kuji 10時 jūji 11時 jūichiji 12時 jūniji. irregular: 4時 is yoji (not yonji), 9時 is kuji , 7時 is shichiji . minutes they mutate 1分 ippun 2分 nifun 3分 sanpun 4分 yonpun 5分 gofun 6分 roppun 10分 juppun 30分 sanjuppun = 半 han. same p / pp shifts as the counters 1, 6, 8, 10 are the troublemakers. ask: 今何時ですか。 (ima nan-ji desu ka) \"what time is it now?\" answer: 午後三時半です。 (gogo san-ji han desu) \"it&#39;s 3:30 pm.\" days of the week 曜日 (yōbi) 月 getsu mon 火 ka tue 水 sui wed 木 moku thu 金 kin fri 土 do sat 日曜日 (nichiyōbi) = sunday. each is the character + 曜日 : 月曜日 (getsuyōbi) monday, etc. chinese hook: these are the classical 七曜 planet names moon, fire, water, wood, metal, earth, sun the 日月火水木金土 ordering you&#39;ll recognize. months days of the month months just number + 月 1月 ichigatsu 12月 jūnigatsu. regular and easy. but three flip readings: 4月 shigatsu , 7月 shichigatsu , 9月 kugatsu here they use shi / shichi / ku , the opposite of the yon/nana/kyū you&#39;d expect. days 1 10 native readings 1日 tsuitachi 2日 futsuka 3日 mikka 4日 yokka 5日 itsuka 6日 muika 7日 nanoka 8日 yōka 9日 kokonoka 10日 tōka. from 11 on it&#39;s mostly number + nichi except 14日 jūyokka , 20日 hatsuka , 24日 nijūyokka . everyday anchors: 今日 (kyō) today 明日 (ashita) tomorrow 昨日 (kinō) yesterday 今 (ima) now. these are high-frequency irregulars learn them as whole words.", "section": "lang", "group": "Numbers & time", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq p .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">時<\/div><div><h1>Time & Dates<\/h1><div class=\"st\">Clock, days, months<\/div><\/div><\/div>\n<h2>Clock time &mdash; 〜時 (hour) + 〜分 (minute)<\/h2>\n<div class=\"concept\"><div class=\"big\">\nTime builds straight on the numbers sheet: Sino numbers + <span class=\"cjk jp\">時<\/span> <span class=\"romaji\">(ji, o&#39;clock)<\/span>\nand <span class=\"cjk jp\">分<\/span> <span class=\"romaji\">(fun/pun, minutes)<\/span>. A few hours read irregularly, and the minutes\nmutate exactly like the counters. <span class=\"cjk\">午前<\/span> <span class=\"romaji\">(gozen)<\/span> = AM,\n<span class=\"cjk\">午後<\/span> <span class=\"romaji\">(gogo)<\/span> = PM, <span class=\"cjk\">半<\/span> <span class=\"romaji\">(han)<\/span> = half past.\n<\/div><\/div>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3>Hours &mdash; watch 4, 7, 9<\/h3>\n    <div class=\"note\" style=\"margin-top:0\">\n    <span class=\"cjk\">1時<\/span> ichiji &middot; <span class=\"cjk\">2時<\/span> niji &middot; <span class=\"cjk\">3時<\/span> sanji &middot;\n    <span class=\"jp cjk\">4時 yoji<\/span> &middot; <span class=\"cjk\">5時<\/span> goji &middot; <span class=\"cjk\">6時<\/span> rokuji &middot;\n    <span class=\"cjk\">7時 shichiji<\/span> &middot; <span class=\"cjk\">8時<\/span> hachiji &middot; <span class=\"jp cjk\">9時 kuji<\/span> &middot;\n    <span class=\"cjk\">10時<\/span> jūji &middot; <span class=\"cjk\">11時<\/span> jūichiji &middot; <span class=\"cjk\">12時<\/span> jūniji.\n    <br><br><b>Irregular:<\/b> 4時 is <i>yoji<\/i> (not yonji), 9時 is <i>kuji<\/i>, 7時 is <i>shichiji<\/i>.<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Minutes &mdash; they mutate<\/h3>\n    <div class=\"note\" style=\"margin-top:0\">\n    <span class=\"cjk\">1分<\/span> ippun &middot; <span class=\"cjk\">2分<\/span> nifun &middot; <span class=\"cjk\">3分<\/span> sanpun &middot;\n    <span class=\"cjk\">4分<\/span> yonpun &middot; <span class=\"cjk\">5分<\/span> gofun &middot; <span class=\"cjk\">6分<\/span> roppun &middot;\n    <span class=\"cjk\">10分<\/span> juppun &middot; <span class=\"cjk\">30分<\/span> sanjuppun = <span class=\"cjk\">半<\/span> han.\n    <br><br>Same <i>p / pp<\/i> shifts as the counters &mdash; 1, 6, 8, 10 are the troublemakers.<\/div>\n  <\/div>\n<\/div>\n<div class=\"note\"><b>Ask:<\/b> <span class=\"cjk\">今何時ですか。<\/span> <span class=\"romaji\">(ima nan-ji desu ka)<\/span> \"What time is it now?\" &mdash;\n<b>answer:<\/b> <span class=\"cjk\">午後三時半です。<\/span> <span class=\"romaji\">(gogo san-ji han desu)<\/span> \"It&#39;s 3:30 PM.\"<\/div>\n\n<h2>Days of the week &mdash; 曜日 (yōbi)<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">月<\/span> <span class=\"r\">getsu<\/span><span class=\"m\">Mon<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">火<\/span> <span class=\"r\">ka<\/span><span class=\"m\">Tue<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">水<\/span> <span class=\"r\">sui<\/span><span class=\"m\">Wed<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">木<\/span> <span class=\"r\">moku<\/span><span class=\"m\">Thu<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">金<\/span> <span class=\"r\">kin<\/span><span class=\"m\">Fri<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">土<\/span> <span class=\"r\">do<\/span><span class=\"m\">Sat<\/span><\/div>\n<\/div>\n<div class=\"note\" style=\"margin-top:6px\"><span class=\"cjk\">日曜日<\/span> <span class=\"romaji\">(nichiyōbi)<\/span> = Sunday. Each is the character +\n<span class=\"cjk\">曜日<\/span>: <span class=\"cjk\">月曜日<\/span> <span class=\"romaji\">(getsuyōbi)<\/span> Monday, etc. <b>Chinese hook:<\/b> these are the\nclassical <span class=\"cjk\">七曜<\/span> planet names &mdash; moon, fire, water, wood, metal, earth, sun &mdash; the\n<span class=\"cjk\">日月火水木金土<\/span> ordering you&#39;ll recognize.<\/div>\n\n<h2>Months &amp; days of the month<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3>Months &mdash; just number + 月<\/h3>\n    <p style=\"font-size:9px\"><span class=\"cjk\">1月<\/span> ichigatsu &hellip; <span class=\"cjk\">12月<\/span> jūnigatsu. Regular and easy.<\/p>\n    <div class=\"note\" style=\"margin-top:0\"><b>But three flip readings:<\/b> <span class=\"cjk jp\">4月 shigatsu<\/span>,\n    <span class=\"cjk jp\">7月 shichigatsu<\/span>, <span class=\"cjk jp\">9月 kugatsu<\/span> &mdash; here they use <i>shi / shichi / ku<\/i>,\n    the <i>opposite<\/i> of the yon/nana/kyū you&#39;d expect.<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Days 1&ndash;10 &mdash; native readings<\/h3>\n    <div class=\"note\" style=\"margin-top:0\">\n    <span class=\"cjk\">1日<\/span> tsuitachi &middot; <span class=\"cjk\">2日<\/span> futsuka &middot; <span class=\"cjk\">3日<\/span> mikka &middot;\n    <span class=\"cjk\">4日<\/span> yokka &middot; <span class=\"cjk\">5日<\/span> itsuka &middot; <span class=\"cjk\">6日<\/span> muika &middot;\n    <span class=\"cjk\">7日<\/span> nanoka &middot; <span class=\"cjk\">8日<\/span> yōka &middot; <span class=\"cjk\">9日<\/span> kokonoka &middot;\n    <span class=\"cjk\">10日<\/span> tōka.\n    <br><br>From 11 on it&#39;s mostly number + <i>nichi<\/i> &mdash; except <span class=\"cjk jp\">14日 jūyokka<\/span>,\n    <span class=\"cjk jp\">20日 hatsuka<\/span>, <span class=\"cjk jp\">24日 nijūyokka<\/span>.<\/div>\n  <\/div>\n<\/div>\n<div class=\"note\"><b>Everyday anchors:<\/b> <span class=\"cjk\">今日<\/span> <span class=\"romaji\">(kyō)<\/span> today &middot;\n<span class=\"cjk\">明日<\/span> <span class=\"romaji\">(ashita)<\/span> tomorrow &middot; <span class=\"cjk\">昨日<\/span> <span class=\"romaji\">(kinō)<\/span> yesterday &middot;\n<span class=\"cjk\">今<\/span> <span class=\"romaji\">(ima)<\/span> now. These are high-frequency irregulars &mdash; learn them as whole words.<\/div>\n<\/body><\/html>"}, {"id": "restaurant", "title": "Restaurant & Izakaya", "kanji": "食", "sub": "Ordering, drinking, paying", "text": "the flow of a meal everything you need to walk into a small place like the one in midnight diner, order, drink, and pay in your polite register. staff will greet you with いらっしゃいませ (irasshaimase, \"welcome\") ; you don&#39;t answer it, just nod. from there it&#39;s a handful of set phrases. getting seated getting attention 二人です。 futari desu \"two people.\" (answer to 何名様 nan-mei-sama, \"how many?\") すみません。 sumimasen \"excuse me\" the all-purpose way to flag staff メニューをお願いします。 menyū o onegaishimasu \"menu, please.\" ordering おすすめは何ですか。 osusume wa nan desu ka \"what do you recommend?\" これをください。 kore o kudasai \"this one, please.\" (point at it or the menu) 生ビールを二杯お願いします。 nama-bīru o ni-hai onegaishimasu \"two draft beers, please.\" (counters sheet) これを三つください。 kore o mittsu kudasai \"three of these, please.\" 〜は食べられません。 ... wa taberaremasen \"i can&#39;t eat ~.\" (allergy / restriction) enjoying paying いただきます。 itadakimasu said before eating \"i gratefully receive\" おいしいです！ oishii desu \"it&#39;s delicious!\" ごちそうさまでした。 gochisōsama deshita said after finishing \"thank you for the meal\" お会計をお願いします。 okaikei o onegaishimasu \"the check, please.\" カードは使えますか。 kādo wa tsukaemasu ka \"can i use a card?\" (現金 genkin = cash) 別々でお願いします。 betsubetsu de onegaishimasu \"separately, please.\" (一緒 issho = together) three things to know before you sit down no tipping it&#39;s not done and can cause confusion; good service is standard. お通し (otōshi) at an izakaya a small dish arrives you didn&#39;t order; it&#39;s a seating charge, not a mistake. say the bookends いただきます before and ごちそうさまでした after read as warm and well-mannered, with zero register risk. ordering at a ticket machine (券売機) lots of ramen, gyudon and set-meal shops sell a meal ticket from a vending machine by the door you order before you sit. insert cash (some now take ic too), press your dish, take the ticket and change, and hand the ticket to the staff. when in doubt, the shop's signature bowl is usually the top-left button . 券売機 kenbaiki the ticket vending machine itself. 食券 shokken the meal ticket it prints hand it to the cook. これでお願いします kore de onegaishimasu \"this one, please.\" (handing over the ticket) hakata ramen, the local way: when your noodles run low, order 替え玉 (kaedama , a fresh noodle refill for ~ 150) 替え玉お願いします (kaedama onegaishimasu) . and they'll ask your noodle firmness (麺の硬さ men no katasa) : バリカタ (barikata , very firm) カタメ (katame , firm) 普通 (futsū , normal) やわ (yawa , soft). locals go バリカタで (barikata de) . yatai fukuoka's street stalls (屋台) yatai (屋台 yatai) are open-air stalls that set up in the evening around eight stools, cash only , elbow-to-elbow. sit at the counter, order a few things and a drink, and when it's busy don't camp. tenjin's yatai are less touristy than nakasu's your kind of night. 空いていますか aite imasu ka \"is there a seat free?\" これをください kore o kudasai \"this one, please.\" (point at what looks good) おすすめは何ですか osusume wa nan desu ka \"what do you recommend?\" お会計お願いします o-kaikei onegaishimasu \"the bill, please.\" typical yatai fare: ramen, oden, yakitori, gyoza. bring cash there are no cards out here. your chinese eye on the machine 券売機 reads straight through 券 ticket, 売 sell, 機 machine. and 替え玉 uses the 替 you know (to swap/replace) literally a \"swapped ball\" of noodles. 屋台 is your 屋 (roof/shop) + 台 (stand).", "section": "ground", "group": "Food & stays", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n    margin: 12mm 12mm 10mm 12mm;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d;\n    --ink2: #2c3e5c;\n    --red: #c1362f;\n    --indigo: #3d5a80;\n    --paper: #faf8f3;\n    --card: #ffffff;\n    --line: #e4ddce;\n    --muted: #6b7280;\n    --jp: #b5341f;\n    --zh: #1f6f4a;\n  }\n\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  /* ---- header ---- */\n  header {\n    border-bottom: 3px solid var(--ink);\n    padding-bottom: 9px;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n  }\n  header .title h1 {\n    font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink);\n  }\n  header .title .sub {\n    font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px;\n  }\n  header .mark {\n    text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4;\n  }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px;}\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800;\n    margin: 14px 0 7px; padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  /* ---- concept ---- */\n  .concept {\n    background: var(--ink); color: #eef1f6; border-radius: 7px;\n    padding: 11px 13px; margin-bottom: 6px;\n  }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10.5px; line-height: 1.55; }\n  .concept .cjk { color: #fff; }\n\n  .split { display: flex; gap: 9px; margin: 8px 0; }\n  .split .col {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 6px; padding: 9px 11px;\n  }\n  .split .col .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }\n  .split .col.zhcol { border-top: 3px solid var(--zh); }\n  .split .col.jpcol { border-top: 3px solid var(--jp); }\n  .split .ex { font-size: 13px; margin: 2px 0; }\n  .split .gl { font-size: 8.5px; color: var(--muted); }\n\n  .flip {\n    background: #fff5ec; border: 1px dashed var(--red); border-radius: 6px;\n    padding: 8px 11px; margin: 7px 0; font-size: 9.5px;\n  }\n  .flip .ex { font-size: 13px; }\n  .flip .arrow { color: var(--red); font-weight: 800; padding: 0 6px; }\n\n  /* ---- main table ---- */\n  table { width: 100%; border-collapse: collapse; margin-top: 4px; }\n  th {\n    background: var(--ink2); color: #fff; text-align: left;\n    padding: 5px 8px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;\n  }\n  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  tbody tr:nth-child(even) { background: #f4f1e9; }\n  .pt { font-size: 15px; font-weight: 700; color: var(--jp); white-space: nowrap; }\n  .rd { font-style: italic; color: var(--muted); font-size: 8.6px; white-space: nowrap; }\n  .fn { font-weight: 600; }\n  td .exj { font-size: 11.5px; }\n  td .exr { font-style: italic; color: var(--muted); font-size: 8.4px; }\n  td .exe { font-size: 8.6px; }\n  .hook { color: var(--zh); font-weight: 700; white-space: nowrap; }\n  .hook .dim { color:#9aa4ac; font-weight:400; }\n\n  /* ---- page 2 ---- */\n  .page-break { page-break-before: always; }\n\n  .cards2 { display: flex; gap: 9px; margin-bottom: 4px; }\n  .card {\n    flex: 1; background: var(--card); border: 1px solid var(--line);\n    border-radius: 7px; padding: 10px 12px;\n  }\n  .card h3 { font-size: 11px; color: var(--ink); margin-bottom: 5px; }\n  .card h3 .tag { color: var(--jp); }\n  .card p { margin-bottom: 4px; }\n  .card .eg { background: #f4f1e9; border-radius: 4px; padding: 4px 7px; margin: 4px 0; font-size: 9px; }\n  .card .eg .cjk { font-size: 11.5px; }\n\n  .zhbox {\n    background: #eef7f1; border: 1px solid #bfe0cd; border-left: 4px solid var(--zh);\n    border-radius: 6px; padding: 11px 13px; margin-bottom: 4px;\n  }\n  .zhbox .row { display: flex; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #cfe3d7; }\n  .zhbox .row:last-child { border-bottom: none; }\n  .zhbox .p { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--jp); }\n  .zhbox .eq { flex: 0 0 118px; font-size: 12px; }\n  .zhbox .eq .zh { font-size: 15px; }\n  .zhbox .note { flex: 1; font-size: 8.8px; color: var(--ink2); }\n  .zhbox .cap { font-size: 8.3px; color: var(--muted); margin-top: 6px; font-style: italic; }\n\n  .traps { display: flex; gap: 9px; }\n  .trap {\n    flex: 1; text-align: center; background: var(--card);\n    border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px;\n  }\n  .trap .k { font-size: 20px; font-weight: 700; color: var(--jp); }\n  .trap .say { font-size: 9px; margin-top: 2px; }\n  .trap .say b { color: var(--red); }\n  .trap .why { font-size: 7.8px; color: var(--muted); margin-top: 2px; }\n\n  footer {\n    margin-top: 12px; padding-top: 7px; border-top: 1px solid var(--line);\n    font-size: 7.8px; color: var(--muted); display: flex; justify-content: space-between;\n  }\n\n\n  @page { size: A4 portrait; margin: 12mm 12mm 10mm 12mm; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --ink: #14213d; --ink2: #2c3e5c; --red: #c1362f; --indigo: #3d5a80;\n    --paper: #faf8f3; --card: #ffffff; --line: #e4ddce; --muted: #6b7280;\n    --jp: #b5341f; --zh: #1f6f4a;\n  }\n  html { font-family: 'Helvetica Neue', 'DejaVu Sans', 'Noto Sans CJK JP', sans-serif; color: var(--ink); }\n  body { background: var(--paper); font-size: 9.4px; line-height: 1.45; }\n\n  .cjk { font-family: 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif; }\n  .jp { color: var(--jp); font-weight: 600; }\n  .zh { color: var(--zh); font-weight: 600; }\n  .romaji { font-style: italic; color: var(--muted); }\n\n  header {\n    border-bottom: 3px solid var(--ink); padding-bottom: 9px; margin-bottom: 12px;\n    display: flex; align-items: flex-end; justify-content: space-between;\n  }\n  header .title h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink); }\n  header .title .sub { font-size: 10px; color: var(--red); font-weight: 600; margin-top: 2px; }\n  header .mark { text-align: right; font-size: 8.5px; color: var(--muted); line-height: 1.4; }\n  header .mark .kanji { font-size: 26px; color: var(--red); font-weight: 700; display:block; margin-bottom:2px; }\n\n  h2 {\n    font-size: 12px; color: var(--ink); font-weight: 800; margin: 13px 0 6px;\n    padding-left: 8px; border-left: 4px solid var(--red);\n    text-transform: uppercase; letter-spacing: 0.5px;\n  }\n  h2:first-of-type { margin-top: 0; }\n\n  .concept { background: var(--ink); color: #eef1f6; border-radius: 7px; padding: 10px 13px; margin-bottom: 6px; }\n  .concept b { color: #ffd9a0; }\n  .concept .big { font-size: 10px; line-height: 1.5; }\n\n  /* number grids */\n  .numwrap { display: flex; gap: 9px; }\n  .numcard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }\n  .numcard.sino { border-top: 3px solid var(--zh); }\n  .numcard.native { border-top: 3px solid var(--jp); }\n  .numcard .cap { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }\n  .numcard .cap b { color: var(--ink); }\n  .ngrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px 6px; }\n  .ncell { text-align: center; padding: 3px 2px; background: #f4f1e9; border-radius: 4px; }\n  .ncell .g { font-size: 14px; font-weight: 700; color: var(--jp); }\n  .ncell .r { font-size: 8px; font-style: italic; color: var(--ink2); display: block; }\n  .ncell .alt { color: var(--red); }\n\n  .b  .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td, cept\"><div class=\"big\">\nEverything you need to walk into a small place like the one in Midnight Diner, order, drink, and pay &mdash; in your polite\nregister. Staff will greet you with <span class=\"cjk\">いらっしゃいませ<\/span> <span class=\"romaji\">(irasshaimase, \"welcome\")<\/span>;\nyou don&#39;t answer it, just nod. From there it&#39;s a handful of set phrases.\n<\/div><\/div>\n\n<h2>Getting seated &amp; getting attention<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">二人です。<\/span> <span class=\"exr\">futari desu<\/span><\/td><td class=\"exe\">\"Two people.\" (answer to 何名様 nan-mei-sama, \"how many?\")<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">すみません。<\/span> <span class=\"exr\">sumimasen<\/span><\/td><td class=\"exe\">\"Excuse me\" &mdash; the all-purpose way to flag staff<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">メニューをお願いします。<\/span> <span class=\"exr\">menyū o onegaishimasu<\/span><\/td><td class=\"exe\">\"Menu, please.\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Ordering<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">おすすめは何ですか。<\/span> <span class=\"exr\">osusume wa nan desu ka<\/span><\/td><td class=\"exe\">\"What do you recommend?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">これをください。<\/span> <span class=\"exr\">kore o kudasai<\/span><\/td><td class=\"exe\">\"This one, please.\" (point at it or the menu)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">生ビールを二杯お願いします。<\/span> <span class=\"exr\">nama-bīru o ni-hai onegaishimasu<\/span><\/td><td class=\"exe\">\"Two draft beers, please.\" (counters sheet)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">これを三つください。<\/span> <span class=\"exr\">kore o mittsu kudasai<\/span><\/td><td class=\"exe\">\"Three of these, please.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">〜は食べられません。<\/span> <span class=\"exr\">... wa taberaremasen<\/span><\/td><td class=\"exe\">\"I can&#39;t eat ~.\" (allergy / restriction)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Enjoying &amp; paying<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:44%\"><span class=\"cjk exj\">いただきます。<\/span> <span class=\"exr\">itadakimasu<\/span><\/td><td class=\"exe\">said before eating &mdash; \"I gratefully receive\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おいしいです！<\/span> <span class=\"exr\">oishii desu<\/span><\/td><td class=\"exe\">\"It&#39;s delicious!\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">ごちそうさまでした。<\/span> <span class=\"exr\">gochisōsama deshita<\/span><\/td><td class=\"exe\">said after finishing &mdash; \"thank you for the meal\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お会計をお願いします。<\/span> <span class=\"exr\">okaikei o onegaishimasu<\/span><\/td><td class=\"exe\">\"The check, please.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">カードは使えますか。<\/span> <span class=\"exr\">kādo wa tsukaemasu ka<\/span><\/td><td class=\"exe\">\"Can I use a card?\" (現金 genkin = cash)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">別々でお願いします。<\/span> <span class=\"exr\">betsubetsu de onegaishimasu<\/span><\/td><td class=\"exe\">\"Separately, please.\" (一緒 issho = together)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"zhbox\"><div class=\"hd\">Three things to know before you sit down<\/div>\n<b>No tipping<\/b> &mdash; it&#39;s not done and can cause confusion; good service is standard. &nbsp;\n<b>お通し<\/b> <span class=\"romaji\">(otōshi)<\/span> &mdash; at an izakaya a small dish arrives you didn&#39;t order; it&#39;s a\nseating charge, not a mistake. &nbsp; <b>Say the bookends<\/b> &mdash; <span class=\"cjk\">いただきます<\/span> before and\n<span class=\"cjk\">ごちそうさまでした<\/span> after read as warm and well-mannered, with zero register risk.\n<\/div>\n\n<h2>Ordering at a ticket machine (券売機)<\/h2>\n<div class=\"concept\"><div class=\"big\">\nLots of ramen, gyudon and set-meal shops sell a <b>meal ticket<\/b> from a vending machine by the door &mdash; you order\n<i>before<\/i> you sit. Insert cash (some now take IC too), press your dish, take the ticket and change, and hand the ticket to\nthe staff. When in doubt, the shop's signature bowl is usually the <b>top-left button<\/b>.\n<\/div><\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">券売機<\/span> <span class=\"exr\">kenbaiki<\/span><\/td><td class=\"exe\">The ticket vending machine itself.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">食券<\/span> <span class=\"exr\">shokken<\/span><\/td><td class=\"exe\">The meal ticket it prints &mdash; hand it to the cook.<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">これでお願いします<\/span> <span class=\"exr\">kore de onegaishimasu<\/span><\/td><td class=\"exe\">\"This one, please.\" (handing over the ticket)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\"><b>Hakata ramen, the local way:<\/b> when your noodles run low, order <span class=\"cjk\">替え玉<\/span>\n<span class=\"romaji\">(kaedama<\/span>, a fresh noodle refill for ~&yen;150) &mdash; <span class=\"cjk\">替え玉お願いします<\/span>\n<span class=\"romaji\">(kaedama onegaishimasu)<\/span>. And they'll ask your noodle firmness <span class=\"cjk\">(麺の硬さ<\/span>\n<span class=\"romaji\">men no katasa)<\/span>: <span class=\"cjk\">バリカタ<\/span> <span class=\"romaji\">(barikata<\/span>, very firm) &middot;\n<span class=\"cjk\">カタメ<\/span> <span class=\"romaji\">(katame<\/span>, firm) &middot; <span class=\"cjk\">普通<\/span> <span class=\"romaji\">(futsū<\/span>,\nnormal) &middot; <span class=\"cjk\">やわ<\/span> <span class=\"romaji\">(yawa<\/span>, soft). Locals go <span class=\"cjk\">バリカタで<\/span>\n<span class=\"romaji\">(barikata de)<\/span>.<\/div>\n\n<h2>Yatai &mdash; Fukuoka's street stalls (屋台)<\/h2>\n<div class=\"concept\"><div class=\"big\">\n<b>Yatai<\/b> <span class=\"cjk\">(屋台<\/span> <span class=\"romaji\">yatai)<\/span> are open-air stalls that set up in the evening &mdash;\naround eight stools, <b>cash only<\/b>, elbow-to-elbow. Sit at the counter, order a few things and a drink, and when it's busy\ndon't camp. Tenjin's yatai are less touristy than Nakasu's &mdash; your kind of night.\n<\/div><\/div>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">空いていますか<\/span> <span class=\"exr\">aite imasu ka<\/span><\/td><td class=\"exe\">\"Is there a seat free?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">これをください<\/span> <span class=\"exr\">kore o kudasai<\/span><\/td><td class=\"exe\">\"This one, please.\" (point at what looks good)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">おすすめは何ですか<\/span> <span class=\"exr\">osusume wa nan desu ka<\/span><\/td><td class=\"exe\">\"What do you recommend?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">お会計お願いします<\/span> <span class=\"exr\">o-kaikei onegaishimasu<\/span><\/td><td class=\"exe\">\"The bill, please.\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"note\">Typical yatai fare: ramen, oden, yakitori, gyoza. Bring <b>cash<\/b> &mdash; there are no cards out here.<\/div>\n\n<div class=\"zhbox\"><div class=\"hd\">Your Chinese eye on the machine<\/div>\n<span class=\"cjk\">券売機<\/span> reads straight through &mdash; <span class=\"cjk\">券<\/span> ticket, <span class=\"cjk\">売<\/span> sell,\n<span class=\"cjk\">機<\/span> machine. And <span class=\"cjk\">替え玉<\/span> uses the <span class=\"cjk\">替<\/span> you know (to swap/replace)\n&mdash; literally a \"swapped ball\" of noodles. <span class=\"cjk\">屋台<\/span> is your <span class=\"cjk\">屋<\/span> (roof/shop) + <span class=\"cjk\">台<\/span> (stand).\n<\/div>\n<\/body><\/html>"}, {"id": "ryokan", "title": "Ryokan & Onsen", "kanji": "旅", "sub": "Check-in, bath etiquette, customs", "text": "where this earns its keep at a business hotel or a big chain, check-in is transactional and staff usually have functional english you barely need this. a ryokan is the opposite: less english at traditional inns, and a stack of customs (shoes, tatami, yukata, the onsen wash-first rule, set meal times) where a wrong move is awkward in a way ordering dinner isn&#39;t. so this sheet is light on hotel phrases and heavy on ryokan onsen etiquette that&#39;s the part worth reading before you go. standard hotel check-in the quick set 予約しています。 yoyaku shite imasu \"i have a reservation.\" (+ your name) チェックインをお願いします。 chekku-in o onegaishimasu \"check-in, please.\" 朝食は何時ですか。 chōshoku wa nan-ji desu ka \"what time is breakfast?\" 荷物を預かってもらえますか。 nimotsu o azukatte moraemasu ka \"could you hold my luggage?\" チェックアウトは何時ですか。 chekkuauto wa nan-ji desu ka \"what time is check-out?\" ryokan customs what surprises first-timers thing word what to do shoes off 玄関 genkan remove shoes at the entrance step; switch to provided slippers. on 畳 (tatami) even slippers come off socks or bare feet only. the robe 浴衣 yukata provided; worn to dinner and around the inn. wrap left flap over right . tie with the 帯 (obi). bedding 布団 futon staff lay it out on the tatami while you&#39;re at dinner you don&#39;t do it yourself, and it&#39;s put away in the morning. dinner 懐石 kaiseki a multi-course set meal at a fixed time you choose at check-in. 夕食 (yūshoku) dinner, 朝食 (chōshoku) breakfast. curfew 門限 mongen some traditional inns lock up late at night check the hour if you&#39;re going out after dinner. onsen etiquette the rules that matter before you get in wash first, fully. sit at the 洗い場 (araiba) , soap and rinse completely, then enter. the bath is for soaking, never washing. no swimsuit you bathe nude. the small 手ぬぐい (tenugui) towel stays out of the water; rest it on your head or the ledge. which bath, and tattoos 男湯 (otoko-yu) = men&#39;s, 女湯 (onna-yu) = women&#39;s. read the curtain 湯 here is \"hot water,\" not soup (your false-friend trap). tattoos (タトゥー, tatū) are still barred at many onsen. check ahead, or ask for a 貸切風呂 (kashikiri-buro) a private, reservable bath. phrases you&#39;ll actually use 温泉はいつ入れますか。 onsen wa itsu hairemasu ka \"when can i use the onsen?\" 夕食は何時ですか。 yūshoku wa nan-ji desu ka \"what time is dinner?\" タトゥーがありますが、大丈夫ですか。 tatū ga arimasu ga, daijōbu desu ka \"i have a tattoo is it ok?\" 貸切風呂はありますか。 kashikiri-buro wa arimasu ka \"is there a private bath?\" アレルギーがあります。 arerugī ga arimasu \"i have an allergy.\" (tell them before kaiseki) signs you&#39;ll see 温泉 onsen hot spring 大浴場 daiyokujō large bath 露天風呂 rotenburo open-air bath 貸切 kashikiri private / reserved 空室 kūshitsu vacancy 満室 manshitsu full / no rooms the four \"don&#39;t get it wrong\" items yukata left-over-right right-over-left is only for dressing the dead. wash before the bath , towel out of the water. check tattoo policy before you undress, not after. no tipping at a ryokan a genuine ありがとうございます (arigatō gozaimasu) is the right currency, not cash.", "section": "ground", "group": "Food & stays", "doc": "<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>\n  :root{--paper:#FAF7F0;--ink:#1C1A17;--red:#C63A2F;--muted:#7A736A;--line:#E4DCCE;}\n  *{box-sizing:border-box;}\n  html{-webkit-text-size-adjust:100%;}\n  body{margin:0;background:var(--paper);color:var(--ink);\n    font-family:\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Zen Kaku Gothic New\",\"Noto Sans CJK JP\",\"Helvetica Neue\",system-ui,sans-serif;\n    line-height:1.5;-webkit-font-smoothing:antialiased;padding:14px 14px 60px;}\n  img,svg{max-width:100%;}\n  .sheettop{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  .sheettop .kj{flex:0 0 auto;width:44px;height:44px;border:2px solid var(--red);border-radius:7px;color:var(--red);\n    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\n    font-family:\"Hiragino Mincho ProN\",\"Zen Old Mincho\",\"Noto Serif CJK JP\",serif;}\n  .sheettop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;}\n  .sheettop .st{margin:2px 0 0;font-size:12px;color:var(--red);font-weight:600;}\n\n\n  @page {\n    size: A4 portrait;\n  color:var(--ink); font-size:9.5px; margin-bottom:3px; }\n  .zhbox .eg { font-size:9.2px; margin-top:3px; }\n  .zhbox .eg .cjk { font-size:11.5px; }\n  .cards2 { display:flex; gap:9px; }\n  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:9px 12px; }\n  .card h3 { font-size:10.5px; color:var(--ink); margin-bottom:4px; }\n  .card h3 .tag { color:var(--jp); }\n  .card p { font-size:9px; margin-bottom:4px; }\n  .card .eg { background:#f4f1e9; border-radius:4px; padding:4px 7px; margin:4px 0; font-size:9px; }\n  .card .eg .cjk { font-size:11px; }\n  .card .eg .romaji { font-size:8.3px; }\n  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }\n  .kcell { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:5px 6px; }\n  .kcell .k { font-size:15px; font-weight:700; color:var(--jp); }\n  .kcell .r { font-size:8px; font-style:italic; color:var(--muted); }\n  .kcell .m { font-size:8.6px; color:var(--ink); display:block; margin-top:1px; }\n  .kgrid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }\n  .mut { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 1px; }\n  .mut .n { font-size:8px; color:var(--muted); }\n  .mut .v { font-size:9px; font-weight:700; color:var(--jp); }\n  .mut.hot { background:#fdece8; border-color:#f0b3a8; }\n  .note { font-size:8.5px; color:var(--ink2); margin-top:5px; line-height:1.4; }\n  .page-break { page-break-before:always; }\n  footer { margin-top:11px; padding-top:7px; border-top:1px solid var(--line); font-size:7.8px;\n           color:var(--muted); display:flex; justify-content:space-between; }\n\n\n  /* scale the print-tuned type up for phones */\n  body{font-size:15px;}\n  h2{font-size:15px !important;margin:18px 0 8px !important;}\n  .concept .big{font-size:15px !important;line-height:1.5 !important;}\n  .exj{font-size:17px !important;} .exr{font-size:13px !important;} .exe{font-size:14px !important;}\n  .pt{font-size:20px !important;} .rd{font-size:13px !important;} .fn{font-size:14.5px;}\n  td,th{padding:8px 10px;} .note{font-size:13px !important;} .hook{font-size:14px !important;}\n  .num{font-size:19px !important;}\n  .kcell .k{font-size:20px !important;} .kcell .r{font-size:12px !important;} .kcell .m{font-size:13px !important;}\n  .ncell .g{font-size:19px !important;} .ncell .r{font-size:12px !important;}\n  .mut .v{font-size:12px !important;} .mut .n{font-size:11px !important;}\n  .tagB,.tagP,.tagOK{font-size:11px !important;}\n  /* etiquette compare-cards */\n  .cmp .sit{font-size:12px !important;} .cmp .cnrow{font-size:14px !important;} .cmp .jprow{font-size:14.5px !important;}\n  .tagCN,.tagJP,.tagDO,.tagNO{font-size:10.5px !important;}\n  /* kana reference grid */\n  .kc .kk{font-size:23px !important;} .kc .kr{font-size:11.5px !important;}\n  /* restack multi-column pieces */\n  .cards2{flex-direction:column !important;gap:10px !important;}\n  .split{flex-direction:column !important;}\n  .numwrap{flex-direction:column !important;}\n  .traps{flex-direction:column !important;}\n  .kgrid{grid-template-columns:repeat(2,1fr) !important;}\n  .kgrid6{grid-template-columns:repeat(2,1fr) !important;}\n  .ngrid{grid-template-columns:repeat(5,1fr) !important;}\n  .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  .page-break{display:none !important;}\n  /* tables become stacked cards */\n  @media (max-width:640px){\n    table,thead,tbody,tr,td,th{display:block;width:100% !important;}\n    thead{display:none;}\n    tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 8px;padding:4px 2px;}\n    tbody tr:nth-child(even){background:#F7F2E9;}\n    td{border:none !important;padding:5px 12px !important;}\n    td.a,td.b,td.c{width:100% !important;}\n    .mutrow{grid-template-columns:repeat(5,1fr) !important;}\n  }\n<\/style><\/head><body><div class=\"sheettop\"><div class=\"kj\">旅<\/div><div><h1>Ryokan & Onsen<\/h1><div class=\"st\">Check-in, bath etiquette, customs<\/div><\/div><\/div>\n<style>\n  h2 { margin: 8px 0 4px; }\n  td { padding: 3.5px 8px; }\n  .concept { padding: 8px 13px; margin-bottom: 4px; }\n  .concept .big { font-size: 9.5px; line-height: 1.45; }\n  .card { padding: 8px 11px; }\n  .card p { margin-bottom: 3px; }\n  .zhbox { margin: 5px 0; }\n<\/style>\n<h2>Where this earns its keep<\/h2>\n<div class=\"concept\"><div class=\"big\">\nAt a business hotel or a big chain, check-in is transactional and staff usually have functional English &mdash; you barely\nneed this. A <b>ryokan<\/b> is the opposite: less English at traditional inns, and a stack of <b>customs<\/b> (shoes, tatami,\nyukata, the onsen wash-first rule, set meal times) where a wrong move is awkward in a way ordering dinner isn&#39;t. So this\nsheet is light on hotel phrases and heavy on ryokan &amp; onsen etiquette &mdash; that&#39;s the part worth reading before you go.\n<\/div><\/div>\n\n<h2>Standard hotel check-in &mdash; the quick set<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:46%\"><span class=\"cjk exj\">予約しています。<\/span> <span class=\"exr\">yoyaku shite imasu<\/span><\/td><td class=\"exe\">\"I have a reservation.\" (+ your name)<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">チェックインをお願いします。<\/span> <span class=\"exr\">chekku-in o onegaishimasu<\/span><\/td><td class=\"exe\">\"Check-in, please.\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">朝食は何時ですか。<\/span> <span class=\"exr\">chōshoku wa nan-ji desu ka<\/span><\/td><td class=\"exe\">\"What time is breakfast?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">荷物を預かってもらえますか。<\/span> <span class=\"exr\">nimotsu o azukatte moraemasu ka<\/span><\/td><td class=\"exe\">\"Could you hold my luggage?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">チェックアウトは何時ですか。<\/span> <span class=\"exr\">chekkuauto wa nan-ji desu ka<\/span><\/td><td class=\"exe\">\"What time is check-out?\"<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Ryokan customs &mdash; what surprises first-timers<\/h2>\n<table>\n  <thead><tr><th style=\"width:22%\">Thing<\/th><th style=\"width:20%\">Word<\/th><th style=\"width:58%\">What to do<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"fn\">Shoes off<\/td><td><span class=\"cjk\">玄関<\/span> <span class=\"exr\">genkan<\/span><\/td><td class=\"exe\">Remove shoes at the entrance step; switch to provided slippers. On <span class=\"cjk\">畳<\/span> (tatami) even slippers come off &mdash; socks or bare feet only.<\/td><\/tr>\n    <tr><td class=\"fn\">The robe<\/td><td><span class=\"cjk\">浴衣<\/span> <span class=\"exr\">yukata<\/span><\/td><td class=\"exe\">Provided; worn to dinner and around the inn. Wrap <b>left flap over right<\/b>. Tie with the <span class=\"cjk\">帯<\/span> (obi).<\/td><\/tr>\n    <tr><td class=\"fn\">Bedding<\/td><td><span class=\"cjk\">布団<\/span> <span class=\"exr\">futon<\/span><\/td><td class=\"exe\">Staff lay it out on the tatami while you&#39;re at dinner &mdash; you don&#39;t do it yourself, and it&#39;s put away in the morning.<\/td><\/tr>\n    <tr><td class=\"fn\">Dinner<\/td><td><span class=\"cjk\">懐石<\/span> <span class=\"exr\">kaiseki<\/span><\/td><td class=\"exe\">A multi-course set meal at a fixed time you choose at check-in. <span class=\"cjk\">夕食<\/span> (yūshoku) dinner, <span class=\"cjk\">朝食<\/span> (chōshoku) breakfast.<\/td><\/tr>\n    <tr><td class=\"fn\">Curfew<\/td><td><span class=\"cjk\">門限<\/span> <span class=\"exr\">mongen<\/span><\/td><td class=\"exe\">Some traditional inns lock up late at night &mdash; check the hour if you&#39;re going out after dinner.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Onsen etiquette &mdash; the rules that matter<\/h2>\n<div class=\"cards2\">\n  <div class=\"card\">\n    <h3>Before you get in<\/h3>\n    <p><b>Wash first, fully.<\/b> Sit at the <span class=\"cjk\">洗い場<\/span> <span class=\"romaji\">(araiba)<\/span>, soap and rinse\n    completely, <i>then<\/i> enter. The bath is for soaking, never washing.<\/p>\n    <p><b>No swimsuit<\/b> &mdash; you bathe nude. The small <span class=\"cjk\">手ぬぐい<\/span> <span class=\"romaji\">(tenugui)<\/span>\n    towel stays <i>out<\/i> of the water; rest it on your head or the ledge.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3>Which bath, and tattoos<\/h3>\n    <p><span class=\"cjk jp\">男湯<\/span> <span class=\"romaji\">(otoko-yu)<\/span> = men&#39;s, <span class=\"cjk jp\">女湯<\/span>\n    <span class=\"romaji\">(onna-yu)<\/span> = women&#39;s. Read the curtain &mdash; <span class=\"cjk jp\">湯<\/span> here is \"hot water,\"\n    not soup (your false-friend trap).<\/p>\n    <p><b>Tattoos<\/b> <span class=\"cjk\">(タトゥー, tatū)<\/span> are still barred at many onsen. Check ahead, or ask for a\n    <span class=\"cjk\">貸切風呂<\/span> <span class=\"romaji\">(kashikiri-buro)<\/span> &mdash; a private, reservable bath.<\/p>\n  <\/div>\n<\/div>\n\n<h2>Phrases you&#39;ll actually use<\/h2>\n<table>\n  <tbody>\n    <tr><td style=\"width:50%\"><span class=\"cjk exj\">温泉はいつ入れますか。<\/span> <span class=\"exr\">onsen wa itsu hairemasu ka<\/span><\/td><td class=\"exe\">\"When can I use the onsen?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">夕食は何時ですか。<\/span> <span class=\"exr\">yūshoku wa nan-ji desu ka<\/span><\/td><td class=\"exe\">\"What time is dinner?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">タトゥーがありますが、大丈夫ですか。<\/span> <span class=\"exr\">tatū ga arimasu ga, daijōbu desu ka<\/span><\/td><td class=\"exe\">\"I have a tattoo &mdash; is it OK?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">貸切風呂はありますか。<\/span> <span class=\"exr\">kashikiri-buro wa arimasu ka<\/span><\/td><td class=\"exe\">\"Is there a private bath?\"<\/td><\/tr>\n    <tr><td><span class=\"cjk exj\">アレルギーがあります。<\/span> <span class=\"exr\">arerugī ga arimasu<\/span><\/td><td class=\"exe\">\"I have an allergy.\" (tell them before kaiseki)<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2>Signs you&#39;ll see<\/h2>\n<div class=\"kgrid6\">\n  <div class=\"kcell\"><span class=\"k cjk\">温泉<\/span> <span class=\"r\">onsen<\/span><span class=\"m\">hot spring<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">大浴場<\/span> <span class=\"r\">daiyokujō<\/span><span class=\"m\">large bath<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">露天風呂<\/span> <span class=\"r\">rotenburo<\/span><span class=\"m\">open-air bath<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">貸切<\/span> <span class=\"r\">kashikiri<\/span><span class=\"m\">private / reserved<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">空室<\/span> <span class=\"r\">kūshitsu<\/span><span class=\"m\">vacancy<\/span><\/div>\n  <div class=\"kcell\"><span class=\"k cjk\">満室<\/span> <span class=\"r\">manshitsu<\/span><span class=\"m\">full / no rooms<\/span><\/div>\n<\/div>\n\n<div class=\"zhbox\"><div class=\"hd\">The four \"don&#39;t get it wrong\" items<\/div>\n<b>Yukata left-over-right<\/b> &mdash; right-over-left is only for dressing the dead. &nbsp;\n<b>Wash before the bath<\/b>, towel out of the water. &nbsp;\n<b>Check tattoo policy<\/b> before you undress, not after. &nbsp;\n<b>No tipping<\/b> &mdash; at a ryokan a genuine <span class=\"cjk\">ありがとうございます<\/span> <span class=\"romaji\">(arigatō gozaimasu)<\/span>\nis the right currency, not cash.\n<\/div>\n<\/body><\/html>"}, {"id": "wagyu", "title": "Wagyu & the Grill", "kanji": "牛", "sub": "Grades, brands, cuts & the grill", "text": "reading a wagyu menu wagyu (和牛 wagyū) is graded like a5 , a4 the letter (a c) is only yield ignore it. the number (1 5) is the quality: marbling, colour, firmness, fat. a5 is the top, but it's also the richest intense fat means a little goes a long way . across a trip, mixing an a4 or a leaner cut in keeps it from getting heavy. kyushu is a wagyu heartland, so you're in the right place. the brands you'll actually meet kyushu punches far above its weight the first three are on your route or nearby. 佐賀牛 saga-gyū saga beef famously strict standards, right in the saga region you're driving through. 宮崎牛 miyazaki-gyū miyazaki beef a repeat wagyu olympics champion; all over kyushu menus. 鹿児島黒牛 kagoshima kuroushi kagoshima black beef kyushu's volume heavyweight, excellent value. 神戸 / 松阪 / 近江 kōbe / matsusaka / ōmi the famous mainland \"big names\" more likely to surface in tokyo kyoto. the preparations know what you're ordering 焼肉 yakiniku you grill your own bite-size cuts over charcoal. order by the cut; sear briefly wagyu wants seconds, not minutes. 鉄板焼き teppanyaki a chef cooks steak on an iron griddle in front of you. your kyoto finale idea lives here. しゃぶしゃぶ shabu-shabu swish paper-thin slices through hot dashi for a few seconds, then dip in ponzu or sesame. すき焼き sukiyaki simmered in sweet soy, then dipped in raw egg . richer and sweeter than shabu-shabu. ステーキ sutēki straight steak. \"rare medium\" lets the marbling do the work. cuts, for ordering yakiniku カルビ karubi short rib fatty, rich ロース rōsu loin leaner, balanced ハラミ harami skirt beefy, tender タン tan tongue start here, salt lemon 霜降り shimofuri \"frost-fall\" marbled 赤身 akami lean red meat balances the fat ordering asking おすすめは何ですか osusume wa nan desu ka \"what do you recommend?\" a5はありますか a-faibu wa arimasu ka \"do you have a5?\" (swap in any grade or cut) 赤身の多いものはどれですか akami no ōi mono wa dore desu ka \"which is the leaner one?\" (when the fat's adding up) 同じものをもう一つ onaji mono o mō hitotsu \"another of the same, please.\" 焼いてもらえますか yaite moraemasu ka \"could you grill it for me?\" (at counters that offer it) your chinese eye on the menu you already read most of this: 牛 (gyū) is beef, same as chinese; 焼 (yaki) grilled; 鉄板 (teppan) iron plate; 赤身 (akami) \"red meat\" reads exactly as it looks. the one to learn is 霜降り (shimofuri) literally \"frost falling,\" the poetic word for marbling. wagyu beef gyu a5 a4 saga miyazaki kagoshima kobe yakiniku teppanyaki shabu sukiyaki steak karubi rosu harami tan marbling shimofuri akami grill", "section": "ground", "group": "Food & stays",
